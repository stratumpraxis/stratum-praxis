<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive">
<title>Open Your Paid Insight | Stratum Praxis</title>
<style>:root{color-scheme:dark;--bg:#090b0e;--panel:#11151a;--line:#2c333b;--text:#edf1f5;--muted:#a9b2bc;--accent:#d7dde5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 Inter,system-ui,-apple-system,sans-serif}.w{max-width:680px;margin:auto;padding:72px 22px}.ey{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(2.3rem,7vw,4.3rem);line-height:1.03;margin:.35em 0}.lead{color:var(--muted);font-size:1.08rem}.card{margin-top:32px;padding:24px;border:1px solid var(--line);background:var(--panel);border-radius:16px}label{display:block;font-weight:700;margin-bottom:8px}input{width:100%;padding:13px 14px;border-radius:9px;border:1px solid var(--line);background:#090b0e;color:var(--text);font:inherit}button{width:100%;margin-top:13px;padding:14px;border:0;border-radius:9px;background:var(--accent);color:#090b0e;font-weight:800;cursor:pointer}.msg{margin-top:14px;color:var(--muted)}.err{color:#ffb4b4}.fine{font-size:12px;color:var(--muted);margin-top:24px}</style>
</head><body><main class="w"><div class="ey">STRATUM PRAXIS · PAID INSIGHTS</div><h1>Payment received.</h1><p class="lead">Verify the email address used at Stripe Checkout to open your private full edition.</p><section class="card"><form id="verify"><label for="email">Purchase email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><button id="go" type="submit">Verify purchase and open full edition</button></form><div id="msg" class="msg" aria-live="polite"></div></section><p class="fine">Your payment is verified directly against Stripe. The full article is not stored as a public page.</p></main><script>
const qs=new URLSearchParams(location.search),sid=qs.get('session_id')||'',form=document.getElementById('verify'),msg=document.getElementById('msg'),btn=document.getElementById('go');
if(!sid.startsWith('cs_')){msg.className='msg err';msg.textContent='Checkout session is missing. Open this page from the completed Stripe Checkout.';btn.disabled=true}
form.addEventListener('submit',async e=>{e.preventDefault();if(!sid.startsWith('cs_'))return;btn.disabled=true;msg.className='msg';msg.textContent='Verifying purchase…';try{const r=await fetch('https://ai-consultant-verify.practicalaireport.workers.dev/paid-insights/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,email:document.getElementById('email').value.trim()})});const x=await r.json();if(!r.ok||!x.workspace_url)throw new Error(x.error||'Purchase verification failed.');msg.textContent='Verified. Opening your full edition…';location.href=x.workspace_url}catch(err){msg.className='msg err';msg.textContent=err.message||'Purchase verification failed.';btn.disabled=false}});
</script></body></html>
