<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Social Revenue Pathfinder | SNS流入を次の収益行動へ</title><meta name="description" content="SNSから来た人を、目的に合う無料・低価格・ROI・業務監査の経路へ振り分ける無料診断。"><link rel="canonical" href="https://stratumpraxis.com/social-revenue-pathfinder-ja.html"><link rel="alternate" hreflang="en" href="https://stratumpraxis.com/social-revenue-pathfinder.html"><link rel="alternate" hreflang="ja" href="https://stratumpraxis.com/social-revenue-pathfinder-ja.html"><link rel="stylesheet" href="styles.css"><script defer src="scos-analytics.js"></script></head><body><main><section class="hero"><div class="container"><p class="eyebrow">無料・約60秒</p><h1>SNSで見つけた情報を、次の収益行動へ。</h1><p class="hero-text">目的に近いものを選ぶだけ。無理に商品へ誘導せず、最も近い既存ルートを提示します。</p><div class="card-grid" id="choices"><button class="card" data-route="learn"><h3>まず構造を理解したい</h3><p>情報収集・学習段階。</p></button><button class="card" data-route="route"><h3>情報を収益行動へ変えたい</h3><p>調査結果はあるが次の一手が曖昧。</p></button><button class="card" data-route="roi"><h3>AI投資の価値を判断したい</h3><p>費用対効果・優先順位を整理したい。</p></button><button class="card" data-route="audit"><h3>チームの業務を改善したい</h3><p>高コストなワークフローを監査したい。</p></button></div><div class="card" id="result" hidden><p class="eyebrow">推奨ルート</p><h2 id="resultTitle"></h2><p id="resultText"></p><a class="button button-primary" id="resultLink" href="#">このルートを見る</a></div><p class="fine">判断支援のみ。収益や成果を保証するものではありません。英語版は <a href="social-revenue-pathfinder.html">こちら</a>。</p></div></section></main><script>const routes={learn:['無料ツールから始める','まず課題を具体化し、必要な場合だけ有料ルートへ進みます。','/#tools'],route:['Revenue Router — $29','検証済みのシグナルを、既存の収益経路へ優先順位付きで振り分けます。','revenue-router.html'],roi:['AI Value Realization Kit — $39','AI支出・価値・優先順位を数字で整理するルートです。','ai-value-realization-kit.html'],audit:['Workflow Audit — $499','チームの高コストな業務フローを監査するB2Bルートです。','workflow-audit.html']};document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{const r=routes[b.dataset.route];document.getElementById('resultTitle').textContent=r[0];document.getElementById('resultText').textContent=r[1];const a=document.getElementById('resultLink');a.href=r[2];a.dataset.event='pathfinder_route_click';a.dataset.route=b.dataset.route;document.getElementById('result').hidden=false;document.getElementById('result').scrollIntoView({behavior:'smooth'});});</script></body></html>
