<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>AI Council Builder 日本語版 — 購入確認</title><style>:root{--b:#090b0e;--p:#12161c;--t:#f3f5f7;--m:#aab2bc;--l:#2a3139}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:16px/1.7 system-ui,-apple-system,"Noto Sans JP",sans-serif}.w{max-width:720px;margin:auto;padding:60px 18px}.brand{font-size:12px;letter-spacing:.12em;color:var(--m)}h1{font-size:clamp(36px,7vw,60px);line-height:1.08}.card{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:22px}.m{color:var(--m)}label{display:block;margin:18px 0 8px;font-weight:700}input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--l);background:#0d1014;color:var(--t);font-size:16px}button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;font-weight:800;cursor:pointer}.bad{color:#ffb4b4}.good{color:#c7f9d4}</style><script defer src="scos-analytics.js"></script></head><body data-funnel="ai_council_builder_ja_access" data-product="ai_council_builder_ja"><main class="w"><div class="brand">STRATUM PRAXIS · 購入確認付き納品</div><h1>日本語版ワークスペースを開く</h1><p class="m">Stripeの決済セッションをサーバー側で確認します。購入時に使ったメールアドレスを入力してください。</p><section class="card"><div id="status" class="m" aria-live="polite">確認待ちです。</div><label for="email">購入時のメールアドレス</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><button id="open">購入を確認して開く</button></section><p class="m">この公開ページ自体には有料コンテンツを置いていません。AIサービスのパスワードやAPIキーは求めません。</p></main><script>const API='https://ai-consultant-verify.stratumpraxis.workers.dev';const sid=new URLSearchParams(location.search).get('session_id');const status=document.getElementById('status'),button=document.getElementById('open');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!sid||!sid.startsWith('cs_')){status.innerHTML='<span class="bad">Checkout Session IDが見つかりません。Stripe決済完了後のページから開いてください。</span>';button.disabled=true;window.addEventListener('load',()=>window.scosCapture&&window.scosCapture('access_denied',{product:'ai_council_builder_ja',reason:'missing_session'}),{once:true});}button.addEventListener('click',async()=>{const email=document.getElementById('email').value.trim();if(!email){status.innerHTML='<span class="bad">購入時のメールアドレスを入力してください。</span>';return}button.disabled=true;status.textContent='決済と購入メールを確認しています…';window.scosCapture&&window.scosCapture('verification_submit',{product:'ai_council_builder_ja'});try{const r=await fetch(API+'/council-ja/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,email})});const x=await r.json();if(!r.ok||!x.authorized||!x.workspace_url)throw new Error(x.error||'購入確認に失敗しました');window.scosCapture&&window.scosCapture('access_granted',{product:'ai_council_builder_ja'});status.innerHTML='<span class="good">確認できました。専用ワークスペースを開きます…</span>';setTimeout(()=>location.assign(x.workspace_url),180)}catch(e){const reason=String(e.message||'verification_failed').slice(0,120);window.scosCapture&&window.scosCapture('access_denied',{product:'ai_council_builder_ja',reason});status.innerHTML='<span class="bad">'+esc(reason)+'</span>';button.disabled=false}});</script></body></html>
