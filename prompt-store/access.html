<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Buyer Access | Prompt Store</title><style>body{margin:0;background:#090b0e;color:#f4f5f6;font:16px/1.6 system-ui}.w{max-width:650px;margin:auto;padding:45px 18px}.m{color:#aab0b8}.card{background:#12161b;border:1px solid #30363d;border-radius:18px;padding:22px}input{width:100%;padding:13px;margin:7px 0 14px;background:#090b0e;color:#fff;border:1px solid #3a414a;border-radius:9px}button{padding:13px 16px;border:0;border-radius:10px;font-weight:900}</style></head><body><main class="w"><p class="m">STRATUM PRAXIS · VERIFIED BUYER ACCESS</p><h1>Open your Prompt Bundle</h1><div class="card"><p>Enter the same email used at Stripe Checkout. Your Checkout Session ID has been filled automatically after purchase.</p><label>Checkout Session ID</label><input id="sid"><label>Checkout email</label><input id="email" type="email" autocomplete="email"><button id="go">Verify purchase</button><p id="msg" class="m"></p></div></main><script>const q=new URLSearchParams(location.search);sid.value=q.get('session_id')||'';go.onclick=async()=>{msg.textContent='Verifying…';try{const r=await fetch('https://ai-consultant-verify.practicalaireport.workers.dev/prompt-store/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid.value.trim(),email:email.value.trim()})});const x=await r.json();if(!r.ok)throw Error(x.error||'Verification failed');location.href=x.workspace_url}catch(e){msg.textContent=e.message}}</script></body></html>
