<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit / Human Gate</title><style>
:root{--bg:#f5f7fb;--card:#fff;--line:#dfe5ee;--text:#162033;--muted:#6e7a8f;--ok:#168a57;--okbg:#e8f7f0;--warn:#9a6b00;--warnbg:#fff5d7;--bad:#ba384b;--badbg:#fdecef;--soft:#eef2f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}main{max-width:1180px;margin:auto;padding:24px 16px 64px}header{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{margin:0;font-size:clamp(28px,5vw,44px)}.sub,.meta{color:var(--muted);font-size:12px}.auth{display:flex;gap:8px;flex-wrap:wrap}.auth input,.auth button{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 11px;font:inherit}.auth button{font-weight:800}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.nav a{border:1px solid var(--line);background:#fff;color:var(--text);text-decoration:none;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:800}.nav a.active{background:#162033;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(max-width:850px){.grid{grid-template-columns:1fr}}.section{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}.section h2{margin:0;font-size:18px}.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:9px}.human{border-color:#efb4be;background:#fff8f9}.deferred{border-color:#ecd68d;background:#fffdf5}.ai{border-color:#b8e2cc;background:#f8fffb}.title{font-weight:900}.reason{font-size:12px;color:var(--muted);line-height:1.5;margin-top:6px}.resume{font-size:12px;line-height:1.5;margin-top:6px}.badge{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800}.b-human{background:var(--badbg);color:var(--bad)}.b-wait{background:var(--warnbg);color:var(--warn)}.b-ai{background:var(--okbg);color:var(--ok)}.btn{display:inline-block;text-decoration:none;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:7px 9px;font-size:11px;font-weight:800;background:#fff;margin-top:8px}.empty{padding:16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center;margin-top:8px}#msg{font-size:12px;color:var(--muted);margin:8px 0}</style></head><body><main>
<header><div><h1>Audit / Human Gate</h1><div class="sub">監査担当｜「本当にあなたが必要？」を毎回再判定</div></div><div class="auth"><input id="key" type="password" placeholder="監視キー"><button onclick="connect()">接続</button><button onclick="load()">更新</button></div></header>
<nav class="nav"><a href="index.html">Operations</a><a href="trends.html">Trend Radar</a><a class="active" href="audit.html">Audit / Human Gate</a></nav><div id="msg">監視キーを入力してください。</div>
<div class="grid"><section class="section"><h2>今すぐあなたが必要</h2><div id="human"></div></section><section class="section"><h2>将来Gate</h2><div class="sub">今は触らなくていい</div><div id="deferred"></div></section><section class="section"><h2>AI側</h2><div class="sub">Human Gateではない</div><div id="ai"></div></section></div>
<section class="section"><h2>最近の監査結果</h2><div id="audits"></div></section>
</main><script>
const API='https://fzqgpaxqolrjjhmxdcrf.supabase.co/functions/v1/company-monitor/api/audit';const $=id=>document.getElementById(id);$('key').value=localStorage.getItem('monitor_key')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const time=t=>t?new Date(t).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';function connect(){localStorage.setItem('monitor_key',$('key').value.trim());load()}
function card(a,cls,label){return '<div class="item '+cls+'"><div style="display:flex;justify-content:space-between;gap:8px"><div class="title">'+esc(a.action_label||a.title)+'</div><span class="badge '+(cls==='human'?'b-human':cls==='deferred'?'b-wait':'b-ai')+'">'+label+'</span></div><div class="meta">'+esc(a.source_unit_id)+' · '+esc(a.task_status)+' · '+esc(a.action_class)+'</div><div class="reason">'+esc(a.reason||'')+'</div>'+(a.resume_hint?'<div class="resume"><b>その後:</b> '+esc(a.resume_hint)+'</div>':'')+(a.action_url?'<a class="btn" target="_blank" href="'+esc(a.action_url)+'">対象URLを開く ↗</a>':'')+'</div>'}
async function load(){const key=localStorage.getItem('monitor_key')||$('key').value.trim();if(!key){$('msg').textContent='監視キーを入力してください。';return}try{const r=await fetch(API,{headers:{Authorization:'Bearer '+key}});const d=await r.json();if(!r.ok)throw new Error(d.error||'読込失敗');$('human').innerHTML=d.human_now.length?d.human_now.map(x=>card(x,'human','今すぐ')).join(''):'<div class="empty">今すぐ必要なHuman Gateなし</div>';$('deferred').innerHTML=d.deferred.length?d.deferred.map(x=>card(x,'deferred','今は不要')).join(''):'<div class="empty">将来Gateなし</div>';$('ai').innerHTML=d.ai_side.length?d.ai_side.map(x=>card(x,'ai','AI側')).join(''):'<div class="empty">AI側未完了なし</div>';$('audits').innerHTML=d.latest_audits.length?d.latest_audits.map(a=>'<div class="item"><div class="title">'+esc(a.title)+'</div><div class="meta">'+time(a.occurred_at)+' · '+esc(a.confidence)+'</div><div class="reason">'+esc(a.detail)+'</div></div>').join(''):'<div class="empty">監査履歴なし</div>';$('msg').textContent='接続済み · '+time(d.generated_at)}catch(e){$('msg').textContent='接続できません: '+e.message}}
if(localStorage.getItem('monitor_key'))load();setInterval(()=>{if(localStorage.getItem('monitor_key'))load()},30000);
</script></body></html>
