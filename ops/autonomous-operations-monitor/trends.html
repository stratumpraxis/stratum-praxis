<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trend Radar｜Autonomous Operations Monitor</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--line:#dfe5ee;--text:#162033;--muted:#6e7a8f;--ok:#168a57;--okbg:#e8f7f0;--warn:#9a6b00;--warnbg:#fff5d7;--bad:#ba384b;--badbg:#fdecef;--blue:#2357c7;--bluebg:#eaf0ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}main{max-width:1180px;margin:auto;padding:24px 16px 64px}header{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{margin:0;font-size:clamp(28px,5vw,44px);letter-spacing:-.04em}.sub{color:var(--muted);font-size:13px;margin-top:7px}.auth{display:flex;gap:8px;flex-wrap:wrap}.auth input,.auth button,select{border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 11px;font:inherit}.auth button{font-weight:800;cursor:pointer}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.nav a{border:1px solid var(--line);background:#fff;color:var(--text);text-decoration:none;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:800}.nav a.active{background:#162033;color:#fff}.section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}.section h2{margin:0;font-size:18px}.hint{color:var(--muted);font-size:12px;margin-top:3px}.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.statusGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(max-width:800px){.statusGrid{grid-template-columns:1fr}}.source{border:1px solid var(--line);border-radius:14px;padding:13px}.source .name{font-weight:900}.badge{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800}.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}.blue{background:var(--bluebg);color:var(--blue)}.signals{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(max-width:760px){.signals{grid-template-columns:1fr}}.sig{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.title{font-size:17px;font-weight:900}.meta{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.btn{display:inline-block;text-decoration:none;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:7px 9px;font-size:11px;font-weight:800;background:#fff;margin-top:9px}.pager{display:flex;justify-content:center;gap:8px;align-items:center;margin-top:14px}.pager button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;font-weight:800;cursor:pointer}.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}#msg{font-size:12px;color:var(--muted);margin:8px 0}
</style></head><body><main>
<header><div><h1>Trend Radar</h1><div class="sub">最新市場レーダー｜Google Trends / YouTube / X系Public SignalsをProject別に見る</div></div><div class="auth"><input id="key" type="password" placeholder="監視キー"><button onclick="connect()">接続</button><button onclick="load()">更新</button></div></header>
<nav class="nav"><a href="index.html">Operations</a><a class="active" href="trends.html">Trend Radar</a><a href="audit.html">Audit / Human Gate</a></nav>
<div id="msg">監視キーを入力してください。</div>
<section class="section"><div class="filters">
<select id="project" onchange="changeFilter()">
<option value="ALL">全Project</option><option value="stratum">Stratum</option><option value="vector">Vector</option><option value="gwr">GWR</option><option value="ai-practical">AI Practical</option><option value="product-ai-app-builder-router-2026">AI App Builder Router</option><option value="forwelle">YouTube / Forwelle</option><option value="sovlta">SOVLTA</option><option value="media-store">Media Store</option><option value="lingua-flow">Lingua Flow</option><option value="harmony">Harmony</option><option value="site-production">サイト制作</option><option value="app-production">アプリ制作</option><option value="pochipochi-revenue">ぽちぽち収益</option><option value="github-pochipochi">GitHubぽちぽち</option><option value="video-pochipochi">動画生成ぽちぽち</option>
</select>
<select id="source" onchange="changeFilter()"><option value="ALL">全Source</option><option value="GOOGLE_TRENDS">Google Trends</option><option value="YOUTUBE_PUBLIC_TRENDING">YouTube Public</option><option value="YOUTUBE_SEARCH_BRIDGE">YouTube Search Bridge</option><option value="X_PROXY_TRENDS24">X Trend Proxy</option></select>
<span class="hint">TrendはPublic Attention。Buyer Signalには自動昇格しません。</span>
</div></section>
<section class="section"><h2>Source Health</h2><div class="hint">取得元が本当に生きているかを分離表示</div><div id="sourceStatus" class="statusGrid" style="margin-top:12px"></div></section>
<section class="section"><h2>最新Signal</h2><div id="summary" class="hint"></div><div id="signals" class="signals" style="margin-top:12px"></div><div id="pager" class="pager"></div></section>
</main><script>
const API='https://fzqgpaxqolrjjhmxdcrf.supabase.co/functions/v1/company-monitor/api/trends';const $=id=>document.getElementById(id);$('key').value=localStorage.getItem('monitor_key')||'';
let page=1;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const time=t=>t?new Date(t).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
function connect(){localStorage.setItem('monitor_key',$('key').value.trim());load()}function changeFilter(){page=1;load()}
function sourceName(x){return x==='GOOGLE_TRENDS'?'Google Trends':x==='YOUTUBE_PUBLIC_TRENDING'?'YouTube Public Trending':x==='YOUTUBE_SEARCH_BRIDGE'?'YouTube Search Bridge':x==='X_PROXY_TRENDS24'?'X Trend Proxy (trends24)':'Unknown'}
async function load(){const key=localStorage.getItem('monitor_key')||$('key').value.trim();if(!key){$('msg').textContent='監視キーを入力してください。';return}$('msg').textContent='最新Trendを読込中…';const url=API+'?project='+encodeURIComponent($('project').value)+'&source='+encodeURIComponent($('source').value)+'&page='+page+'&page_size=20';try{const r=await fetch(url,{headers:{Authorization:'Bearer '+key}});const d=await r.json();if(!r.ok)throw new Error(d.error||'読込失敗');render(d)}catch(e){$('msg').textContent='接続できません: '+e.message}}
function render(d){$('sourceStatus').innerHTML=(d.source_status||[]).map(s=>'<div class="source"><div style="display:flex;justify-content:space-between;gap:8px"><div class="name">'+esc(sourceName(s.source))+'</div><span class="badge '+(s.status==='OK'?'ok':s.status==='PARTIAL'?'warn':'bad')+'">'+esc(s.status)+'</span></div><div class="meta">取得 '+esc(s.item_count)+'件 · 最終成功 '+time(s.last_success_at)+(s.last_error?'<br>'+esc(s.last_error):'')+'</div></div>').join('');
$('summary').textContent=d.total+'件 · '+d.page+'/'+d.pages+'ページ · '+time(d.generated_at);
$('signals').innerHTML=d.items.length?d.items.map(x=>'<div class="sig"><div style="display:flex;justify-content:space-between;gap:8px"><div class="title">'+esc(x.title)+'</div><span class="badge blue">'+esc(sourceName(x.source))+'</span></div><div class="meta">'+(x.metric?'勢い: '+esc(x.metric)+' · ':'')+'観測 '+time(x.observed_at)+' · 更新 '+time(x.last_seen_at)+'</div><div class="tags">'+((x.project_tags||[]).length?(x.project_tags||[]).map(t=>'<span class="badge ok">'+esc(t)+'</span>').join(''):'<span class="badge warn">市場全体</span>')+'</div>'+(x.url?'<a class="btn" target="_blank" href="'+esc(x.url)+'">Sourceを開く ↗</a>':'')+'</div>').join(''):'<div class="empty">このFilterに一致する最新Signalはありません。</div>';
$('pager').innerHTML=(d.page>1?'<button onclick="page--;load()">← 前へ</button>':'')+'<span class="hint">'+d.page+' / '+d.pages+'</span>'+(d.page<d.pages?'<button onclick="page++;load()">次へ →</button>':'');$('msg').textContent='接続済み · '+time(d.generated_at)}
if(localStorage.getItem('monitor_key'))load();setInterval(()=>{if(localStorage.getItem('monitor_key'))load()},60000);
</script></body></html>
