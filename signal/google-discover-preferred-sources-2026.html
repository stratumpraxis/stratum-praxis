<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Google Discover / Preferred Sources | Signal Praxis</title><link rel="canonical" href="https://stratumpraxis.com/signal/google-discover-preferred-sources-2026.html"><meta name="robots" content="index,follow,max-image-preview:large"><style>:root{--bg:#07090d;--p:#101722;--t:#f8fafc;--m:#9ca3af;--l:#293446}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.78 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:860px;margin:auto;padding:28px 20px 90px}a{color:#dbeafe}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.back{font-size:13px;color:var(--m)}select{background:#0d121a;color:#fff;border:1px solid var(--l);border-radius:999px;padding:7px 10px}h1{font-size:clamp(36px,7vw,62px);line-height:1.07;margin:32px 0 18px}.lead{font-size:20px;color:#d4d4d8}.box,.item{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:18px 20px;margin:20px 0}h2{margin-top:42px}.fine{font-size:13px;color:var(--m)}.cta{display:inline-block;background:#fff;color:#090c11;padding:11px 15px;border-radius:9px;font-weight:800;text-decoration:none}</style></head><body><main><div class="top"><a class="back" href="./">← Signal Praxis</a><select id="lang"><option value="ja">日本語</option><option value="en">English</option><option value="es">Español</option></select></div><h1 data-k="title"></h1><p class="lead" data-k="lead"></p><div class="box"><b data-k="boxTitle"></b><br><span data-k="boxText"></span></div><h2 data-k="h1"></h2><p data-k="p1"></p><h2 data-k="h2"></h2><div class="item" data-k="targets"></div><h2 data-k="h3"></h2><div class="item" data-k="avoid"></div><h2 data-k="sources"></h2><p class="fine"><a href="https://developers.google.com/search/docs/appearance/google-discover" rel="noopener noreferrer">Google Search Central — Discover</a><br><a href="https://developers.google.com/search/updates" rel="noopener noreferrer">Google Search updates</a></p><a class="cta" href="../ai-council-builder-ja.html" data-k="cta"></a></main><script>const T={ja:{title:'Google Discover / Preferred Sourcesで独立サイトが取るべき設計',lead:'Discoverは申請して載せてもらう広告枠ではありません。検索にインデックスされ、ポリシーを満たすコンテンツが候補になります。',boxTitle:'最初から入れるもの',boxText:'明確なタイトル、内容に合う説明、canonical、クロール可能な内部リンク、max-image-preview:large、大きな高品質画像を使える記事設計。',h1:'Preferred Sourcesをどう見る？',p1:'読者に選ばれる導線としては有用ですが、検索順位保証ではありません。まずは「このサイトに戻ってくる理由」を作る方が重要です。',h2:'Signal Praxisで狙う記事',targets:'・新機能の一次情報＋誰に影響するか<br>・料金変更 / 終了 / 代替の比較<br>・海外情報＋日本での影響<br>・ツールの重複 / コスト / 選び方',h3:'避けるもの',avoid:'・煽りタイトルだけの記事<br>・他サイト要約だけの記事<br>・似たAI記事の大量生成<br>・出典不明の収益成功談',sources:'公式ソース',cta:'AIの使い分けを診断する'},en:{title:'How independent sites should design for Google Discover / Preferred Sources',lead:'Discover is not an ad slot you apply for. Indexed, policy-compliant content can become eligible, but appearance is never guaranteed.',boxTitle:'Build these in from day one',boxText:'Accurate titles, matching descriptions, canonical URLs, crawlable internal links, max-image-preview:large, and an image system capable of strong large visuals.',h1:'How to think about Preferred Sources',p1:'It can strengthen repeat discovery, but it is not a ranking guarantee. The better question is whether readers have a reason to choose your source again.',h2:'What Signal Praxis should publish',targets:'• Primary-source product changes + who is affected<br>• Price changes / shutdowns / alternatives<br>• Global updates with local implications<br>• Tool overlap / cost / decision guides',h3:'What we avoid',avoid:'• Clickbait-only headlines<br>• Articles that merely summarize another site<br>• Mass near-duplicate AI pages<br>• Unverified income-success claims',sources:'Official sources',cta:'Organize your AI roles'},es:{title:'Cómo diseñar un sitio independiente para Google Discover / Preferred Sources',lead:'Discover no es un espacio publicitario al que se solicita acceso. El contenido indexado y compatible con las políticas puede ser elegible, sin garantía de aparición.',boxTitle:'Incluye esto desde el principio',boxText:'Títulos precisos, descripciones coherentes, canonical, enlaces internos rastreables, max-image-preview:large y un sistema de imágenes grandes de calidad.',h1:'Cómo pensar en Preferred Sources',p1:'Puede ayudar a que un lector vuelva a elegir tu fuente, pero no garantiza ranking. Lo importante es crear una razón para volver.',h2:'Qué debe publicar Signal Praxis',targets:'• Cambios de producto con fuente primaria + impacto<br>• Precios / cierres / alternativas<br>• Novedades globales con implicaciones locales<br>• Comparaciones de coste y elección de herramientas',h3:'Qué evitamos',avoid:'• Titulares solo para conseguir clics<br>• Resúmenes de otros sitios sin valor añadido<br>• Páginas de IA casi duplicadas a escala<br>• Historias de ingresos no verificadas',sources:'Fuentes oficiales',cta:'Organizar roles de IA'}};const s=document.getElementById('lang');s.value=localStorage.getItem('signal_lang')||'ja';function r(v){document.documentElement.lang=v;document.querySelectorAll('[data-k]').forEach(e=>e.innerHTML=T[v][e.dataset.k]);localStorage.setItem('signal_lang',v)}s.onchange=e=>r(e.target.value);r(s.value);</script></body></html>
