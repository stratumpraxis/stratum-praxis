<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">RustChain Proof-of-Antiquity explainer</title>
  <desc id="desc">A flowchart explaining one CPU one vote, antiquity weighting, six hardware fingerprint checks, anti-emulation, and how to start with clawrtc.</desc>
  <defs>
    <style>
      .bg{fill:#0b0d10}.panel{fill:#151922;stroke:#5b6573;stroke-width:2}.accent{fill:#d7dde7}.muted{fill:#9aa5b1}.good{fill:#b6f3c7}.warn{fill:#ffd98a}.line{stroke:#7d8794;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .h1{font:700 54px system-ui,-apple-system,Segoe UI,sans-serif}.h2{font:700 30px system-ui,-apple-system,Segoe UI,sans-serif}.body{font:500 23px system-ui,-apple-system,Segoe UI,sans-serif}.small{font:500 19px system-ui,-apple-system,Segoe UI,sans-serif}.mono{font:600 22px ui-monospace,SFMono-Regular,Menlo,monospace}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7d8794"/></marker>
  </defs>
  <rect class="bg" width="1600" height="1000"/>
  <text x="800" y="78" text-anchor="middle" class="h1 accent">Proof-of-Antiquity in 60 seconds</text>
  <text x="800" y="118" text-anchor="middle" class="body muted">RustChain rewards real hardware — and gives older machines more weight.</text>

  <rect x="90" y="180" rx="24" ry="24" width="420" height="190" class="panel"/>
  <text x="300" y="230" text-anchor="middle" class="h2 accent">1 CPU = 1 vote</text>
  <text x="300" y="275" text-anchor="middle" class="body muted">Each physical CPU contributes one vote.</text>
  <text x="300" y="320" text-anchor="middle" class="body good">Antiquity multiplies its weight.</text>

  <rect x="590" y="180" rx="24" ry="24" width="920" height="360" class="panel"/>
  <text x="1050" y="230" text-anchor="middle" class="h2 accent">6-check hardware fingerprint</text>
  <text x="650" y="285" class="body accent">1. Clock-skew & oscillator drift</text>
  <text x="650" y="330" class="body accent">2. Cache timing fingerprint</text>
  <text x="650" y="375" class="body accent">3. SIMD unit identity</text>
  <text x="1060" y="285" class="body accent">4. Thermal drift entropy</text>
  <text x="1060" y="330" class="body accent">5. Instruction-path jitter</text>
  <text x="1060" y="375" class="body accent">6. Anti-emulation detection</text>
  <text x="1050" y="450" text-anchor="middle" class="small muted">The validator cross-checks claimed architecture against physical timing, thermal and instruction behavior.</text>
  <text x="1050" y="488" text-anchor="middle" class="small warn">VMs / emulators are detected and heavily penalized instead of receiving normal vintage weight.</text>

  <path d="M510 275 C550 275 550 275 590 275" class="line"/>

  <rect x="90" y="620" rx="24" ry="24" width="1420" height="200" class="panel"/>
  <text x="800" y="675" text-anchor="middle" class="h2 accent">Why antiquity matters</text>
  <text x="800" y="725" text-anchor="middle" class="body muted">New hardware can participate — but preserved vintage hardware receives a higher multiplier.</text>
  <text x="800" y="770" text-anchor="middle" class="body good">The incentive points toward keeping working machines alive instead of replacing them just to mine faster.</text>

  <rect x="355" y="865" rx="18" ry="18" width="890" height="78" class="panel"/>
  <text x="800" y="900" text-anchor="middle" class="body accent">Start here</text>
  <text x="800" y="930" text-anchor="middle" class="mono good">pip install clawrtc</text>

  <text x="35" y="980" class="small muted">Original explainer by @stratumpraxis · Source checked against Scottcjn/Rustchain README · 2026-09-09</text>
</svg>
