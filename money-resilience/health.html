<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Deployment Health｜Money Resilience</title><style>body{max-width:860px;margin:0 auto;padding:36px 20px;background:#0c1112;color:#e7efec;font:14px/1.7 system-ui,sans-serif}h1{font-size:28px}.muted{color:#80928d}.grid{display:grid;gap:8px;margin:24px 0}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:12px 14px;border:1px solid #263735;border-radius:12px}.ok{color:#7ce7c2}.bad{color:#ff9f91}.wait{color:#b7c2be}button{border:1px solid #36514b;background:#14201f;color:#e7efec;border-radius:10px;padding:10px 14px;cursor:pointer}code{color:#a8bbb5}</style></head><body><a href="/" style="color:#7ce7c2">← Money Resilience</a><h1>Deployment Health</h1><p class="muted">独立Deploy後の静的ルートと主要Assetを確認します。金融入力値や個人情報は送信しません。</p><button id="run">再チェック</button><div class="grid" id="list"></div><p id="summary" class="muted"></p><script>const paths=['/','/market-pulse.js','/vnext-polish.js','/experience-v2.js','/experience-v3.js','/resilience-utility-v3.js','/site-power.js','/guides/','/inflation/','/yen/','/cash-buffer/','/overseas-payment/','/methodology.html','/sources.html','/privacy.html','/faq.html','/terms.html','/about.html','/llms.txt','/robots.txt'];async function run(){const list=document.querySelector('#list');list.innerHTML='';let ok=0;for(const p of paths){const row=document.createElement('div');row.className='row';row.innerHTML='<code>'+p+'</code><span class="wait">checking</span>';list.appendChild(row);try{const r=await fetch(p,{cache:'no-store'});const s=row.querySelector('span');if(r.ok){ok++;s.textContent=r.status+' OK';s.className='ok'}else{s.textContent=r.status+' FAIL';s.className='bad'}}catch(e){const s=row.querySelector('span');s.textContent='NETWORK FAIL';s.className='bad'}}document.querySelector('#summary').textContent=ok+'/'+paths.length+' routes OK'+(ok===paths.length?' — static deployment healthy.':' — check failed routes above.')}document.querySelector('#run').addEventListener('click',run);run();</script></body></html>
