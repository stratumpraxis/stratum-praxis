<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>AI配置診断｜購入確認</title><style>:root{--b:#0b0d10;--p:#14171c;--l:#2b3038;--t:#f3f5f7;--m:#aeb5bf;--a:#d7dce2}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:15px/1.7 system-ui,-apple-system,"Noto Sans JP",sans-serif}.w{max-width:720px;margin:auto;padding:32px 18px 70px}.ey{font-size:11px;letter-spacing:.14em;color:var(--m)}h1{font-size:clamp(34px,8vw,54px);line-height:1.08}.card{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:21px;margin:16px 0}.m{color:var(--m)}label{display:block;font-weight:800;margin:13px 0 6px}input{width:100%;padding:13px;border-radius:11px;border:1px solid var(--l);background:#0d1014;color:var(--t);font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid label{font-size:13px}.grid input{margin-top:5px}.btn{width:100%;padding:15px;border:0;border-radius:12px;background:var(--a);color:#0b0d10;font-weight:900;font-size:16px;cursor:pointer;margin-top:16px}.bad{color:#ffb7b7}.good{color:#c9f7d6}.help{display:inline-block;color:#dce1e7;margin-top:8px}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><div class="ey">STRATUM PRAXIS · VERIFIED PURCHASE</div><h1>購入者フルレポートを開く</h1><p class="m">Stripeの決済をサーバー側で確認します。無料診断で表示された5つの数字を入力すると、その結果に合わせたレポートを生成します。</p><section class="card"><div id="status" class="m" aria-live="polite">購入確認待ちです。</div><label for="email">購入時のメールアドレス</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><h2>診断結果の5スコア</h2><p class="m">数字が分からない場合は50のままでも購入確認できます。後で再診断して比較してください。</p><div class="grid"><label>整理 ↔ 展開<input id="scope" type="number" min="0" max="100" value="50"></label><label>確認 ↔ 前進<input id="motion" type="number" min="0" max="100" value="50"></label><label>深掘 ↔ 横断<input id="depth" type="number" min="0" max="100" value="50"></label><label>制作 ↔ 探索<input id="output" type="number" min="0" max="100" value="50"></label><label>承認 ↔ 自律<input id="control" type="number" min="0" max="100" value="50"></label></div><a class="help" href="./" target="_blank" rel="noopener">無料診断をもう一度開く</a><button id="open" class="btn">購入を確認してフルレポートを開く</button></section><p class="m">AIサービスのパスワードやAPIキーは入力しないでください。このページ自体には有料本文を置いていません。</p></main><script>const API='https://ai-consultant-verify.practicalaireport.workers.dev';const sid=new URLSearchParams(location.search).get('session_id');const st=document.getElementById('status'),btn=document.getElementById('open');const clamp=v=>Math.max(0,Math.min(100,Number(v)||50));if(!sid||!sid.startsWith('cs_')){st.innerHTML='<span class="bad">Checkout Session IDが見つかりません。購入完了後のページから開いてください。</span>';btn.disabled=true}btn.onclick=async()=>{const email=document.getElementById('email').value.trim();if(!email){st.innerHTML='<span class="bad">購入時のメールアドレスを入力してください。</span>';return}const profile={scope:clamp(scope.value),motion:clamp(motion.value),depth:clamp(depth.value),output:clamp(output.value),control:clamp(control.value)};btn.disabled=true;st.textContent='決済を確認しています…';try{const r=await fetch(API+'/ai-fit-router/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,email,profile})});const x=await r.json();if(!r.ok||!x.authorized||!x.workspace_url)throw new Error(x.error||'購入確認に失敗しました');st.innerHTML='<span class="good">確認できました。フルレポートを開きます…</span>';setTimeout(()=>location.assign(x.workspace_url),180)}catch(e){st.innerHTML='<span class="bad">'+String(e.message||'購入確認に失敗しました').replace(/[<>&]/g,'')+'</span>';btn.disabled=false}};</script></body></html>
