name: Render Social Card

on:
  push:
    branches: [main]
    paths:
      - 'distribution/sib-instagram-20260826.svg'
      - '.github/workflows/render-social-card.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render PNG
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url='distribution/sib-instagram-20260826.svg',
              write_to='distribution/sib-instagram-20260826.png',
              output_width=1080,
              output_height=1350,
          )
          PY
      - name: Commit rendered image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add distribution/sib-instagram-20260826.png
          git diff --cached --quiet && exit 0
          git commit -m 'Render Instagram launch card PNG'
          git push
