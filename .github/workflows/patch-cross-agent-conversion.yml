name: Patch Cross-Agent Conversion Surface

on:
  push:
    branches: [main]
    paths:
      - 'ops/patch-cross-agent-conversion.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch product page and localization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          html_path = Path('cross-agent-operating-kit.html')
          js_path = Path('cross-agent-attribution.js')
          html = html_path.read_text()
          js = js_path.read_text()

          replacements = [
            (
              '<script defer src="/cross-agent-attribution.js"></script>',
              '<script defer src="/cross-agent-attribution.js"></script>\n  <script defer src="/cross-agent-conversion.js"></script>'
            ),
            (
              '.hero-facts span{padding:6px 9px;border:1px solid #22312f;border-radius:999px;color:#9aa8a3;background:#0b1312;font-size:11.5px}',
              '.hero-facts span{padding:6px 9px;border:1px solid #22312f;border-radius:999px;color:#9aa8a3;background:#0b1312;font-size:11.5px}.checkout-trust{margin:10px 0 0;padding:10px 12px;border:1px solid #294139;border-radius:10px;background:#0c1714;color:#b8c7c1;font-size:11.5px;line-height:1.55}'
            ),
            (
              '<p class="fine" data-i18n="hero_note">One-time purchase · Editable files · Verified delivery · No subscription</p>',
              '<p class="fine" data-i18n="hero_note">One-time purchase · 13 editable files · Verified delivery · No subscription</p>\n      <p class="checkout-trust"><span class="locale locale-en">Secure checkout by Stripe · Seller: Stratum Praxis · $69 one-time · Returns here for verified delivery.</span><span class="locale locale-ja">Stripeの安全な決済 · 販売者：Stratum Praxis · $69買い切り · 決済後はこのサイトへ戻り購入確認。</span><span class="locale locale-ko">Stripe 보안 결제 · 판매자: Stratum Praxis · $69 일회성 · 결제 후 이 사이트로 돌아와 구매 확인.</span><span class="locale locale-zh">Stripe 安全结账 · 卖家：Stratum Praxis · 一次性 $69 · 付款后返回本站验证购买。</span></p>'
            ),
            (
              '<div class="hero-facts"><span>Master AGENTS.md</span><span>Human Gate Matrix</span><span>Migration + State Handoff</span></div>',
              '<div class="hero-facts"><span>13 editable files</span><span>Master AGENTS.md</span><span>Human Gate Matrix</span><span>Migration + State Handoff</span></div>'
            ),
            (
              '<h2 id="inside-title" data-i18n="inside_title">Six files and frameworks you can put into a real project.</h2>',
              '<h2 id="inside-title" data-i18n="inside_title">13 editable files across six operating components.</h2>'
            )
          ]

          for old, new in replacements:
            if old not in html:
              raise SystemExit(f'Expected HTML fragment not found: {old[:90]}')
            html = html.replace(old, new, 1)

          js_replacements = [
            (
              "hero_note: { en:'One-time purchase · Editable files · Verified delivery · No subscription', ja:'買い切り · 編集可能ファイル · 決済確認後に提供 · サブスクなし', ko:'일회성 구매 · 편집 가능한 파일 · 결제 확인 후 제공 · 구독 없음', zh:'一次购买 · 可编辑文件 · 付款确认后交付 · 无订阅' },",
              "hero_note: { en:'One-time purchase · 13 editable files · Verified delivery · No subscription', ja:'買い切り · 編集可能な13ファイル · 決済確認後に提供 · サブスクなし', ko:'일회성 구매 · 편집 가능한 13개 파일 · 결제 확인 후 제공 · 구독 없음', zh:'一次购买 · 13 个可编辑文件 · 付款确认后交付 · 无订阅' },"
            ),
            (
              "inside_title: { en:'Six files and frameworks you can put into a real project.', ja:'実プロジェクトへ入れて使える6つの実装要素。', ko:'실제 프로젝트에 넣어 사용할 수 있는 6개 구현 요소.', zh:'可直接放入真实项目的 6 个实施组件。' },",
              "inside_title: { en:'13 editable files across six operating components.', ja:'6つの運用コンポーネントに整理した、編集可能な13ファイル。', ko:'6개 운영 구성요소로 정리된 편집 가능한 13개 파일.', zh:'按 6 个运营组件整理的 13 个可编辑文件。' },"
            )
          ]

          for old, new in js_replacements:
            if old not in js:
              raise SystemExit(f'Expected JS fragment not found: {old[:90]}')
            js = js.replace(old, new, 1)

          html_path.write_text(html)
          js_path.write_text(js)
          PY
      - name: Validate conversion patch
        shell: bash
        run: |
          grep -q 'cross-agent-conversion.js' cross-agent-operating-kit.html
          grep -q '13 editable files' cross-agent-operating-kit.html
          grep -q 'Seller: Stratum Praxis' cross-agent-operating-kit.html
          grep -q '13 editable files' cross-agent-attribution.js
          node --check cross-agent-conversion.js
          node --check cross-agent-attribution.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'stratum-conversion-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add cross-agent-operating-kit.html cross-agent-attribution.js cross-agent-conversion.js
          if git diff --cached --quiet; then
            echo 'No conversion changes required.'
            exit 0
          fi
          git commit -m 'conversion: strengthen Cross-Agent checkout trust and measurement [skip conversion-patch]'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push attempt $attempt failed; retrying..." >&2
            sleep $((attempt * 3))
          done
          exit 1
