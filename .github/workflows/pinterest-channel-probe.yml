name: Pinterest Channel Probe

on:
  push:
    branches:
      - ops/pinterest-revenue-lane-20260902
    paths:
      - .github/triggers/pinterest-channel-probe.txt

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Pinterest channel metadata
        id: query
        continue-on-error: true
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        run: |
          set -u
          mkdir -p distribution
          cat > /tmp/query.json <<'JSON'
          {
            "query": "query GetChannelWithSubprofiles { channel(input: { id: \"6917fc832230dbae01fb7f0a\" }) { id name service metadata { ... on PinterestMetadata { boards { serviceId name url } } } } }"
          }
          JSON
          curl -sS https://api.buffer.com \
            -H "Authorization: Bearer ${BUFFER_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/query.json \
            | tee distribution/pinterest-channel-probe.json
      - name: Validate response
        continue-on-error: true
        run: |
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('distribution/pinterest-channel-probe.json','utf8'));console.log(JSON.stringify(j,null,2));if(j.errors||!j.data?.channel)process.exit(1)"
      - name: Commit probe evidence
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add distribution/pinterest-channel-probe.json
          git commit -m "evidence: capture Pinterest board metadata" || exit 0
          git push
