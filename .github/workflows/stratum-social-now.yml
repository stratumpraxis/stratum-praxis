name: Stratum Social Now
# mode: tiktok-independent-retry

on:
  push:
    branches: [main]
    paths:
      - 'distribution/stratum-social-now.json'
      - 'distribution/buffer-publisher.mjs'
      - '.github/workflows/stratum-social-now.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Safety audit
        env:
          BUFFER_QUEUE_FILE: stratum-social-now.json
          MAX_SERVICES_PER_ITEM: '2'
          REQUIRE_UTM: '1'
          ALLOWED_REVENUE_DOMAINS: stratumpraxis.com
        run: node distribution/safety-audit.mjs
      - name: Publish immediately to verified Stratum TikTok
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_TARGET_SERVICES: tiktok
          BUFFER_QUEUE_FILE: stratum-social-now.json
          BUFFER_SELECT_MODE: first
          BUFFER_POST_MODE: shareNow
          REQUIRE_ELIGIBLE_CHANNELS: '1'
          REQUIRE_CHANNEL_NAME_CONTAINS: stratum
        run: node distribution/buffer-publisher.mjs
