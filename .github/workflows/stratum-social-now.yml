name: Stratum Social Now
# policy: OFFICIAL_API_ONLY
# Buffer dependency disabled. Use platform-native official APIs/OAuth only.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-api-only:
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed until an official platform adapter is selected
        run: |
          echo 'Stratum social publishing is OFFICIAL_API_ONLY.'
          echo 'Buffer-based publishing is disabled.'
          echo 'Use direct official adapters for Bluesky / Instagram / TikTok / LinkedIn / Facebook / Pinterest / YouTube.'
