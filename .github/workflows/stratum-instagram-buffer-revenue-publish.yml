name: Stratum Instagram Revenue Buffer Publish

on:
  push:
    branches: [main]
    paths:
      - 'distribution/stratum-instagram-revenue-queue.json'
      - 'distribution/stratum-instagram-once.mjs'
      - '.github/workflows/stratum-instagram-buffer-revenue-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stratum-instagram-revenue-buffer-publish
  cancel-in-progress: false

jobs:
  publish-once:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish once to verified Stratum Instagram and verify externally
        id: publish
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node distribution/stratum-instagram-once.mjs
      - name: Persist publication evidence and duplicate-stop state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- distribution/stratum-instagram-revenue-queue.json distribution/stratum-instagram-revenue-evidence.json)" ]; then
            echo 'No publication state changes to persist.'
            exit 0
          fi
          git config user.name 'stratum-instagram-revenue-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add distribution/stratum-instagram-revenue-queue.json
          if [ -f distribution/stratum-instagram-revenue-evidence.json ]; then
            git add -f distribution/stratum-instagram-revenue-evidence.json
          fi
          git commit -m 'chore(distribution): persist Stratum Instagram publication evidence [skip instagram-buffer]'
          git pull --rebase origin main
          git push origin main
      - name: Require verified publication result
        if: steps.publish.outcome == 'failure'
        run: exit 1
