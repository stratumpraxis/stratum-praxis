name: Repair resilience utility independence

on:
  push:
    paths:
      - '.github/workflows/apply-resilience-seo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair native runtime and independent identities
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pulse = Path('money-resilience/market-pulse.js')
          s = pulse.read_text()
          old_guard = "if(location.pathname!=='/money-resilience/' && location.pathname!=='/money-resilience/index.html') return;"
          new_guard = "if(!['/','/index.html','/money-resilience/','/money-resilience/index.html'].includes(location.pathname)) return;"
          if old_guard in s:
              s = s.replace(old_guard, new_guard, 1)
          elif new_guard not in s:
              raise SystemExit('Unexpected Market Pulse path guard; refusing unsafe rewrite')
          s = re.sub(r'<a data-seo-home-readiness href="/72-hour-household-readiness/"[^>]*>72H Home Readiness ↗</a>', '', s)
          pulse.write_text(s)

          index = Path('money-resilience/index.html')
          s = index.read_text()
          s = s.replace('<script defer src="./scos-analytics.js"></script>', '')
          s = re.sub(r'<a[^>]+href="/72-hour-household-readiness/"[^>]*>.*?</a>', '', s)
          index.write_text(s)

          compat = Path('money-resilience/scos-analytics.js')
          if compat.exists():
              compat.unlink()

          ord_index = Path('72-hour-household-readiness/index.html')
          s = ord_index.read_text()
          s = re.sub(r'<nav data-seo-related="money".*?</nav>', '', s, flags=re.S)
          s = s.replace('<a href="/money-resilience/">お金の耐久力チェック</a>', '')
          s = s.replace('金融面の余力は別のMoney Resilience Utilityで確認できます。どちらのツールも登録不要で、入力内容を相互に引き継ぎません。', '')
          s = s.replace('https://stratumpraxis.com/72-hour-household-readiness/', 'https://ordlume.vercel.app/')
          ord_index.write_text(s)
          PY

      - name: Guard scope and syntax
        run: |
          node --check money-resilience/market-pulse.js
          grep -Fq "['/','/index.html','/money-resilience/','/money-resilience/index.html']" money-resilience/market-pulse.js
          ! grep -q 'scos-analytics.js' money-resilience/index.html
          test ! -e money-resilience/scos-analytics.js
          ! grep -q '/72-hour-household-readiness/' money-resilience/market-pulse.js
          ! grep -q '/72-hour-household-readiness/' money-resilience/index.html
          ! grep -q '/money-resilience/' 72-hour-household-readiness/index.html
          ! grep -q 'stratumpraxis.com/72-hour-household-readiness/' 72-hour-household-readiness/index.html
          grep -q '<link rel="canonical" href="https://ordlume.vercel.app/">' 72-hour-household-readiness/index.html
          grep -q '<meta property="og:url" content="https://ordlume.vercel.app/">' 72-hour-household-readiness/index.html
          git diff --check
          bad=$(git diff --name-only | grep -Ev '^(money-resilience/(market-pulse\.js|index\.html|scos-analytics\.js)|72-hour-household-readiness/index\.html)$' || true)
          test -z "$bad"

      - name: Commit verified repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'stratumpraxis-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A money-resilience/market-pulse.js money-resilience/index.html money-resilience/scos-analytics.js 72-hour-household-readiness/index.html
          git commit -m 'Clean OrdLume static identity and keep utility brands isolated'
          git push
