name: Render Cross-Agent Product Video
on:
  push:
    branches: [main]
    paths:
      - 'campaigns/cross-agent-remotion/**'
      - '.github/workflows/render-cross-agent-product-video.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-cross-agent-product-video
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Remotion project
        working-directory: campaigns/cross-agent-remotion
        run: npm install
      - name: Generate narration
        working-directory: campaigns/cross-agent-remotion
        env:
          SPEECHIFY_API_KEY: ${{ secrets.SPEECHIFY_API_KEY }}
        run: node narrate.mjs
      - name: Render 1080x1920 Remotion master
        working-directory: campaigns/cross-agent-remotion
        run: mkdir -p output && npm run render
      - name: Technical QA
        run: |
          f='campaigns/cross-agent-remotion/output/cross-agent-operating-kit-personal.mp4'
          test -s "$f"
          ffprobe -v error -show_entries stream=width,height,codec_name -show_entries format=duration -of json "$f" | tee campaigns/cross-agent-remotion/output/qa.json
      - name: Publish rendered asset into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add campaigns/cross-agent-remotion/output/cross-agent-operating-kit-personal.mp4 campaigns/cross-agent-remotion/output/qa.json
          git diff --cached --quiet && exit 0
          git commit -m "Render Cross-Agent Operating Kit product video"
          git pull --rebase origin main
          git push
