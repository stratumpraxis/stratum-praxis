name: Music Stock Pack v1 TikTok Publish

on:
  push:
    branches: [main]
    paths:
      - 'distribution/music-stock-pack-v1-tiktok.json'
      - '.github/workflows/music-stock-pack-v1-tiktok-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish Music Stock Pack to verified Stratum TikTok
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_TARGET_SERVICES: tiktok
          BUFFER_QUEUE_FILE: music-stock-pack-v1-tiktok.json
          BUFFER_SELECT_MODE: first
          BUFFER_POST_MODE: shareNow
          REQUIRE_ELIGIBLE_CHANNELS: '1'
          REQUIRE_CHANNEL_NAME_CONTAINS: stratumpraxis
        run: node distribution/buffer-publisher.mjs
