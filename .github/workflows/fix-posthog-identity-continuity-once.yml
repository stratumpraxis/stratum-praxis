name: Fix PostHog Identity Continuity Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-posthog-identity-continuity-once.yml'

permissions:
  contents: write

concurrency:
  group: fix-posthog-identity-continuity-once
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Patch analytics identity continuity
        run: python scripts/fix_posthog_identity_continuity.py

      - name: Verify patched analytics
        run: |
          set -euo pipefail
          grep -Fq 'function sendEvent(name, props)' scos-analytics.js
          grep -Fq 'distinct_id: anonymousId' scos-analytics.js
          if grep -Fq 'window.posthog.capture(name' scos-analytics.js; then
            echo 'old mixed identity capture path still exists'
            exit 1
          fi

      - name: Persist fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scos-analytics.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix PostHog identity continuity across funnel events"
          git pull --rebase origin main
          git push
