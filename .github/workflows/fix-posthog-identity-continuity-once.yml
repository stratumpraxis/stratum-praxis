name: Fix PostHog Identity Continuity Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-posthog-identity-continuity-once.yml'

permissions:
  contents: write

concurrency:
  group: fix-posthog-identity-continuity-once
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch analytics identity continuity
        run: python scripts/fix_posthog_identity_continuity.py

      - name: Verify patched analytics
        run: |
          set -euo pipefail
          grep -Fq 'function sendEvent(name, props)' scos-analytics.js
          grep -Fq 'distinct_id: anonymousId' scos-analytics.js
          if grep -Fq 'window.posthog.capture(name' scos-analytics.js; then
            echo 'old mixed identity capture path still exists'
            exit 1
          fi

      - name: Persist fix despite concurrent main updates
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scos-analytics.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix PostHog identity continuity across funnel events"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push race on attempt ${attempt}; retrying"
            sleep 2
          done
          echo 'failed to persist identity fix after retries'
          exit 1
