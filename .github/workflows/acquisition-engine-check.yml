name: Acquisition Intelligence Engine Check

on:
  push:
    branches: [main]
    paths:
      - 'acquisition/**'
      - 'distribution/source-routing.json'
      - 'distribution/provider-policy.json'
      - 'trend-video-engine/publish-ledger.json'
      - '.github/workflows/acquisition-engine-check.yml'
  pull_request:
    paths:
      - 'acquisition/**'
      - '.github/workflows/acquisition-engine-check.yml'
  workflow_dispatch:
    inputs:
      live_url_verification:
        description: 'Also run live HTTPS verification of every inventory public_url'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: acquisition-engine-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check every module
        run: |
          set -euo pipefail
          for file in acquisition/lib/*.mjs acquisition/cli/*.mjs acquisition/test/*.mjs \
                      acquisition/signal-intelligence/lib/*.mjs acquisition/signal-intelligence/cli/*.mjs acquisition/signal-intelligence/test/*.mjs \
                      acquisition/media-engine/lib/*.mjs acquisition/media-engine/cli/*.mjs acquisition/media-engine/test/*.mjs; do
            node --check "$file"
          done
          for file in $(find acquisition -name '*.json'); do
            node -e "JSON.parse(require('fs').readFileSync('$file','utf8'))"
          done

      - name: Unit and integration tests
        run: |
          set -euo pipefail
          node --test 'acquisition/test/*.test.mjs'
          node --test 'acquisition/signal-intelligence/test/*.test.mjs'
          node --test 'acquisition/media-engine/test/*.test.mjs'

      - name: Verify asset inventory (offline)
        run: node acquisition/cli/verify-inventory.mjs

      - name: Validate distribution queue and run the safety gate
        run: node acquisition/cli/queue-check.mjs

      - name: Derive video-lane attribution (read-only)
        run: node acquisition/cli/attribution-backfill.mjs

      - name: Validate manifest attribution contracts
        run: |
          set -euo pipefail
          for manifest in trend-video-engine/current.json trend-video-engine/tiktok-stratum-current.json trend-video-engine/variants/*.json; do
            [ -f "$manifest" ] || continue
            echo "Validating $manifest"
            node acquisition/cli/plan-video-attribution.mjs --validate "$manifest"
          done

      - name: Build the unified distribution ledger view (read-only)
        run: node acquisition/cli/ledger-sync.mjs

      - name: Daily acquisition report
        run: node acquisition/cli/daily-report.mjs

      - name: Signal intelligence - ingest, rank and report (Issue #53)
        run: |
          set -euo pipefail
          node acquisition/signal-intelligence/cli/ingest.mjs
          node acquisition/signal-intelligence/cli/rank.mjs
          node acquisition/signal-intelligence/cli/promote.mjs
          node acquisition/signal-intelligence/cli/report.mjs

      - name: Media engine - sources, derivation plan and gates (Issue #52)
        run: |
          set -euo pipefail
          node acquisition/media-engine/cli/ingest-source.mjs
          node acquisition/media-engine/cli/derive.mjs
          node acquisition/media-engine/cli/queue-check.mjs
          node acquisition/media-engine/cli/publish-check.mjs
          node acquisition/media-engine/cli/report.mjs

      - name: Confirm nothing reached an auto-publish or published state
        run: |
          set -euo pipefail
          node -e "
            const { execFileSync } = require('node:child_process');
            const report = JSON.parse(execFileSync(process.execPath, ['acquisition/media-engine/cli/report.mjs', '--json'], { encoding: 'utf8' }));
            const auto = report.q6_channel_lanes.AUTO_PUBLISH_ALLOWED;
            if (auto.length) { console.error('a route claims AUTO_PUBLISH_ALLOWED: ' + auto.join(', ')); process.exit(1); }
            if (report.q11_safety.publishes_performed !== 0) { console.error('a publish was claimed'); process.exit(1); }
            if (report.q11_safety.accounts_created !== 0) { console.error('an account creation was claimed'); process.exit(1); }
            console.log('No auto-publish lane, no publish and no account creation is claimed.');
          "

      - name: Confirm existing distribution safety checks still pass
        run: |
          set -euo pipefail
          node distribution/distribution-safety-auditor.mjs
          BUFFER_QUEUE_FILE=launch-now.json node distribution/safety-audit.mjs

      - name: Confirm no production lane file was modified
        run: |
          set -euo pipefail
          git diff --exit-code -- \
            trend-video-engine/ \
            distribution/ \
            revenue-os/ \
            revenue-link-ledger.md \
            scos-analytics.js \
            sitemap.xml \
            AGENTS.md
          echo "No production lane file was modified by the acquisition engine."

      - name: Safety boundary
        run: echo "Validation and reporting only. This workflow contains no publish step."

  live-url-verification:
    if: github.event_name == 'workflow_dispatch' && inputs.live_url_verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify every inventory public_url over HTTPS
        run: node acquisition/cli/verify-inventory.mjs --live

      - name: Emit per-asset live results for audit
        run: |
          set -euo pipefail
          # --write updates the working copy only; this job never commits. The JSON below
          # is the citable record of which URLs actually responded, so HTTP_VERIFIED can
          # be earned from a real check rather than assumed from repo presence.
          node acquisition/cli/verify-inventory.mjs --live --write --json > /tmp/live-inventory.json
          node -e "
            const r = require('/tmp/live-inventory.json');
            console.log('LIVE_VERIFICATION_RESULTS');
            for (const a of r.results) console.log(a.asset_id + '\t' + (a.checks.http_status ?? 'NOT_CHECKED'));
            console.log('schema_errors=' + r.schema_errors.length + ' findings=' + r.findings.length);
          "

