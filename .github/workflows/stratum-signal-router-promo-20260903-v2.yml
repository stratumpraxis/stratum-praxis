name: Verify Existing Signal Promo Posts 20260903

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stratum-signal-router-promo-20260903-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STATUS_FILE: distribution/stratum-signal-router-promo-20260903-status.json
      TIKTOK_CHANNEL_ID: 6a8e5d28ccaf649a671a13e7
      INSTAGRAM_CHANNEL_ID: 6a8e5b5accaf649a671a0cd9
      TIKTOK_POST_ID: 6a985fd7b85185cae2238dc4
      INSTAGRAM_POST_ID: 6a985fe3b85185cae2238e0b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read exact existing Buffer posts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const key=process.env.BUFFER_API_KEY;if(!key)throw new Error('BUFFER_API_KEY missing');
          async function gql(query){const r=await fetch('https://api.buffer.com',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},body:JSON.stringify({query})});const j=await r.json();if(!r.ok||j.errors)throw new Error(JSON.stringify(j.errors||j));return j.data;}
          const acct=await gql('query { account { organizations { id name } } }');const org=acct.account?.organizations?.[0];if(!org)throw new Error('No Buffer organization');const q=s=>JSON.stringify(String(s));
          const targets={tiktok:{channelId:process.env.TIKTOK_CHANNEL_ID,postId:process.env.TIKTOK_POST_ID},instagram:{channelId:process.env.INSTAGRAM_CHANNEL_ID,postId:process.env.INSTAGRAM_POST_ID}};
          const evidence={campaign:'stratum-signal-router-promo-20260903-v1',videoUrl:'https://raw.githubusercontent.com/stratumpraxis/stratum-praxis/main/campaigns/cross-agent-remotion/output/stratum-signal-router-promo-20260903-v1.mp4',productUrl:'https://stratumpraxis.com/signal/?utm_source=social&utm_medium=organic_video&utm_campaign=signal_revenue_router_launch&utm_content=promo_v1',checkedAt:new Date().toISOString(),platforms:{}};
          for(const [service,t] of Object.entries(targets)){
            const data=await gql(`query { posts(first:30,input:{organizationId:${q(org.id)},filter:{channelIds:[${q(t.channelId)}]},sort:[{field:createdAt,direction:desc}]}) { edges { node { id text status sentAt externalLink } } } }`);
            const found=(data.posts?.edges||[]).map(e=>e?.node).filter(Boolean).find(p=>p.id===t.postId)||null;
            evidence.platforms[service]={channelId:t.channelId,bufferPostId:t.postId,status:found?.status||'not_found',sentAt:found?.sentAt||null,externalLink:found?.externalLink||null};
            console.log(`${service.toUpperCase()} status=${evidence.platforms[service].status} link=${evidence.platforms[service].externalLink||''}`);
          }
          fs.writeFileSync(process.env.STATUS_FILE,JSON.stringify(evidence,null,2)+'\n');
          NODE
      - name: Persist readback evidence
        run: |
          set -euo pipefail
          git config user.name 'stratum-promo-bot'
          git config user.email 'stratumpraxis@gmail.com'
          git add "$STATUS_FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Signal promo social publication status'
          git push origin HEAD:main
