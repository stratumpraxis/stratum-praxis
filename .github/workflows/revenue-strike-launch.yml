name: Revenue Strike Launch

on:
  push:
    branches: [main]
    paths:
      - 'distribution/revenue-strike-queue.json'
      - 'distribution/revenue-performance.json'
      - 'distribution/revenue-winner-selector.mjs'
      - 'distribution/buffer-publisher.mjs'
      - '.github/workflows/revenue-strike-launch.yml'
  schedule:
    - cron: '37 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: revenue-strike-launch
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Aggregate measured evidence into revenue performance
        id: perfwriter
        continue-on-error: true
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          REVENUE_PERF_MODE: ${{ vars.REVENUE_PERF_MODE }}
        run: node distribution/revenue-performance-writer.mjs

      - name: Persist revenue performance evidence
        if: always()
        continue-on-error: true
        run: |
          git config user.name 'stratum-publishing-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add distribution/revenue-performance.json
          if git diff --cached --quiet; then
            echo "revenue-performance.json unchanged; nothing to persist."
            exit 0
          fi
          git commit -m 'evidence: persist revenue performance [skip social]'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then
              echo "Revenue performance evidence persisted."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying after rebase."
          done
          echo "::warning::Could not persist revenue-performance.json after 3 attempts. Measurement evidence for this run remains in the workflow log only."

      - name: Select revenue canary with evidence-aware fallback
        run: node distribution/revenue-winner-selector.mjs

      - name: Selected revenue queue safety audit
        env:
          BUFFER_QUEUE_FILE: revenue-strike-selected.json
          MAX_SERVICES_PER_ITEM: '1'
          REQUIRE_UTM: '1'
          ALLOWED_REVENUE_DOMAINS: stratumpraxis.com
        run: node distribution/safety-audit.mjs

      - name: Cross-Agent Operating Kit -> TikTok canary
        id: tiktok
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_TARGET_SERVICES: tiktok
          BUFFER_QUEUE_FILE: revenue-strike-selected.json
          BUFFER_SELECT_MODE: first
          REQUIRE_ELIGIBLE_CHANNELS: '1'
          REQUIRE_CHANNEL_NAME_CONTAINS: stratum
          BUFFER_POST_MODE: addToQueue
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}
        run: node distribution/buffer-publisher.mjs

      - name: Record submission state without claiming publication
        if: always()
        run: |
          echo "TIKTOK_OUTCOME=${{ steps.tiktok.outcome }}"
          if [ "${{ steps.tiktok.outcome }}" != "success" ]; then
            echo "::error::Revenue Strike submission failed. No external delivery verified."
            exit 1
          fi
          case "${{ steps.tiktok.outputs.delivery_status }}" in
            QUEUED) echo "QUEUED: ${{ steps.tiktok.outputs.post_ids }}; public destination readback still required." ;;
            DRY_RUN) echo 'DRY_RUN: no post submitted.' ;;
            WAIT_CONTENT) echo 'WAIT_CONTENT: no approved candidate available.' ;;
            *) echo '::error::Missing or unexpected submission evidence.'; exit 1 ;;
          esac
