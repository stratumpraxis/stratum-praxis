name: Revenue Strike Launch

on:
  push:
    branches: [main]
    paths:
      - 'distribution/revenue-strike-queue.json'
      - 'distribution/revenue-performance.json'
      - 'distribution/revenue-winner-selector.mjs'
      - 'distribution/buffer-publisher.mjs'
      - '.github/workflows/revenue-strike-launch.yml'
  schedule:
    - cron: '37 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only'
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: revenue-strike-launch
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Select revenue winners with exploration fallback
        run: node distribution/revenue-winner-selector.mjs

      - name: Selected revenue queue safety audit
        env:
          BUFFER_QUEUE_FILE: revenue-strike-selected.json
          MAX_SERVICES_PER_ITEM: '1'
          REQUIRE_UTM: '1'
          ALLOWED_REVENUE_DOMAINS: stratumpraxis.com
        run: node distribution/safety-audit.mjs

      - name: Agent Control Auditor -> LinkedIn
        id: linkedin
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_TARGET_SERVICES: linkedin
          BUFFER_QUEUE_FILE: revenue-strike-selected.json
          BUFFER_SELECT_MODE: first
          REQUIRE_ELIGIBLE_CHANNELS: '1'
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}
        run: node distribution/buffer-publisher.mjs

      - name: AI Value / SaaS Spend -> Threads
        id: threads
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_TARGET_SERVICES: threads
          BUFFER_QUEUE_FILE: revenue-strike-selected.json
          BUFFER_SELECT_MODE: first
          REQUIRE_ELIGIBLE_CHANNELS: '1'
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}
        run: node distribution/buffer-publisher.mjs

      - name: Cross-Agent Operating Kit -> Bluesky
        id: bluesky
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_TARGET_SERVICES: bluesky
          BUFFER_QUEUE_FILE: revenue-strike-selected.json
          BUFFER_SELECT_MODE: first
          REQUIRE_ELIGIBLE_CHANNELS: '1'
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}
        run: node distribution/buffer-publisher.mjs

      - name: Enforce external delivery evidence
        if: always()
        run: |
          echo "LINKEDIN_OUTCOME=${{ steps.linkedin.outcome }}"
          echo "THREADS_OUTCOME=${{ steps.threads.outcome }}"
          echo "BLUESKY_OUTCOME=${{ steps.bluesky.outcome }}"
          if [ "${{ steps.linkedin.outcome }}" != "success" ] || [ "${{ steps.threads.outcome }}" != "success" ] || [ "${{ steps.bluesky.outcome }}" != "success" ]; then
            echo "::error::Revenue Strike did not complete all intended external delivery lanes. Connect the required Buffer channels or update the approved route before treating this workflow as successful."
            exit 1
          fi
