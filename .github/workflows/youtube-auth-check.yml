name: YouTube Auth Check

on:
  push:
    paths:
      - '.github/workflows/youtube-auth-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify YouTube OAuth refresh flow
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for name in YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing secret: $name"
              exit 1
            fi
          done

          RESPONSE=$(curl -sS -X POST https://oauth2.googleapis.com/token \
            -d client_id="$YOUTUBE_CLIENT_ID" \
            -d client_secret="$YOUTUBE_CLIENT_SECRET" \
            -d refresh_token="$YOUTUBE_REFRESH_TOKEN" \
            -d grant_type=refresh_token)

          ACCESS_TOKEN=$(printf '%s' "$RESPONSE" | python -c "import json,sys; d=json.load(sys.stdin); print(d.get('access_token',''))")
          ERROR=$(printf '%s' "$RESPONSE" | python -c "import json,sys; d=json.load(sys.stdin); print(d.get('error',''))")
          ERROR_DESCRIPTION=$(printf '%s' "$RESPONSE" | python -c "import json,sys; d=json.load(sys.stdin); print(d.get('error_description',''))")

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "YouTube OAuth refresh failed: ${ERROR:-unknown_error} ${ERROR_DESCRIPTION:-}"
            exit 1
          fi

          echo "YouTube OAuth refresh succeeded. Access token obtained without exposing credentials."
