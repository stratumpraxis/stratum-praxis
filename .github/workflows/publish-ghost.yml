name: Publish Ghost Articles

# Recovery/test lane only.
# Automatic Ghost publication is owned by Stratum Unified Publication Hub,
# which can isolate an externally blocked Ghost lane without stopping other publication lanes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stratum-ghost-manual-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install markdown renderer
        run: npm install --no-save marked

      - name: Publish all queued Ghost articles
        env:
          GHOST_ADMIN_API_URL: ${{ secrets.GHOST_ADMIN_API_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            echo "Publishing $file"
            GHOST_SOURCE_PATH="$file" node scripts/publish_ghost_post.mjs
            count=$((count + 1))
          done < <(find content/ghost -type f -name '*.md' -print0 | sort -z)
          test "$count" -gt 0
          echo "GHOST_ARTICLE_COUNT=$count"
