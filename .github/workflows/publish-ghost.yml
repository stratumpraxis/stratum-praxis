name: Publish Ghost Article

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdown renderer
        run: npm install --no-save marked

      - name: Publish article to Ghost
        env:
          GHOST_ADMIN_API_URL: ${{ secrets.GHOST_ADMIN_API_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
          GHOST_SOURCE_PATH: content/ghost/ai-is-not-your-bottleneck.md
          GHOST_POST_SLUG: ai-is-not-your-bottleneck
        run: node scripts/publish_ghost_post.mjs
