name: One-time Systems live diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-systems-live-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check live Systems route markers now
        shell: bash
        run: |
          set -u
          check() {
            url="$1"; shift
            echo "=== $url ==="
            body="$(curl --fail --silent --show-error --location --max-time 20 "$url")" || { echo 'FETCH_FAIL'; return 1; }
            fail=0
            for needle in "$@"; do
              if grep -F "$needle" <<<"$body" >/dev/null; then
                echo "PRESENT: $needle"
              else
                echo "MISSING: $needle"
                fail=1
              fi
            done
            return $fail
          }
          fail=0
          check 'https://stratumpraxis.com/systems/' 'Systems Library' 'Packaged systems' 'Truth Gate' 'Duplicate Guard' 'Attribution Contract' || fail=1
          check 'https://stratumpraxis.com/systems/products/truth-gate/' 'Truth Gate' 'Known limitations' 'MIT' || fail=1
          check 'https://stratumpraxis.com/systems/products/duplicate-guard/' 'Duplicate Guard' 'Known limitations' || fail=1
          check 'https://stratumpraxis.com/systems/products/attribution-contract/' 'Attribution Contract' 'Known limitations' || fail=1
          check 'https://stratumpraxis.com/systems/licenses/' 'Licences' 'MIT' 'professional legal review' || fail=1
          check 'https://stratumpraxis.com/systems/docs/' 'Documentation' 'Support boundary' || fail=1
          check 'https://stratumpraxis.com/systems/changelog/' 'Changelog' || fail=1
          exit $fail
