name: Verify Stratum Praxis Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-stratumpraxis-pages.yml'
      - 'return-gate/index.html'
      - 'passage-hub/index.html'
      - 'index.html'
      - 'signal/index.html'
      - 'stack-pulse/index.html'
      - 'monthly-money-leak-audit/index.html'
      - 'revenue-router.html'
      - 'workflow-audit.html'
      - 'prompt-systems.html'
      - 'workflow-operator.html'
      - 'trend-to-video-revenue-suite.html'
      - 'execution-without-drift.html'
      - 'safe-api-automation-kit.html'
      - 'revenue-distribution-engine.html'
      - 'return-gate-growth-os.html'
      - 'gpt-5-6-sol-api-cost-calculator.html'
      - 'agentic-ai-governance-permission-kit.html'
      - 'ai-agent-vendor-due-diligence-pack.html'
      - 'ai-agent-procurement-governance-guide.html'
      - 'ai-implementation-kit.html'
      - 'smartphone-ai-slide-factory.html'
      - 'smartphone-income-blueprint.html'
      - 'smartphone-income-blueprint-access.html'
      - 'ai-council-builder.html'
      - 'ai-council-builder-access.html'
      - 'ai-council-builder-ja.html'
      - 'ai-council-builder-ja-access.html'
      - 'sitemap.xml'
      - 'scos-analytics.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-http:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify HTTPS pages and routes
        shell: bash
        run: |
          set -euo pipefail

          wait_for_contains() {
            local url="$1"; shift
            local body=""
            for attempt in $(seq 1 12); do
              body="$(curl --fail --silent --show-error --location --max-time 20 "$url" || true)"
              local ok=1
              for needle in "$@"; do
                if ! grep -F "$needle" <<<"$body" >/dev/null; then
                  ok=0
                  break
                fi
              done
              if [[ "$ok" == "1" ]]; then
                echo "Content ready: $url"
                return 0
              fi
              echo "Content not ready ($attempt/12): $url"
              sleep 5
            done
            echo "Timed out waiting for expected content: $url" >&2
            return 1
          }

          urls=(
            'https://stratumpraxis.com/'
            'https://stratumpraxis.com/return-gate/'
            'https://stratumpraxis.com/passage-hub/'
            'https://stratumpraxis.com/prompt-systems.html'
            'https://stratumpraxis.com/workflow-operator.html'
            'https://stratumpraxis.com/trend-to-video-revenue-suite.html'
            'https://stratumpraxis.com/execution-without-drift.html'
            'https://stratumpraxis.com/safe-api-automation-kit.html'
            'https://stratumpraxis.com/revenue-distribution-engine.html'
            'https://stratumpraxis.com/return-gate-growth-os.html'
            'https://stratumpraxis.com/signal/'
            'https://stratumpraxis.com/stack-pulse/'
            'https://stratumpraxis.com/ai-council-builder-ja.html'
            'https://stratumpraxis.com/monthly-money-leak-audit/'
            'https://stratumpraxis.com/revenue-router.html'
            'https://stratumpraxis.com/workflow-audit.html'
            'https://stratumpraxis.com/gpt-5-6-sol-api-cost-calculator.html'
            'https://stratumpraxis.com/agentic-ai-governance-permission-kit.html'
            'https://stratumpraxis.com/ai-agent-vendor-due-diligence-pack.html'
            'https://stratumpraxis.com/ai-agent-procurement-governance-guide.html'
            'https://stratumpraxis.com/ai-implementation-kit.html'
            'https://stratumpraxis.com/smartphone-ai-slide-factory.html'
            'https://stratumpraxis.com/smartphone-income-blueprint.html'
            'https://stratumpraxis.com/smartphone-income-blueprint-access.html'
            'https://stratumpraxis.com/ai-council-builder.html'
            'https://stratumpraxis.com/ai-council-builder-access.html'
            'https://stratumpraxis.com/ai-council-builder-ja-access.html'
            'https://stratumpraxis.com/sitemap.xml'
          )
          for url in "${urls[@]}"; do
            echo "Checking $url"
            curl --fail --silent --show-error --location --max-time 20 --retry 4 --retry-delay 5 --retry-all-errors "$url" >/dev/null
          done

          wait_for_contains 'https://stratumpraxis.com/sitemap.xml' \
            'https://stratumpraxis.com/return-gate/' \
            'https://stratumpraxis.com/prompt-systems.html' \
            'https://stratumpraxis.com/workflow-operator.html' \
            'https://stratumpraxis.com/trend-to-video-revenue-suite.html' \
            'https://stratumpraxis.com/execution-without-drift.html' \
            'https://stratumpraxis.com/safe-api-automation-kit.html' \
            'https://stratumpraxis.com/revenue-distribution-engine.html' \
            'https://stratumpraxis.com/return-gate-growth-os.html'

          wait_for_contains 'https://stratumpraxis.com/passage-hub/' \
            'href="/prompt-systems.html"' \
            'href="/execution-without-drift.html"'

          wait_for_contains 'https://stratumpraxis.com/prompt-systems.html' \
            'href="/workflow-operator.html"' \
            'href="/trend-to-video-revenue-suite.html"' \
            'href="/execution-without-drift.html"' \
            'href="/safe-api-automation-kit.html"' \
            'href="/revenue-distribution-engine.html"' \
            'href="/return-gate-growth-os.html"'

          gate_html="$(curl --fail --silent --show-error --location --max-time 20 'https://stratumpraxis.com/return-gate/')"
          for path in '/signal/' '/stack-pulse/' '/ai-council-builder-ja.html' '/monthly-money-leak-audit/' '/revenue-router.html' '/workflow-audit.html'; do
            grep -F "href=\"$path\"" <<<"$gate_html" >/dev/null
          done

          echo 'All Stratum Praxis HTTPS, Prompt Systems and Return Gate checks passed.'
