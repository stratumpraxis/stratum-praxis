name: Verify Stratum Praxis Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-stratumpraxis-pages.yml'
      - 'return-gate/index.html'
      - 'passage-hub/index.html'
      - 'index.html'
      - 'b2b-intro/index.html'
      - 'signal/index.html'
      - 'stack-pulse/index.html'
      - 'monthly-money-leak-audit/index.html'
      - 'revenue-router.html'
      - 'workflow-audit.html'
      - 'prompt-systems.html'
      - 'workflow-operator.html'
      - 'trend-to-video-revenue-suite.html'
      - 'execution-without-drift.html'
      - 'safe-api-automation-kit.html'
      - 'revenue-distribution-engine.html'
      - 'return-gate-growth-os.html'
      - 'gpt-5-6-sol-api-cost-calculator.html'
      - 'agentic-ai-governance-permission-kit.html'
      - 'ai-agent-vendor-due-diligence-pack.html'
      - 'ai-agent-procurement-governance-guide.html'
      - 'ai-implementation-kit.html'
      - 'smartphone-ai-slide-factory.html'
      - 'smartphone-income-blueprint.html'
      - 'smartphone-income-blueprint-access.html'
      - 'ai-council-builder.html'
      - 'ai-council-builder-access.html'
      - 'ai-council-builder-ja.html'
      - 'ai-council-builder-ja-access.html'
      - 'agent-control-auditor.html'
      - 'agent-control-auditor.mjs'
      - 'ops/autonomous-operations-monitor/24h-control-plane.html'
      - 'sitemap.xml'
      - 'scos-analytics.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-http:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify HTTPS pages and routes
        shell: bash
        run: |
          set -euo pipefail

          wait_for_contains() {
            local url="$1"; shift
            local body=""
            for attempt in $(seq 1 12); do
              body="$(curl --fail --silent --show-error --location --max-time 20 "$url" || true)"
              local ok=1
              for needle in "$@"; do
                if ! grep -F "$needle" <<<"$body" >/dev/null; then
                  ok=0
                  break
                fi
              done
              if [[ "$ok" == "1" ]]; then
                echo "Content ready: $url"
                return 0
              fi
              echo "Content not ready ($attempt/12): $url"
              sleep 5
            done
            echo "Timed out waiting for expected content: $url" >&2
            return 1
          }

          urls=(
            'https://stratumpraxis.com/'
            'https://stratumpraxis.com/b2b-intro/'
            'https://stratumpraxis.com/return-gate/'
            'https://stratumpraxis.com/passage-hub/'
            'https://stratumpraxis.com/prompt-systems.html'
            'https://stratumpraxis.com/workflow-operator.html'
            'https://stratumpraxis.com/trend-to-video-revenue-suite.html'
            'https://stratumpraxis.com/execution-without-drift.html'
            'https://stratumpraxis.com/safe-api-automation-kit.html'
            'https://stratumpraxis.com/revenue-distribution-engine.html'
            'https://stratumpraxis.com/return-gate-growth-os.html'
            'https://stratumpraxis.com/signal/'
            'https://stratumpraxis.com/stack-pulse/'
            'https://stratumpraxis.com/ai-council-builder-ja.html'
            'https://stratumpraxis.com/monthly-money-leak-audit/'
            'https://stratumpraxis.com/revenue-router.html'
            'https://stratumpraxis.com/workflow-audit.html'
            'https://stratumpraxis.com/gpt-5-6-sol-api-cost-calculator.html'
            'https://stratumpraxis.com/agentic-ai-governance-permission-kit.html'
            'https://stratumpraxis.com/ai-agent-vendor-due-diligence-pack.html'
            'https://stratumpraxis.com/ai-agent-procurement-governance-guide.html'
            'https://stratumpraxis.com/ai-implementation-kit.html'
            'https://stratumpraxis.com/smartphone-ai-slide-factory.html'
            'https://stratumpraxis.com/smartphone-income-blueprint.html'
            'https://stratumpraxis.com/smartphone-income-blueprint-access.html'
            'https://stratumpraxis.com/ai-council-builder.html'
            'https://stratumpraxis.com/ai-council-builder-access.html'
            'https://stratumpraxis.com/ai-council-builder-ja-access.html'
            'https://stratumpraxis.com/agent-control-auditor.html'
            'https://stratumpraxis.com/ops/autonomous-operations-monitor/24h-control-plane.html'
            'https://stratumpraxis.com/sitemap.xml'
          )
          for url in "${urls[@]}"; do
            echo "Checking $url"
            curl --fail --silent --show-error --location --max-time 20 --retry 4 --retry-delay 5 --retry-all-errors "$url" >/dev/null
          done

          # Only routes intentionally present in the canonical sitemap are asserted here.
          # Other owned pages above are still verified for live HTTPS reachability.
          wait_for_contains 'https://stratumpraxis.com/b2b-intro/' \
            'content="index,follow,max-image-preview:large"' \
            'href="/b2b/"' \
            '問い合わせは、まだ不要です。'

          wait_for_contains 'https://stratumpraxis.com/sitemap.xml' \
            'https://stratumpraxis.com/prompt-systems.html' \
            'https://stratumpraxis.com/workflow-operator.html' \
            'https://stratumpraxis.com/revenue-distribution-engine.html'

          wait_for_contains 'https://stratumpraxis.com/passage-hub/' \
            'href="/prompt-systems.html"' \
            'href="/execution-without-drift.html"'

          wait_for_contains 'https://stratumpraxis.com/prompt-systems.html' \
            'href="/workflow-operator.html"' \
            'href="/trend-to-video-revenue-suite.html"' \
            'href="/execution-without-drift.html"' \
            'href="/safe-api-automation-kit.html"' \
            'href="/revenue-distribution-engine.html"' \
            'href="/return-gate-growth-os.html"'

          gate_html="$(curl --fail --silent --show-error --location --max-time 20 'https://stratumpraxis.com/return-gate/')"
          for path in '/signal/' '/stack-pulse/' '/ai-council-builder-ja.html' '/monthly-money-leak-audit/' '/revenue-router.html' '/workflow-audit.html'; do
            grep -F "href=\"$path\"" <<<"$gate_html" >/dev/null
          done

          echo 'All Stratum Praxis HTTPS, Prompt Systems and Return Gate checks passed.'

          wait_for_contains 'https://stratumpraxis.com/agent-control-auditor.html' \
            'What should this agent get done?' \
            'https://buy.stripe.com/cNiaEY3sEgTF60o6NJ6Zy0W'

          wait_for_contains 'https://stratumpraxis.com/ops/autonomous-operations-monitor/24h-control-plane.html' \
            '24H AUTONOMOUS' \
            'CONTROL PLANE' \
            'SALES PUMP' \
            'REWARD PUMP / DIRECT REVENUE PUMP' \
            'PAYMENT-FIRST'

      - name: Verify 24H Control Plane desktop and mobile rendering
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [[ -z "$BROWSER" ]]; then
            echo "No Chrome/Chromium executable found on runner" >&2
            exit 1
          fi

          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          npm init -y >/dev/null 2>&1
          npm install --silent puppeteer-core@24

          cat > verify-control-plane.mjs <<'NODE'
          import puppeteer from 'puppeteer-core';

          const browserPath = process.env.BROWSER;
          const url = 'https://stratumpraxis.com/ops/autonomous-operations-monitor/24h-control-plane.html';
          const cases = [
            { name: 'desktop', width: 1440, height: 1000 },
            { name: 'mobile', width: 390, height: 844, mobile: true }
          ];

          const browser = await puppeteer.launch({
            executablePath: browserPath,
            headless: true,
            args: ['--no-sandbox', '--disable-setuid-sandbox']
          });

          let failed = false;
          try {
            for (const c of cases) {
              const page = await browser.newPage();
              await page.setViewport({
                width: c.width,
                height: c.height,
                isMobile: Boolean(c.mobile),
                deviceScaleFactor: 1
              });

              const consoleErrors = [];
              const pageErrors = [];
              const httpErrors = [];
              page.on('console', msg => {
                if (msg.type() === 'error') consoleErrors.push(msg.text());
              });
              page.on('pageerror', err => pageErrors.push(String(err)));
              page.on('response', resp => {
                if (resp.status() >= 400) {
                  httpErrors.push({
                    status: resp.status(),
                    url: resp.url(),
                    resourceType: resp.request().resourceType()
                  });
                }
              });

              const response = await page.goto(url, { waitUntil: 'networkidle2', timeout: 60000 });
              const status = response?.status() ?? 0;
              const checks = await page.evaluate(() => {
                const text = document.body.innerText;
                return {
                  title: document.title,
                  hasHero: text.includes('24H AUTONOMOUS') && text.includes('CONTROL PLANE'),
                  hasBoundary: text.includes('CONTROL PLANE') && text.includes('EXECUTION OWNER'),
                  hasSales: text.includes('SALES PUMP'),
                  hasReward: text.includes('REWARD PUMP / DIRECT REVENUE PUMP'),
                  hasVector: text.includes('VECTOR'),
                  hasStratum: text.includes('STRATUM'),
                  hasAiApp: text.includes('AI APP $24'),
                  hasOwners: text.includes('Project / Specialist Owners'),
                  hasHandoffs: text.includes('Current Handoffs'),
                  hasGates: text.includes('Human Gates'),
                  hasEvidence: text.includes('Evidence Stream'),
                  hasGuards: text.includes('System Guards'),
                  hasWake: text.includes('Current Next Wake'),
                  scrollWidth: document.documentElement.scrollWidth,
                  clientWidth: document.documentElement.clientWidth,
                  bodyWidth: document.body.getBoundingClientRect().width
                };
              });

              const internalLinks = await page.evaluate(() =>
                [...new Set(Array.from(document.querySelectorAll('a[href]'))
                  .map(a => a.href)
                  .filter(h => h.startsWith(location.origin + '/ops/autonomous-operations-monitor/')))]
              );
              const linkChecks = [];
              for (const href of internalLinks) {
                const lr = await fetch(href, { redirect: 'follow' });
                linkChecks.push({ href, status: lr.status });
              }

              await page.screenshot({
                path: process.env.GITHUB_WORKSPACE + '/control-plane-' + c.name + '.png',
                fullPage: true
              });

              const overflow = checks.scrollWidth > checks.clientWidth + 2;
              const required = [
                checks.hasHero, checks.hasBoundary, checks.hasSales, checks.hasReward,
                checks.hasVector, checks.hasStratum, checks.hasAiApp, checks.hasOwners,
                checks.hasHandoffs, checks.hasGates, checks.hasEvidence, checks.hasGuards, checks.hasWake
              ].every(Boolean);

              const criticalConsoleErrors = consoleErrors.filter(x => !x.includes('Failed to load resource'));
              const criticalHttpErrors = httpErrors.filter(x =>
                x.url.startsWith('https://stratumpraxis.com/') &&
                ['document','script','stylesheet'].includes(x.resourceType) &&
                !x.url.endsWith('/favicon.ico')
              );
              const brokenInternalLinks = linkChecks.filter(x => x.status >= 400);

              console.log(JSON.stringify({
                viewport: c.name,
                status,
                requiredContent: required,
                overflow,
                scrollWidth: checks.scrollWidth,
                clientWidth: checks.clientWidth,
                consoleErrors,
                pageErrors,
                httpErrors,
                internalLinks: linkChecks,
                criticalConsoleErrors,
                criticalHttpErrors,
                brokenInternalLinks
              }));

              if (
                status !== 200 || !required || overflow ||
                criticalConsoleErrors.length || pageErrors.length ||
                criticalHttpErrors.length || brokenInternalLinks.length
              ) {
                failed = true;
              }
              await page.close();
            }
          } finally {
            await browser.close();
          }

          if (failed) process.exit(1);
          NODE

          BROWSER="$BROWSER" node verify-control-plane.mjs

      - name: Upload 24H Control Plane render evidence
        uses: actions/upload-artifact@v4
        with:
          name: 24h-control-plane-production-readback
          path: |
            control-plane-desktop.png
            control-plane-mobile.png
          if-no-files-found: error
          retention-days: 7
