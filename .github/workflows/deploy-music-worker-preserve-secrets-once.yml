name: Deploy Music Worker Preserve Existing Secrets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-music-worker-preserve-secrets-once.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify seven-track source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "track_count: 7" worker/music-stock-pack-worker.js
          grep -Fq "MSV1-006_Phase_Shift_Product_Bundle.zip" worker/music-stock-pack-worker.js
          grep -Fq "MSV1-007_Fracture_Bloom_Product_Bundle.zip" worker/music-stock-pack-worker.js

      - name: Preflight current live checkout
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ai-consultant-verify.practicalaireport.workers.dev'
          code="$(curl -sS -D /tmp/preflight-headers.txt -o /tmp/preflight-body.txt -w '%{http_code}' "$BASE/music-stock-pack-v1/checkout")"
          if [ "$code" != '303' ]; then
            echo "::error::Current live checkout is not healthy before deploy: HTTP $code"
            cat /tmp/preflight-body.txt || true
            exit 1
          fi
          location="$(tr -d '\r' < /tmp/preflight-headers.txt | awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/, ""); print; exit}')"
          case "$location" in
            https://checkout.stripe.com/*) ;;
            *)
              echo "::error::Current live checkout did not redirect to Stripe: $location"
              exit 1
              ;;
          esac
          echo "Preflight checkout OK: 303 -> checkout.stripe.com"

      - name: Deploy Worker without overwriting Worker secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Verify live Worker and storefront
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ai-consultant-verify.practicalaireport.workers.dev'

          code="$(curl -sS -o /tmp/music-login.txt -w '%{http_code}' -X POST "$BASE/music-stock-pack-v1/login" -H 'Content-Type: application/json' --data '{"session_id":"invalid","email":"qa@example.com"}')"
          test "$code" = '400'

          code="$(curl -sS -o /tmp/music-delivery.txt -w '%{http_code}' "$BASE/music-stock-pack-v1/delivery")"
          test "$code" = '401'

          code="$(curl -sS -D /tmp/music-checkout-headers.txt -o /dev/null -w '%{http_code}' "$BASE/music-stock-pack-v1/checkout")"
          test "$code" = '303'
          location="$(tr -d '\r' < /tmp/music-checkout-headers.txt | awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/, ""); print; exit}')"
          case "$location" in
            https://checkout.stripe.com/*) ;;
            *) exit 1 ;;
          esac

          curl -fsSL 'https://stratumpraxis.com/music-stock-pack-v1.html' -o /tmp/store.html
          grep -Fq 'Buy the 7-track pack · $9' /tmp/store.html
          grep -Fq '>Phase Shift<' /tmp/store.html
          grep -Fq '>Fracture Bloom<' /tmp/store.html

          echo "Live seven-track storefront + Worker guards + Stripe redirect -> PASS"
