name: MARKET external signal ingest

# MARKET runtime. External dispatch is accepted when available, but the system does
# not depend on Make being able to call GitHub. A bounded hourly pulse independently
# reads GitHub, PostHog and Stripe so MARKET keeps moving even when the event bus is
# unavailable.
on:
  repository_dispatch:
    types: [market_signal]
  schedule:
    - cron: '17 * * * *'
  push:
    paths:
      - 'market/runtime-kick.txt'
  pull_request:
    paths:
      - 'market/**'
      - '.github/workflows/market-ingest.yml'
  workflow_dispatch:
    inputs:
      source:
        description: 'Adapter to run'
        type: choice
        options: [github, posthog, stripe]
        default: github
      local:
        description: 'Use the local file store for a diagnostic run'
        type: boolean
        default: false
      test_payload:
        description: 'Optional client_payload JSON to exercise the dispatch adapter'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: market-ingest-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  contracts:
    name: MARKET contracts hold
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: MARKET contract tests
        run: node --test market/test/*.test.mjs
      - name: Historical evidence is append-only
        run: node --test market/test/evidence-integrity.test.mjs

  # Broader acquisition/site checks remain useful, but they are not allowed to stop
  # live revenue-signal processing.
  acquisition-audit:
    name: Acquisition audit (non-blocking for MARKET runtime)
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Acquisition suites
        run: |
          node --test acquisition/test/*.test.mjs \
                      acquisition/signal-intelligence/test/*.test.mjs \
                      acquisition/media-engine/test/*.test.mjs \
                      acquisition/opportunity-engine/test/*.test.mjs

  # Autonomous pulse. Each source is isolated so one missing credential does not
  # prevent the other sources from being observed. The durable-store guard remains:
  # without Supabase/Make state credentials the run reports BLOCKED rather than
  # pretending it persisted production state.
  pulse:
    name: MARKET pulse / ${{ matrix.source }}
    needs: contracts
    if: (github.event_name == 'schedule' || github.event_name == 'push') && needs.contracts.result == 'success'
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        source: [github, posthog, stripe]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read ${{ matrix.source }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MARKET_LEDGER_TABLE: ${{ vars.MARKET_LEDGER_TABLE }}
          MARKET_STATE_ENDPOINT: ${{ secrets.MARKET_STATE_ENDPOINT }}
          MARKET_STATE_SECRET: ${{ secrets.MARKET_STATE_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SOURCE: ${{ matrix.source }}
        shell: bash
        run: |
          set -o pipefail
          echo "MARKET autonomous pulse source=$SOURCE trigger=${{ github.event_name }}"
          set +e
          node market/cli/ingest.mjs \
            --source "$SOURCE" \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --json | tee "/tmp/market-$SOURCE.json"
          code=${PIPESTATUS[0]}
          set -e

          if [ "$code" = '2' ]; then
            echo '::warning::MARKET durable state store is not configured; source read cannot be persisted yet.'
            exit 0
          fi
          if [ "$code" != '0' ]; then
            echo "::warning::MARKET source=$SOURCE returned code=$code; other sources continue independently."
            exit "$code"
          fi

          node -e '
            const fs = require("fs");
            const p = `/tmp/market-${process.env.SOURCE}.json`;
            const trace = JSON.parse(fs.readFileSync(p, "utf8"));
            const revenue = Number(trace.verified_revenue ?? 0);
            if (revenue > 0 && !trace.payment_evidence_present) process.exit(21);
            if (revenue > 0 && (trace.payment_refs ?? []).length !== revenue) process.exit(22);
            console.log(`OK source=${process.env.SOURCE} verified_revenue=${revenue}`);
          '
      - name: Upload source trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-pulse-${{ matrix.source }}-${{ github.run_id }}
          path: /tmp/market-${{ matrix.source }}.json
          if-no-files-found: ignore
          retention-days: 14

  # Event/manual path. This remains separate from the pulse so event payloads keep
  # their strict refusal rules and manual diagnostics stay explicit.
  ingest:
    name: Ingest external signal
    needs: contracts
    if: (github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch') && needs.contracts.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stage dispatch payload
        if: github.event_name == 'repository_dispatch' || inputs.test_payload != ''
        shell: bash
        env:
          CLIENT_PAYLOAD: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload) || inputs.test_payload }}
          FROM_REAL_DISPATCH: ${{ github.event_name == 'repository_dispatch' }}
        run: |
          set -euo pipefail
          printf '%s' "$CLIENT_PAYLOAD" > /tmp/market-dispatch.json
          echo "staged $(wc -c < /tmp/market-dispatch.json) bytes"
          if [ "$FROM_REAL_DISPATCH" = 'true' ]; then
            echo 'ORIGIN: real repository_dispatch from an external caller'
          else
            echo 'ORIGIN: manual test_payload; not an inbound external event'
          fi

      - name: Ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MARKET_LEDGER_TABLE: ${{ vars.MARKET_LEDGER_TABLE }}
          MARKET_STATE_ENDPOINT: ${{ secrets.MARKET_STATE_ENDPOINT }}
          MARKET_STATE_SECRET: ${{ secrets.MARKET_STATE_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        shell: bash
        run: |
          set -o pipefail
          EVENT_NAME='${{ github.event_name }}'
          TOP_SOURCE='${{ github.event.client_payload.source || '' }}'
          INPUT_SOURCE='${{ github.event.inputs.source || 'github' }}'
          LOCAL_FLAG='${{ github.event.client_payload.local || github.event.inputs.local || false }}'

          if [ "$EVENT_NAME" = 'repository_dispatch' ] && [ -z "$TOP_SOURCE" ]; then
            SOURCE='dispatch'
            ARGS=( --source dispatch --payload-file /tmp/market-dispatch.json --dispatch-id "${{ github.run_id }}" )
          elif [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ -s /tmp/market-dispatch.json ]; then
            SOURCE='dispatch'
            ARGS=( --source dispatch --payload-file /tmp/market-dispatch.json --dispatch-id "${{ github.run_id }}" )
          else
            SOURCE="${TOP_SOURCE:-$INPUT_SOURCE}"
            ARGS=( --source "$SOURCE" --owner "${{ github.repository_owner }}" --repo "${{ github.event.repository.name }}" )
          fi

          if [ "$LOCAL_FLAG" = 'true' ]; then ARGS+=( --local ); fi
          echo "MARKET source=$SOURCE trigger=$EVENT_NAME local=$LOCAL_FLAG"

          set +e
          node market/cli/ingest.mjs "${ARGS[@]}" --json | tee /tmp/market-run.json
          code=${PIPESTATUS[0]}
          set -e

          if [ "$code" = '2' ]; then
            echo '::warning::MARKET durable state store is not configured; no production signal was persisted.'
            exit 0
          fi
          exit "$code"

      - name: Revenue claims must stay grounded
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const trace = JSON.parse(fs.readFileSync("/tmp/market-run.json", "utf8"));
            const revenue = Number(trace.verified_revenue ?? 0);
            if (revenue > 0 && !trace.payment_evidence_present) process.exit(21);
            if (revenue > 0 && (trace.payment_refs ?? []).length !== revenue) process.exit(22);
            console.log(`OK verified_revenue=${revenue} refs=${JSON.stringify(trace.payment_refs ?? [])}`);
          '

      - name: Report dispatch refusals
        if: success() && ((github.event_name == 'repository_dispatch' && !github.event.client_payload.source) || inputs.test_payload != '')
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const trace = JSON.parse(fs.readFileSync("/tmp/market-run.json", "utf8"));
            for (const r of trace.refused ?? []) console.log(`::warning::dispatch refused (${r.reason}): ${r.detail ?? r.id}`);
            console.log(`${(trace.refused ?? []).length} refused, ${trace.signals_new ?? 0} accepted`);
          '

      - name: Upload run trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-evidence-${{ github.run_id }}
          path: /tmp/market-run.json
          if-no-files-found: ignore
          retention-days: 30
