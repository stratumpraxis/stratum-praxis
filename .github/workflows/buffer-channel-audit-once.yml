name: Buffer Channel Audit Once
on:
  push:
    branches: [main]
    paths:
      - 'distribution/buffer-channel-audit.mjs'
      - '.github/workflows/buffer-channel-audit-once.yml'
permissions:
  contents: write
concurrency:
  group: buffer-channel-audit-once
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read Buffer channels
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_AUDIT_OUTPUT: distribution/buffer-channel-audit-result.json
        run: node distribution/buffer-channel-audit.mjs
      - name: Persist channel audit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution/buffer-channel-audit-result.json
          git diff --cached --quiet && exit 0
          git commit -m "Record current Buffer channels"
          git pull --rebase origin main
          git push
