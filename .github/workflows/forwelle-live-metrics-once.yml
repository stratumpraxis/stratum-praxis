name: Forwelle Live Metrics Once

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/forwelle-live-metrics-20260902.txt'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Collect current public YouTube statistics
        run: |
          python -m pip install --disable-pip-version-check -q yt-dlp
          python <<'PY'
          import datetime, json, subprocess
          urls = [
              'https://www.youtube.com/watch?v=rPYeG1LYgRg',
              'https://www.youtube.com/watch?v=7rFKNKHAfXQ',
          ]
          videos = []
          for url in urls:
              proc = subprocess.run(
                  ['python','-m','yt_dlp','--dump-single-json','--no-warnings','--skip-download',url],
                  text=True, capture_output=True, check=True,
              )
              v = json.loads(proc.stdout)
              videos.append({
                  'videoId': v.get('id'),
                  'title': v.get('title'),
                  'publishedAt': v.get('timestamp') or v.get('release_timestamp'),
                  'uploadDate': v.get('upload_date'),
                  'durationSeconds': v.get('duration'),
                  'views': v.get('view_count'),
                  'likes': v.get('like_count'),
                  'comments': v.get('comment_count'),
                  'channel': v.get('channel'),
                  'channelId': v.get('channel_id'),
                  'url': v.get('webpage_url') or url,
              })
          result = {
              'capturedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'method': 'public-web-yt-dlp',
              'videos': videos,
          }
          out = 'automation/forwelle-operator/live-metrics-20260902.json'
          with open(out, 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
              f.write('\n')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
      - name: Persist evidence
        run: |
          git config user.name "forwelle-metrics"
          git config user.email "forwelle.media@gmail.com"
          git add automation/forwelle-operator/live-metrics-20260902.json
          git diff --cached --quiet || git commit -m "Record Forwelle live video metrics"
          git pull --rebase origin main
          git push
