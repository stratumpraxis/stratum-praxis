name: Conversion Path Measurement Once

on:
  push:
    branches: [main]
    paths:
      - 'conversion-path-measurement.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair current conversion measurement path
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('scos-analytics.js')
          s = p.read_text(encoding='utf-8')

          if "'/ai-saas-spend-decision-kit.html'" not in s.split('const PAID_PRODUCT_PATHS',1)[1].split(']);',1)[0]:
              s = s.replace(
                  "  const PAID_PRODUCT_PATHS = new Set([\n    '/ai-value-realization-kit.html',",
                  "  const PAID_PRODUCT_PATHS = new Set([\n    '/ai-saas-spend-decision-kit.html','/ai-value-realization-kit.html',",
                  1
              )

          if "'/ai-saas-spend-decision-kit.html': 'ai_saas_spend_decision_kit'" not in s:
              s = s.replace(
                  "  const PAID_PRODUCT_IDS = {\n    '/ai-value-realization-kit.html': 'ai_value_realization_kit',",
                  "  const PAID_PRODUCT_IDS = {\n    '/ai-saas-spend-decision-kit.html': 'ai_saas_spend_decision_kit',\n    '/ai-value-realization-kit.html': 'ai_value_realization_kit',",
                  1
              )

          marker = 'const GA4_FUNNEL_EVENTS = new Set(['
          if marker not in s:
              helper = '''  const GA4_FUNNEL_EVENTS = new Set([\n    'funnel_view','route_select','internal_route_click','free_tool_start','free_tool_complete',\n    'paid_product_view','primary_cta_click','checkout_click','lab_tool_open','router_route_selected','spend_calculator_result'\n  ]);\n\n  function mirrorGa4(name, props) {\n    if (!GA4_FUNNEL_EVENTS.has(name) || typeof window.gtag !== 'function') return;\n    const allowed = new Set([\n      'path','funnel','product','cta_id','destination_path','selection','route','intent','tool','source',\n      'paid_depth','match_count','search_active','recommended_route','audit_eligible','annual_spend','review_exposure',\n      'illustrative_reducible','utm_source','utm_medium','utm_campaign','first_utm_source','last_utm_source','offer_path'\n    ]);\n    const out = {};\n    Object.keys(props || {}).forEach(function (key) {\n      if (!allowed.has(key)) return;\n      const value = props[key];\n      if (typeof value === 'string') out[key] = clean(value, 100);\n      else if (typeof value === 'number' && Number.isFinite(value)) out[key] = value;\n      else if (typeof value === 'boolean') out[key] = value;\n    });\n    try { window.gtag('event', name, out); } catch (_) {}\n  }\n\n'''
              s = s.replace('  function sendEvent(name, props) {\n', helper + '  function sendEvent(name, props) {\n', 1)

          if 'mirrorGa4(name, properties);' not in s:
              s = s.replace(
                  "    delete properties.session_id;\n    const payload = JSON.stringify",
                  "    delete properties.session_id;\n    mirrorGa4(name, properties);\n    const payload = JSON.stringify",
                  1
              )

          internal_marker = "if (destination.origin === location.origin && link.dataset.analyticsId) captureBeforeNavigation('internal_route_click', properties);"
          if internal_marker not in s:
              s = s.replace(
                  "    if (link.matches('[data-primary-cta], .button-primary, .cta:not(.secondary)')) captureBeforeNavigation('primary_cta_click', properties);\n",
                  "    if (link.matches('[data-primary-cta], .button-primary, .cta:not(.secondary)')) captureBeforeNavigation('primary_cta_click', properties);\n    if (destination.origin === location.origin && link.dataset.analyticsId) captureBeforeNavigation('internal_route_click', properties);\n",
                  1
              )

          p.write_text(s, encoding='utf-8')

          product = Path('ai-saas-spend-decision-kit.html')
          h = product.read_text(encoding='utf-8')
          h = h.replace('AI & SaaS Spend Decision Kit', 'Spend Decision Kit')
          h = h.replace('<a class="button button-secondary" href="ai-saas-spend-audit-checklist.html">Start free</a>', '<a class="button button-secondary" href="ai-saas-spend-audit-checklist.html" data-analytics-id="decision_kit_start_free">Start free</a>')
          h = h.replace('<a class="button button-secondary" href="ai-saas-spend-waste-audit.html">Need independent review? $499 audit</a>', '<a class="button button-secondary" href="ai-saas-spend-waste-audit.html" data-analytics-id="decision_kit_to_spend_audit">Need independent review? $499 audit</a>')
          product.write_text(h, encoding='utf-8')

          # Hard guards: current $39 product is a paid product, key path events mirror to GA4,
          # and the public product label uses the current formal name.
          s2 = p.read_text(encoding='utf-8')
          h2 = product.read_text(encoding='utf-8')
          assert "'/ai-saas-spend-decision-kit.html': 'ai_saas_spend_decision_kit'" in s2
          assert "captureBeforeNavigation('internal_route_click', properties)" in s2
          assert 'mirrorGa4(name, properties);' in s2
          assert 'AI & SaaS Spend Decision Kit' not in h2
          assert 'Spend Decision Kit' in h2
          print('Conversion path measurement repair -> PASS')
          PY

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scos-analytics.js ai-saas-spend-decision-kit.html; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'stratumpraxis'
          git config user.email 'stratumpraxis@gmail.com'
          git add scos-analytics.js ai-saas-spend-decision-kit.html
          git commit -m 'Repair conversion path measurement and current product identity'
          git push origin HEAD:main
