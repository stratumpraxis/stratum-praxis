name: Forwelle RSS Metrics Once

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/forwelle-rss-metrics-20260902.txt'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Read public YouTube channel feed
        run: |
          python <<'PY'
          import json, urllib.request, xml.etree.ElementTree as ET, datetime
          channel_id='UCw9wnPzccaPba5rLKWyL6nQ'
          targets={'rPYeG1LYgRg','7rFKNKHAfXQ'}
          url=f'https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 ForwelleMetrics/1.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
              xml=r.read()
          root=ET.fromstring(xml)
          ns={'atom':'http://www.w3.org/2005/Atom','yt':'http://www.youtube.com/xml/schemas/2015','media':'http://search.yahoo.com/mrss/'}
          rows=[]
          for e in root.findall('atom:entry',ns):
              vid=e.findtext('yt:videoId',default='',namespaces=ns)
              if vid not in targets: continue
              stat=e.find('media:group/media:community/media:statistics',ns)
              rating=e.find('media:group/media:community/media:starRating',ns)
              rows.append({
                  'videoId':vid,
                  'title':e.findtext('atom:title',default='',namespaces=ns),
                  'publishedAt':e.findtext('atom:published',default='',namespaces=ns),
                  'updatedAt':e.findtext('atom:updated',default='',namespaces=ns),
                  'views': int(stat.attrib.get('views','0')) if stat is not None else None,
                  'averageRating': float(rating.attrib.get('average','0')) if rating is not None else None,
                  'ratingCount': int(rating.attrib.get('count','0')) if rating is not None else None,
                  'url':f'https://www.youtube.com/watch?v={vid}'
              })
          result={'capturedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'source':'youtube-public-rss','channelId':channel_id,'targetCount':len(targets),'foundCount':len(rows),'videos':rows}
          with open('automation/forwelle-operator/rss-metrics-20260902.json','w',encoding='utf-8') as f:
              json.dump(result,f,ensure_ascii=False,indent=2); f.write('\n')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Persist evidence
        run: |
          git config user.name "forwelle-metrics"
          git config user.email "forwelle.media@gmail.com"
          git add automation/forwelle-operator/rss-metrics-20260902.json
          git diff --cached --quiet || git commit -m "Record Forwelle RSS video metrics"
          git pull --rebase origin main
          git push
