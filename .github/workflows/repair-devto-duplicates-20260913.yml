name: Repair DEV.to Duplicates 2026-09-13

# final remaining-pair repair trigger
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-devto-duplicates-20260913.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Keep originals updated and return accidental duplicates to draft
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: node scripts/repair_devto_duplicates_20260913.mjs
