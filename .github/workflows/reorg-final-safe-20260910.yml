name: Reorg final safe
on: [push]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          python3 scripts/finalize_reorg_hold.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add passage-hub/index.html passage-network.html ordlume/index.html sitemap.xml docs/REORG_HOLD_AND_CANONICAL_CANDIDATES_20260910.md
          git diff --cached --quiet || (git commit -m 'chore: apply safe hold status and migration memo' && git push)
