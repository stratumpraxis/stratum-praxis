name: Deploy x402 Agent API

on:
  push:
    branches: [main]
    paths:
      - 'worker/x402-agent-api/**'
      - '.github/workflows/deploy-x402-agent-api.yml'
  workflow_dispatch:

concurrency:
  group: x402-agent-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install API dependencies
        working-directory: worker/x402-agent-api
        run: npm install --omit=dev --no-audit --no-fund

      - name: Deploy isolated worker
        working-directory: worker/x402-agent-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Sync production x402 secrets when configured
        working-directory: worker/x402-agent-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CDP_API_KEY_ID: ${{ secrets.CDP_API_KEY_ID }}
          CDP_API_KEY_SECRET: ${{ secrets.CDP_API_KEY_SECRET }}
          PAY_TO: ${{ secrets.X402_PAY_TO }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CDP_API_KEY_ID:-}" ] && [ -n "${CDP_API_KEY_SECRET:-}" ] && [ -n "${PAY_TO:-}" ]; then
            printf '%s' "$CDP_API_KEY_ID" | npx --yes wrangler@latest secret put CDP_API_KEY_ID
            printf '%s' "$CDP_API_KEY_SECRET" | npx --yes wrangler@latest secret put CDP_API_KEY_SECRET
            printf '%s' "$PAY_TO" | npx --yes wrangler@latest secret put PAY_TO
            echo 'Production x402 credentials synchronized without printing values.'
          else
            echo 'Production credentials are not configured; mainnet remains disabled. Development uses the public x402.org testnet facilitator.'
          fi

      - name: Smoke-test x402 testnet gate
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://stratum-x402-agent-api.practicalaireport.workers.dev'
          health_code="$(curl -sS -o /tmp/x402-health.json -w '%{http_code}' "$BASE/health")"
          if [ "$health_code" != '200' ]; then
            echo "Expected health 200, got $health_code"
            cat /tmp/x402-health.json
            exit 1
          fi

          gate_code="$(curl -sS -o /tmp/x402-gate.txt -w '%{http_code}' -X POST "$BASE/v1/ai-fit" -H 'Content-Type: application/json' --data '{"profile":{"scope":70,"motion":75,"depth":55,"output":35,"control":80}}')"
          if [ "$gate_code" != '402' ]; then
            echo "Expected a real x402 Payment Required response (402), got $gate_code"
            cat /tmp/x402-gate.txt
            exit 1
          fi
          echo 'x402 testnet payment gate verified: 402 Payment Required'
