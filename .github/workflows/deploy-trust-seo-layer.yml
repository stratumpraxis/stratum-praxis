name: Deploy Trust SEO Layer

on:
  workflow_run:
    workflows: ["Deploy Evolution Layer"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

concurrency:
  group: stratum-praxis-trust-seo-layer
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'schedule' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build trust, SEO and inbound layer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'worker' \
            --exclude 'node_modules' \
            --exclude 'revenue-os' \
            --exclude 'CNAME'

          python - <<'PY'
          from pathlib import Path
          from html import escape
          import json, re, subprocess
          from xml.sax.saxutils import escape as xml_escape

          root = Path('_site')
          manifest = json.loads(Path('seo-route-manifest.json').read_text(encoding='utf-8'))
          base = manifest['base_url'].rstrip('/')
          routes = manifest['routes']

          scripts = [
              ('data-stratum-evolution', '<script defer src="/stratum-evolution-engine.js?v=20260911-v2" data-stratum-evolution></script>'),
              ('data-stratum-growth-ui', '<script defer src="/stratum-growth-ui.js?v=20260911-v1" data-stratum-growth-ui></script>'),
              ('data-stratum-trust-revenue', '<script defer src="/stratum-trust-revenue-layer.js?v=20260911-v1" data-stratum-trust-revenue></script>')
          ]

          pump_links = {
              'core': [('Free tools','/live-lab.html'),('Revenue routes','/product-router.html'),('Evidence standard','/evidence.html')],
              'spend': [('Waste Calculator','/ai-saas-waste-calculator.html'),('Audit Checklist','/ai-saas-spend-audit-checklist.html'),('Decision Kit','/ai-saas-spend-decision-kit.html'),('Spend Audit','/ai-saas-spend-waste-audit.html')],
              'workflow': [('Workflow Diagnostic','/b2b/'),('Sample Audit','/sample-workflow-audit.html'),('Workflow Audit','/workflow-audit.html'),('Evidence standard','/evidence.html')],
              'agent': [('Agent Economics','/ai-agent-economics-calculator.html'),('Control Auditor','/agent-control-auditor.html'),('Operating Kit','/cross-agent-operating-kit.html'),('Evidence standard','/evidence.html')],
              'revenue': [('Revenue Pump','/revenue-pump/'),('Auto Scan','/revenue-pump/auto/'),('Revenue Routes','/product-router.html'),('Evidence standard','/evidence.html')],
              'money': [('Evidence & boundaries','/evidence.html'),('Home Readiness','/72-hour-household-readiness/'),('Privacy','/privacy.html')],
              'household': [('Evidence & boundaries','/evidence.html'),('Money Resilience','/money-resilience/'),('Privacy','/privacy.html')],
              'legal': [('Home','/'),('Evidence standard','/evidence.html')]
          }

          pump_style = '''<style data-stratum-route-pump-style>
          .sp-route-pump{box-sizing:border-box;width:min(1180px,calc(100% - 32px));margin:18px auto 68px;padding:13px 14px;border:1px solid rgba(127,127,127,.20);border-radius:16px;background:rgba(127,127,127,.045);color:inherit;font:600 12px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.sp-route-pump strong{display:inline-block;margin-right:10px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;opacity:.58}.sp-route-pump a{display:inline-flex;align-items:center;min-height:34px;margin:3px 4px;padding:0 10px;border:1px solid rgba(127,127,127,.18);border-radius:999px;color:inherit;text-decoration:none;background:rgba(127,127,127,.04)}.sp-route-pump a:hover{border-color:rgba(90,190,145,.42)}@media(max-width:640px){.sp-route-pump{width:calc(100% - 20px);margin-bottom:84px}.sp-route-pump strong{display:block;margin:0 0 7px}.sp-route-pump a{min-height:40px}}@media(prefers-reduced-motion:reduce){.sp-route-pump a{transition:none!important}}
          </style>'''

          source_to_route = {x['source']: x for x in routes}
          errors = []
          injected = 0
          for p in root.rglob('*.html'):
              rel = p.relative_to(root).as_posix()
              text = p.read_text(encoding='utf-8', errors='ignore')
              if '</head>' not in text:
                  continue
              additions = []
              for marker, tag in scripts:
                  if marker not in text:
                      additions.append(tag)
              if additions:
                  text = text.replace('</head>', '  ' + '\n  '.join(additions) + '\n</head>', 1)
                  injected += 1

              route = source_to_route.get(rel)
              if route:
                  if re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\'][^"\']*noindex', text, re.I):
                      errors.append(f"Indexable manifest route is noindex: {rel}")
                  if 'rel="canonical"' not in text and "rel='canonical'" not in text:
                      errors.append(f"Missing canonical: {rel}")
                  if not re.search(r'<meta[^>]+property=["\']og:site_name["\']', text, re.I):
                      text = text.replace('</head>', '  <meta property="og:site_name" content="Stratum Praxis">\n</head>', 1)
                  if 'data-stratum-route-pump' not in text and '</body>' in text:
                      family = route.get('family','core')
                      links = pump_links.get(family, pump_links['core'])
                      link_html = ''.join(f'<a href="{escape(href)}" data-analytics-id="seo_route_pump_{family}_{i}">{escape(label)} →</a>' for i,(label,href) in enumerate(links,1))
                      nav = f'<nav class="sp-route-pump" data-stratum-route-pump aria-label="Related decision routes"><strong>Related routes</strong>{link_html}</nav>'
                      text = text.replace('</head>', pump_style + '\n</head>', 1)
                      text = text.replace('</body>', nav + '\n</body>', 1)
              p.write_text(text, encoding='utf-8')

          if errors:
              raise SystemExit('\n'.join(errors))

          missing = [x['source'] for x in routes if not (root / x['source']).exists()]
          if missing:
              raise SystemExit('Missing sitemap source files: ' + ', '.join(missing))

          def lastmod(source):
              try:
                  value = subprocess.check_output(['git','log','-1','--format=%cs','--',source], text=True).strip()
                  return value or None
              except Exception:
                  return None

          lines = ['<?xml version="1.0" encoding="UTF-8"?>','<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
          for item in routes:
              loc = base + ('/' if item['url'] == '/' else item['url'])
              lines.append('  <url>')
              lines.append(f'    <loc>{xml_escape(loc)}</loc>')
              lm = lastmod(item['source'])
              if lm: lines.append(f'    <lastmod>{lm}</lastmod>')
              if item.get('changefreq'): lines.append(f'    <changefreq>{item["changefreq"]}</changefreq>')
              if item.get('priority'): lines.append(f'    <priority>{item["priority"]}</priority>')
              lines.append('  </url>')
          lines.append('</urlset>')
          (root/'sitemap.xml').write_text('\n'.join(lines)+'\n', encoding='utf-8')

          robots = (root/'robots.txt').read_text(encoding='utf-8') if (root/'robots.txt').exists() else ''
          if 'Sitemap: https://stratumpraxis.com/sitemap.xml' not in robots:
              robots = robots.rstrip() + '\n\nSitemap: https://stratumpraxis.com/sitemap.xml\n'
              (root/'robots.txt').write_text(robots,encoding='utf-8')

          print(f'Injected trust stack into {injected} HTML files')
          print(f'Generated sitemap with {len(routes)} curated URLs')
          PY

          test -s _site/stratum-trust-revenue-layer.js
          test -s _site/evidence.html
          test -s _site/sitemap.xml
          grep -Fq 'data-stratum-trust-revenue' _site/index.html
          grep -Fq 'data-stratum-route-pump' _site/index.html
          grep -Fq 'money-resilience' _site/sitemap.xml
          grep -Fq '72-hour-household-readiness' _site/sitemap.xml
          grep -Fq 'revenue-pump' _site/sitemap.xml
          grep -Fq '/systems/' _site/sitemap.xml
          grep -Fq '/evidence.html' _site/sitemap.xml
          grep -Fq '/ai-saas-spend-decision-kit.html' _site/sitemap.xml
          ! grep -Fq '/ai-value-realization-kit.html' _site/sitemap.xml
          ! grep -Fq 'buyer-workspace' _site/sitemap.xml
          ! grep -Fq 'cross-agent-operating-kit-access' _site/sitemap.xml

      - name: Deploy trust and SEO site
        working-directory: _site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy . --project-name stratum-praxis-site --branch main | tee /tmp/trust-seo-deploy.log
          deploy_url="$(grep -oE 'https://[a-z0-9]+\.stratum-praxis-site\.pages\.dev' /tmp/trust-seo-deploy.log | tail -n 1)"
          test -n "$deploy_url"
          echo "TRUST_SEO_BASE=$deploy_url" >> "$GITHUB_ENV"
          echo "Trust/SEO deployment: $deploy_url"

      - name: Verify trust, SEO and revenue routes
        shell: bash
        run: |
          set -euo pipefail
          BASE="${TRUST_SEO_BASE:?Missing trust SEO deployment URL}"
          routes=(
            / /evidence.html /live-lab.html /product-router.html /systems/
            /ai-saas-waste-calculator.html /ai-saas-spend-audit-checklist.html /ai-saas-spend-decision-kit.html /ai-saas-spend-waste-audit.html /ai-saas-spend-monitoring.html
            /b2b/ /sample-workflow-audit.html /workflow-audit.html
            /ai-agent-economics-calculator.html /agent-control-auditor.html /cross-agent-operating-kit.html
            /revenue-pump/ /revenue-pump/auto/ /money-resilience/ /72-hour-household-readiness/
          )
          for path in "${routes[@]}"; do
            code="$(curl -L -sS -o /tmp/trust-page.html -w '%{http_code}' "$BASE$path")"
            test "$code" = "200" || { echo "Route failed: $path -> $code"; exit 1; }
            grep -Fq 'data-stratum-trust-revenue' /tmp/trust-page.html || { echo "Trust layer missing: $path"; exit 1; }
            echo "Trust route OK: $path"
          done

          curl -L -sS "$BASE/evidence.html" -o /tmp/evidence.html
          grep -Fq 'EVIDENCE STANDARD' /tmp/evidence.html
          grep -Fq 'No invented ROI' /tmp/evidence.html

          curl -L -sS "$BASE/sitemap.xml" -o /tmp/sitemap.xml
          grep -Fq 'https://stratumpraxis.com/evidence.html' /tmp/sitemap.xml
          grep -Fq 'https://stratumpraxis.com/money-resilience/' /tmp/sitemap.xml
          grep -Fq 'https://stratumpraxis.com/revenue-pump/' /tmp/sitemap.xml
          grep -Fq 'https://stratumpraxis.com/ai-saas-spend-decision-kit.html' /tmp/sitemap.xml
          ! grep -Fq 'https://stratumpraxis.com/ai-value-realization-kit.html' /tmp/sitemap.xml
          ! grep -Fq 'buyer-workspace' /tmp/sitemap.xml

          curl -L -sS "$BASE/robots.txt" -o /tmp/robots.txt
          grep -Fq 'Sitemap: https://stratumpraxis.com/sitemap.xml' /tmp/robots.txt

          curl -L -sS "$BASE/stratum-trust-revenue-layer.js?v=20260911-v1" -o /tmp/trust.js
          grep -Fq '__STRATUM_TRUST_REVENUE_LAYER__' /tmp/trust.js
          grep -Fq 'No invented proof' /tmp/trust.js
          echo 'Trust / SEO / Inbound / Revenue confidence layer -> PASS'

  audit:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: No-cost live SEO and trust audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess, re, sys
          manifest=json.load(open('seo-route-manifest.json',encoding='utf-8'))
          base=manifest['base_url'].rstrip('/')
          failures=[]
          for item in manifest['routes']:
              url=base+('/' if item['url']=='/' else item['url'])
              p=subprocess.run(['curl','-L','-sS','--max-time','18','-w','\n__STATUS__%{http_code}',url],capture_output=True,text=True)
              body,status=(p.stdout.rsplit('\n__STATUS__',1)+['0'])[:2] if '\n__STATUS__' in p.stdout else (p.stdout,'0')
              if status.strip()!='200': failures.append(f'{url}: HTTP {status.strip()}'); continue
              if '<title>' not in body.lower(): failures.append(f'{url}: missing title')
              if 'name="description"' not in body.lower() and "name='description'" not in body.lower(): failures.append(f'{url}: missing description')
              if 'rel="canonical"' not in body.lower() and "rel='canonical'" not in body.lower(): failures.append(f'{url}: missing canonical')
              if re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\'][^"\']*noindex',body,re.I): failures.append(f'{url}: unexpected noindex')
          for path,needle in [('/robots.txt','Sitemap: https://stratumpraxis.com/sitemap.xml'),('/sitemap.xml','https://stratumpraxis.com/evidence.html'),('/evidence.html','EVIDENCE STANDARD')]:
              text=subprocess.check_output(['curl','-L','-sS','--max-time','18',base+path],text=True)
              if needle not in text: failures.append(f'{path}: missing required marker')
          sitemap=subprocess.check_output(['curl','-L','-sS','--max-time','18',base+'/sitemap.xml'],text=True)
          if 'buyer-workspace' in sitemap: failures.append('sitemap includes buyer-workspace')
          if failures:
              print('\n'.join('FAIL '+x for x in failures));sys.exit(1)
          print(f'PASS: {len(manifest["routes"])} indexable routes + robots + sitemap + evidence standard')
          PY