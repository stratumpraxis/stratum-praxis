name: Apply External Monetization

on:
  push:
    paths:
      - 'external-monetization.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add bounded affiliate resource blocks
        shell: python
        run: |
          from pathlib import Path

          TAG = "dailyitem08-22"
          disclosure = "As an Amazon Associate, Stratum Praxis may earn from qualifying purchases. These are optional hardware links to Amazon.co.jp; no purchase is required to use the Stratum Praxis workflow."

          css = '''\n<style id="affiliate-resource-style">\n.affiliate-resource{padding:72px 0;border-block:1px solid rgba(127,135,148,.16)}\n.affiliate-resource .affiliate-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:26px}\n.affiliate-resource .affiliate-card{display:flex;flex-direction:column;min-height:190px;padding:20px;border:1px solid rgba(127,135,148,.18);border-radius:18px;text-decoration:none;background:rgba(127,135,148,.055);transition:transform .2s cubic-bezier(.2,.8,.2,1),border-color .2s ease,background .2s ease}\n.affiliate-resource .affiliate-card:hover{transform:translateY(-3px);border-color:rgba(83,185,146,.42);background:rgba(83,185,146,.07)}\n.affiliate-resource .affiliate-card span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.68}\n.affiliate-resource .affiliate-card strong{display:block;margin-top:24px;font-size:17px;line-height:1.3}\n.affiliate-resource .affiliate-card small{display:block;margin-top:auto;padding-top:14px;opacity:.64}\n.affiliate-disclosure{margin-top:18px;font-size:11px;line-height:1.6;opacity:.64;max-width:820px}\n@media(max-width:860px){.affiliate-resource .affiliate-grid{grid-template-columns:1fr 1fr}}\n@media(max-width:520px){.affiliate-resource .affiliate-grid{grid-template-columns:1fr}}\n</style>'''

          def amazon_search(term):
              from urllib.parse import quote_plus
              return f"https://www.amazon.co.jp/s?k={quote_plus(term)}&tag={TAG}"

          def block(title, intro, items):
              cards = ''.join(
                  f'<a class="affiliate-card" href="{url}" target="_blank" rel="sponsored noopener noreferrer" data-analytics-id="affiliate_amazon_{slug}" data-external-link="amazon_jp"><span>Optional hardware · Amazon Japan</span><strong>{name}</strong><small>View current options →</small></a>'
                  for slug, name, url in items
              )
              return f'''<section class="section affiliate-resource" aria-labelledby="affiliate-tools-title"><div class="container"><div class="section-heading"><p class="eyebrow">Optional physical setup</p><h2 id="affiliate-tools-title">{title}</h2><p>{intro}</p></div><div class="affiliate-grid">{cards}</div><p class="affiliate-disclosure">{disclosure}</p></div></section>'''

          configs = {
              Path('smartphone-income-blueprint.html'): block(
                  'Hardware that can make a phone-first workflow less annoying.',
                  'The system itself does not require new gear. If the phone is doing real production work, these are the few physical categories most likely to reduce friction.',
                  [
                      ('phone_tripod','Phone tripod / desk stand',amazon_search('スマホ 三脚 スタンド')),
                      ('bluetooth_keyboard','Compact Bluetooth keyboard',amazon_search('Bluetooth キーボード コンパクト')),
                      ('usb_c_hub','USB-C hub',amazon_search('USB-C ハブ スマホ タブレット')),
                      ('compact_mic','Compact microphone',amazon_search('スマホ マイク USB-C')),
                  ]
              ),
              Path('smartphone-ai-slide-factory.html'): block(
                  'A cleaner phone / tablet deck-production setup.',
                  'The kit is software-agnostic and works without buying accessories. These optional categories are useful when a phone or tablet becomes the main production surface.',
                  [
                      ('tablet_stand','Tablet / phone stand',amazon_search('タブレット スタンド')),
                      ('bluetooth_keyboard','Compact Bluetooth keyboard',amazon_search('Bluetooth キーボード コンパクト')),
                      ('usb_c_hub','USB-C hub',amazon_search('USB-C ハブ タブレット')),
                      ('portable_battery','Portable battery',amazon_search('モバイルバッテリー USB-C')),
                  ]
              ),
          }

          for path, html_block in configs.items():
              s = path.read_text(encoding='utf-8')
              if 'affiliate-resource-style' not in s:
                  s = s.replace('</head>', css + '\n</head>', 1)
              if 'affiliate-disclosure' not in s:
                  marker = '<section id="faq"'
                  idx = s.find(marker)
                  if idx == -1:
                      marker = '<section class="section" id="faq"'
                      idx = s.find(marker)
                  if idx == -1:
                      idx = s.find('</main>')
                  s = s[:idx] + html_block + s[idx:]
              path.write_text(s, encoding='utf-8')

      - name: Commit affiliate blocks
        run: |
          git config user.name "stratumpraxis"
          git config user.email "stratumpraxis@gmail.com"
          git add smartphone-income-blueprint.html smartphone-ai-slide-factory.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add bounded Amazon affiliate resource blocks to phone-first products"
            git push
          fi
