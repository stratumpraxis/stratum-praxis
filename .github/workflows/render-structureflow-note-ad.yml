name: Render Structureflow Note Ad

on:
  push:
    branches: [main]
    paths:
      - 'campaigns/structureflow-note-ad/src/index.jsx'
      - 'campaigns/structureflow-note-ad/narrate.mjs'
      - 'campaigns/structureflow-note-ad/generate-bgm.mjs'
      - 'campaigns/structureflow-note-ad/package.json'
      - '.github/workflows/render-structureflow-note-ad.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-structureflow-note-ad
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system media and Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk

      - name: Install Remotion project
        working-directory: campaigns/structureflow-note-ad
        run: npm install

      - name: Generate original ambient BGM
        working-directory: campaigns/structureflow-note-ad
        run: node generate-bgm.mjs

      - name: Generate Japanese narration
        working-directory: campaigns/structureflow-note-ad
        env:
          SPEECHIFY_API_KEY: ${{ secrets.SPEECHIFY_API_KEY }}
        run: node narrate.mjs

      - name: Source audio QA
        working-directory: campaigns/structureflow-note-ad
        run: |
          test -s public/narration.mp3
          test -s public/bgm.wav
          echo 'NARRATION:'
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 public/narration.mp3
          echo 'BGM:'
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 public/bgm.wav

      - name: Render 1080x1920 Remotion master
        working-directory: campaigns/structureflow-note-ad
        run: mkdir -p output && npm run render

      - name: Technical and timing QA
        working-directory: campaigns/structureflow-note-ad
        run: |
          set -euo pipefail
          f='output/structureflow-ai-quality-teaser.mp4'
          test -s "$f"
          ffprobe -v error -show_entries stream=width,height,codec_name,codec_type -show_entries format=duration -of json "$f" | tee output/qa.json
          duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
          python - "$duration" <<'PY'
          import sys
          d=float(sys.argv[1])
          assert 47.5 <= d <= 48.5, f'Unexpected duration: {d}'
          print(f'DURATION_QA=PASS ({d:.3f}s)')
          PY
          video_dims=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0:s=x "$f")
          test "$video_dims" = '1080x1920'
          echo 'DIMENSION_QA=PASS'
          audio_codec=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$f")
          test -n "$audio_codec"
          echo "AUDIO_QA=PASS ($audio_codec)"

      - name: Render visual QA frames
        working-directory: campaigns/structureflow-note-ad
        run: |
          ffmpeg -y -ss 00:00:05 -i output/structureflow-ai-quality-teaser.mp4 -frames:v 1 -q:v 2 output/preview-hook.jpg >/dev/null 2>&1
          ffmpeg -y -ss 00:00:23 -i output/structureflow-ai-quality-teaser.mp4 -frames:v 1 -q:v 2 output/preview-middle.jpg >/dev/null 2>&1
          ffmpeg -y -ss 00:00:43 -i output/structureflow-ai-quality-teaser.mp4 -frames:v 1 -q:v 2 output/preview-cta.jpg >/dev/null 2>&1
          test -s output/preview-hook.jpg
          test -s output/preview-middle.jpg
          test -s output/preview-cta.jpg
          echo 'VISUAL_FRAME_QA=PASS'

      - name: Publish rendered master and QA evidence safely
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          persist=/tmp/structureflow-note-ad-persist
          rm -rf "$persist"
          mkdir -p "$persist"
          files=(
            campaigns/structureflow-note-ad/output/structureflow-ai-quality-teaser.mp4
            campaigns/structureflow-note-ad/output/qa.json
            campaigns/structureflow-note-ad/output/preview-hook.jpg
            campaigns/structureflow-note-ad/output/preview-middle.jpg
            campaigns/structureflow-note-ad/output/preview-cta.jpg
            campaigns/structureflow-note-ad/output-script.txt
          )
          cp --parents "${files[@]}" "$persist"

          for attempt in 1 2 3; do
            echo "PERSIST_ATTEMPT=$attempt"
            git fetch origin main
            git reset --hard origin/main
            cp -a "$persist"/. .
            git add "${files[@]}"
            if git diff --cached --quiet; then
              echo 'No rendered changes to publish.'
              exit 0
            fi
            git commit -m "Render Structureflow note teaser video"
            if git push origin HEAD:main; then
              echo 'STRUCTUREFLOW_NOTE_AD_PUBLISHED=1'
              exit 0
            fi
          done

          echo 'Could not publish generated assets after 3 bounded attempts.' >&2
          exit 1
