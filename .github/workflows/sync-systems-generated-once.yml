name: One-time Systems Library generator sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-systems-generated-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Make GA4 part of the generator and sync generated pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('systems/build.mjs')
          s = p.read_text()
          measurement = 'G-QXTYRB4TWY'
          if measurement not in s:
              needle = '</head>\n<body data-funnel='
              if needle not in s:
                  raise SystemExit('generator head anchor not found')
              ga = '''<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-QXTYRB4TWY"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-QXTYRB4TWY');
          </script>
          '''
              s = s.replace(needle, ga + needle, 1)
              p.write_text(s)
          PY

          node systems/build.mjs
          node systems/build.mjs --check

          git rm .github/workflows/sync-systems-generated-once.yml
          git add systems/build.mjs systems/index.html systems/licenses/index.html systems/docs/index.html systems/changelog/index.html systems/products/*/index.html
          git config user.name 'stratumpraxis-actions'
          git config user.email 'actions@users.noreply.github.com'

          if git diff --cached --quiet; then
            echo 'Nothing to sync.'
            exit 0
          fi

          git commit -m 'Sync Systems Library generator with GA4 markup'
          git push origin HEAD:main
