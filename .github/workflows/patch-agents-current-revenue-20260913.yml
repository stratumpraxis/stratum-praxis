name: Patch AGENTS Current Revenue 2026-09-13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-agents-current-revenue-20260913.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert current Stratum revenue override safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('AGENTS.md')
          s=p.read_text()
          marker='## Current operating override — 2026-09-13'
          if marker in s:
              print('Current override already present')
              raise SystemExit(0)
          title='# Stratum Praxis Project Context\n'
          if not s.startswith(title):
              raise SystemExit('Unexpected AGENTS.md title; refusing broad rewrite')
          block='''\n## Current operating override — 2026-09-13\n\nThis block is the authoritative current operating state when older notes below conflict with it. Preserve older sections as history; do not execute superseded channel or funnel instructions.\n\n- Acquisition model: inbound / owned-flow revenue only. Do not use Gmail or cold outbound for Stratum unless a later explicit verified directive re-enables it.\n- Revenue evidence priority: Payment Evidence > Checkout Evidence > Qualified Buyer Action > Qualified Traffic > Reach. Do not report traffic, clicks, open checkouts, or queued distribution as revenue.\n- Current primary paid route: Cross-Agent Operating Kit Personal — $69 one-time: https://stratumpraxis.com/cross-agent-operating-kit.html\n- Direct Personal checkout: https://buy.stripe.com/4gM9AU3sE1YLcoM4FB6Zy0T?client_reference_id=agent_discovery_cross_agent&utm_source=agent_discovery&utm_medium=referral&utm_campaign=cross_agent_revenue_20260913&utm_content=agents_md_direct_checkout\n- Best-fit buyer: a user or team already operating across Claude Code, Codex, Cursor, or other AI runtimes and needing portable policy, permissions, human approval gates, cost controls, migration checks, or state handoff. If this need is explicit, route directly to the existing paid self-service offer instead of forcing an unrelated free diagnostic first.\n- Current growth surfaces: AI/ChatGPT discovery, search, GitHub/public resources, and verified Stratum-owned social channels. X @stratumpraxis is banned and must not be used. Do not substitute Vector, Arven, Forwelle, GWR, or other project accounts for Stratum.\n- Existing checkout and buyer-access delivery for Cross-Agent already exist. Do not create a replacement product/page merely to increase asset count. Prefer qualified inbound → relevant existing asset → $69 checkout → verified payment.\n- Measurement must be refreshed from current PostHog / Stripe evidence before claiming conversion or payment. No sale should be inferred from a session, CTA click, or checkout session alone.\n- Older references below to Gmail, cold outreach, X distribution, or the legacy $39 → $99 → $499 funnel are historical where they conflict with this block.\n\n'''
          p.write_text(title+block+s[len(title):])
          PY
      - name: Verify narrow patch
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'Current operating override — 2026-09-13' AGENTS.md
          grep -F 'Cross-Agent Operating Kit Personal — $69 one-time' AGENTS.md
          grep -F 'X @stratumpraxis is banned and must not be used' AGENTS.md
          grep -F '## Revenue Hunter shared decision layer' AGENTS.md
      - name: Persist patch safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md
          if git diff --cached --quiet; then
            echo 'No AGENTS.md change required'
            exit 0
          fi
          git commit -m 'Update AGENTS current inbound revenue priority'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
