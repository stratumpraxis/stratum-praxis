name: Discover Workflow Audit Stripe Route

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-workflow-audit-stripe-route.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover-workflow-audit-stripe-route
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_URL: https://buy.stripe.com/14A00kgfqavh4Wkgoj6Zy02
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      OUT_FILE: ops/b2b-revenue/workflow-audit-stripe-route.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Stripe credential exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${STRIPE_SECRET_KEY:-}" ]; then
            echo "::error::STRIPE_SECRET_KEY is not configured."
            exit 1
          fi
          echo "Stripe credential present; live-mode will be verified from the target Payment Link itself."

      - name: Resolve public checkout through a live Checkout Session
        shell: bash
        run: |
          set -euo pipefail

          redirect_url="$(curl -sS -o /dev/null -w '%{redirect_url}' "$TARGET_URL")"
          if [ -z "$redirect_url" ]; then
            echo "::error::Public Payment Link did not return a checkout redirect."
            exit 2
          fi

          session_id="$(printf '%s' "$redirect_url" | grep -oE 'cs_(live|test)_[A-Za-z0-9]+' | head -n1 || true)"
          if [ -z "$session_id" ]; then
            echo "::error::Could not extract Checkout Session ID from public redirect."
            exit 3
          fi
          echo "::add-mask::$session_id"

          curl -fsS -G "https://api.stripe.com/v1/checkout/sessions/$session_id" \
            -u "$STRIPE_SECRET_KEY:" \
            --data-urlencode 'expand[]=line_items.data.price.product' \
            > /tmp/workflow-audit-session.json

          node <<'NODE'
          const fs = require('fs');
          const s = JSON.parse(fs.readFileSync('/tmp/workflow-audit-session.json', 'utf8'));
          const items = s.line_items?.data || [];
          if (s.livemode !== true || !String(s.id || '').startsWith('cs_live_')) {
            console.error('Resolved Checkout Session is not live-mode.');
            process.exit(4);
          }
          if (items.length !== 1) {
            console.error(`Expected exactly 1 line item, got ${items.length}.`);
            process.exit(5);
          }
          const item = items[0];
          const price = item.price || {};
          const product = typeof price.product === 'string' ? price.product : price.product?.id;
          const amount = Number(s.amount_total);
          const currency = String(s.currency || '').toLowerCase();
          if (!s.payment_link || !price.id || !product || amount !== 49900 || currency !== 'usd') {
            console.error('Resolved Checkout Session does not match the public $499 USD Workflow Audit.');
            process.exit(6);
          }

          const out = {
            verified_at: new Date().toISOString(),
            purpose: 'Workflow Audit $499 route identifiers for server-side payment verification',
            public_checkout_url: process.env.TARGET_URL,
            payment_link_id: s.payment_link,
            price_id: price.id,
            product_id: product,
            amount_minor: amount,
            currency,
            live_mode: true,
            payment_status_at_discovery: String(s.payment_status || ''),
            source: 'Public Payment Link redirect + Stripe Checkout Session API read inside GitHub Actions',
            secret_material_included: false
          };
          fs.mkdirSync(require('path').dirname(process.env.OUT_FILE), { recursive: true });
          fs.writeFileSync(process.env.OUT_FILE, JSON.stringify(out, null, 2) + '\n');
          console.log(`Resolved Workflow Audit route ${s.payment_link} -> ${price.id} -> ${product}`);
          NODE

      - name: Validate no secret material was written
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool "$OUT_FILE" >/dev/null
          if grep -qE 'sk_(live|test)_' "$OUT_FILE"; then
            echo "::error::Secret-looking material detected in output."
            exit 5
          fi

      - name: Commit resolved non-secret route IDs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "$OUT_FILE" && git ls-files --error-unmatch "$OUT_FILE" >/dev/null 2>&1; then
            echo 'Workflow Audit Stripe route IDs are already current.'
            exit 0
          fi
          git config user.name 'stratum-revenue-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUT_FILE"
          git commit -m 'chore(revenue): resolve Workflow Audit Stripe route IDs'
          git pull --rebase origin main
          git push origin HEAD:main
