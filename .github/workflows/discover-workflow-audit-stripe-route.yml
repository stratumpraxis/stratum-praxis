name: Discover Workflow Audit Stripe Route

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-workflow-audit-stripe-route.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover-workflow-audit-stripe-route
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_URL: https://buy.stripe.com/14A00kgfqavh4Wkgoj6Zy02
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      OUT_FILE: ops/b2b-revenue/workflow-audit-stripe-route.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Stripe credential exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${STRIPE_SECRET_KEY:-}" ]; then
            echo "::error::STRIPE_SECRET_KEY is not configured."
            exit 1
          fi
          echo "Stripe credential present; live-mode will be verified from the target Payment Link itself."

      - name: Resolve route IDs from the public Stripe checkout page
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -A 'Mozilla/5.0 (compatible; StratumRouteDiscovery/1.0)' \
            "$TARGET_URL" > /tmp/workflow-audit-checkout.html

          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/workflow-audit-checkout.html','utf8');
          const unique = (re) => [...new Set(html.match(re) || [])];
          const plinks = unique(/plink_[A-Za-z0-9]+/g);
          const prices = unique(/price_[A-Za-z0-9]+/g);
          const products = unique(/prod_[A-Za-z0-9]+/g);
          const sessions = unique(/cs_live_[A-Za-z0-9]+/g);

          console.log(`public checkout bytes=${html.length} plink=${plinks.length} price=${prices.length} product=${products.length} session=${sessions.length}`);
          if (plinks.length !== 1) {
            console.error(`Expected one public Payment Link ID in checkout HTML, got ${plinks.length}.`);
            process.exit(2);
          }

          const out = {
            verified_at: new Date().toISOString(),
            purpose: 'Workflow Audit $499 route identifier for server-side payment verification',
            public_checkout_url: process.env.TARGET_URL,
            payment_link_id: plinks[0],
            price_id: prices.length === 1 ? prices[0] : null,
            product_id: products.length === 1 ? products[0] : null,
            amount_minor_expected: 49900,
            currency_expected: 'usd',
            live_mode_required_at_webhook: true,
            source: 'Public Stripe checkout HTML read inside GitHub Actions',
            secret_material_included: false
          };
          fs.mkdirSync(require('path').dirname(process.env.OUT_FILE), {recursive:true});
          fs.writeFileSync(process.env.OUT_FILE, JSON.stringify(out,null,2)+'\n');
          console.log(`Resolved Workflow Audit Payment Link ID: ${plinks[0]}`);
          NODE

      - name: Validate no secret material was written
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool "$OUT_FILE" >/dev/null
          if grep -qE 'sk_(live|test)_' "$OUT_FILE"; then
            echo "::error::Secret-looking material detected in output."
            exit 5
          fi

      - name: Commit resolved non-secret route IDs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "$OUT_FILE" && git ls-files --error-unmatch "$OUT_FILE" >/dev/null 2>&1; then
            echo 'Workflow Audit Stripe route IDs are already current.'
            exit 0
          fi
          git config user.name 'stratum-revenue-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add "$OUT_FILE"
          git commit -m 'chore(revenue): resolve Workflow Audit Stripe route IDs'
          git pull --rebase origin main
          git push origin HEAD:main
