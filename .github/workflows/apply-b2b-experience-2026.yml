name: Apply Stratum Revenue Intelligence UI 2026
on:
  push:
    paths:
      - 'stratum-ui-v2.css'
      - 'stratum-retrofit-2026.css'
      - 'b2b-experience-2026.css'
      - 'b2b-experience-2026.js'
      - 'b2b-experience-trigger.txt'
      - '.github/workflows/apply-b2b-experience-2026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject shared Stratum UI across official B2B pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          targets = [
            'ai-agent-economics-calculator.html',
            'b2b/index.html',
            'agent-control-auditor.html',
            'workflow-audit.html',
            'product-router.html',
            'live-lab.html',
            'explore-intelligence.html',
            'ai-saas-waste-calculator.html',
            'ai-saas-spend-waste-audit.html',
            'ai-saas-spend-decision-kit.html',
            'saas-renewal-decision.html',
            'ai-saas-spend-audit-checklist.html',
            'ai-consultant.html',
            'workflow-operator.html',
          ]
          css_old = '<link rel="stylesheet" href="/b2b-experience-2026.css" data-sp-b2b-experience>'
          css_new = '<link rel="stylesheet" href="/stratum-ui-v2.css" data-stratum-ui-v2>'
          css_retro = '<link rel="stylesheet" href="/stratum-retrofit-2026.css" data-stratum-retrofit>'
          js = '<script src="/b2b-experience-2026.js" defer data-sp-b2b-experience></script>'
          changed=[]
          for name in targets:
            p=Path(name)
            if not p.exists():
              print('skip missing', name)
              continue
            s=p.read_text(encoding='utf-8')
            old=s
            for marker, tag in [
              ('b2b-experience-2026.css', css_old),
              ('stratum-ui-v2.css', css_new),
              ('stratum-retrofit-2026.css', css_retro),
            ]:
              if marker not in s and '</head>' in s:
                s=s.replace('</head>',f'  {tag}\n</head>',1)
            if 'b2b-experience-2026.js' not in s:
              if '</body>' in s:
                s=s.replace('</body>',f'  {js}\n</body>',1)
              else:
                s += '\n'+js+'\n'
            m=re.search(r'<body\b[^>]*>',s)
            if m and 'sp-b2b-experience' not in m.group(0):
              tag=m.group(0)
              if 'class=' in tag:
                newtag=re.sub(r'class="([^"]*)"',lambda x:f'class="{x.group(1)} sp-b2b-experience"',tag,count=1)
              else:
                newtag=tag[:-1]+' class="sp-b2b-experience">'
              s=s[:m.start()]+newtag+s[m.end():]
            if s!=old:
              p.write_text(s,encoding='utf-8')
              changed.append(name)
          print('changed:', ', '.join(changed) if changed else 'none')
          PY
      - name: Guard excluded and legacy assets
        run: |
          python3 - <<'PY'
          import subprocess
          forbidden=['revenue-router.html','return-gate/index.html','passage-hub/index.html','passage-network/index.html','ordlume/index.html']
          out=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          touched=[f for f in forbidden if f in out]
          if touched:
            raise SystemExit('Protected legacy/hold assets touched: '+', '.join(touched))
          print('Protected legacy/hold assets unchanged')
          PY
      - name: Commit rollout
        run: |
          if git diff --quiet; then
            echo "No rollout changes"
            exit 0
          fi
          git config user.name "stratumpraxis-bot"
          git config user.email "stratumpraxis@gmail.com"
          git add -A
          git commit -m "Apply final Stratum Revenue Intelligence UI across official B2B pages"
          git push
