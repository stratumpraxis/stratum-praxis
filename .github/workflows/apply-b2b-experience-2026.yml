name: Apply B2B Experience 2026
on:
  push:
    paths:
      - 'b2b-experience-2026.css'
      - 'b2b-experience-2026.js'
      - 'b2b-experience-trigger.txt'
      - '.github/workflows/apply-b2b-experience-2026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject shared B2B experience
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets = [
            'index.html',
            'ai-agent-economics-calculator.html',
            'b2b/index.html',
            'agent-control-auditor.html',
            'workflow-audit.html',
            'product-router.html',
            'live-lab.html',
            'ai-saas-waste-calculator.html',
            'ai-saas-spend-waste-audit.html',
            'ai-consultant.html',
          ]
          css = '<link rel="stylesheet" href="/b2b-experience-2026.css" data-sp-b2b-experience>'
          js = '<script src="/b2b-experience-2026.js" defer data-sp-b2b-experience></script>'
          changed=[]
          for name in targets:
            p=Path(name)
            if not p.exists():
              print('skip missing', name)
              continue
            s=p.read_text(encoding='utf-8')
            old=s
            if 'b2b-experience-2026.css' not in s:
              if '</head>' in s:
                s=s.replace('</head>',f'  {css}\n</head>',1)
              else:
                print('skip no head', name); continue
            if 'b2b-experience-2026.js' not in s:
              if '</body>' in s:
                s=s.replace('</body>',f'  {js}\n</body>',1)
              else:
                s += '\n'+js+'\n'
            if s!=old:
              p.write_text(s,encoding='utf-8')
              changed.append(name)
          print('changed:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit rollout
        run: |
          if git diff --quiet; then
            echo "No rollout changes"
            exit 0
          fi
          git config user.name "stratumpraxis-bot"
          git config user.email "stratumpraxis@gmail.com"
          git add -A
          git commit -m "Roll out B2B design system and multilingual experience"
          git push
