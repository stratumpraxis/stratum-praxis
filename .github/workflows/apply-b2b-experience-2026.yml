name: Apply Stratum Revenue Intelligence UI 2026
on:
  push:
    paths:
      - 'design-preview/**'
      - 'stratum-ui-v2.css'
      - 'b2b-experience-2026.css'
      - 'b2b-experience-2026.js'
      - 'b2b-experience-trigger.txt'
      - '.github/workflows/apply-b2b-experience-2026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote approved shadow homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('design-preview/index.html')
          dst=Path('index.html')
          if not src.exists():
            raise SystemExit('design-preview/index.html missing')
          s=src.read_text(encoding='utf-8')
          s=s.replace('<meta name="robots" content="noindex,nofollow,noarchive">','<meta name="robots" content="index,follow,max-image-preview:large">')
          s=s.replace('<title>Stratum Praxis — Revenue Intelligence Preview</title>','<title>Stratum Praxis | B2B Revenue Intelligence & Decision System</title>')
          s=s.replace('Preview of the next Stratum Praxis homepage: ','')
          s=s.replace('data-page="stratum_design_preview"','data-page="stratum_home"')
          s=s.replace('utm_medium=design_preview','utm_medium=homepage')
          s=s.replace('preview_','home_')
          dst.write_text(s,encoding='utf-8')
          print('Promoted design-preview/index.html -> index.html')
          PY
      - name: Inject shared Stratum UI across official B2B pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets = [
            'index.html',
            'ai-agent-economics-calculator.html',
            'b2b/index.html',
            'agent-control-auditor.html',
            'workflow-audit.html',
            'product-router.html',
            'live-lab.html',
            'explore-intelligence.html',
            'ai-saas-waste-calculator.html',
            'ai-saas-spend-waste-audit.html',
            'ai-saas-spend-decision-kit.html',
            'saas-renewal-decision.html',
            'ai-saas-spend-audit-checklist.html',
            'ai-consultant.html',
            'workflow-operator.html',
          ]
          css_old = '<link rel="stylesheet" href="/b2b-experience-2026.css" data-sp-b2b-experience>'
          css_new = '<link rel="stylesheet" href="/stratum-ui-v2.css" data-stratum-ui-v2>'
          js = '<script src="/b2b-experience-2026.js" defer data-sp-b2b-experience></script>'
          changed=[]
          for name in targets:
            p=Path(name)
            if not p.exists():
              print('skip missing', name)
              continue
            s=p.read_text(encoding='utf-8')
            old=s
            # Preview-derived homepage owns its own dedicated CSS and must not be visually overridden.
            if name!='index.html':
              if 'b2b-experience-2026.css' not in s and '</head>' in s:
                s=s.replace('</head>',f'  {css_old}\n</head>',1)
              if 'stratum-ui-v2.css' not in s and '</head>' in s:
                s=s.replace('</head>',f'  {css_new}\n</head>',1)
              if 'b2b-experience-2026.js' not in s:
                if '</body>' in s:
                  s=s.replace('</body>',f'  {js}\n</body>',1)
                else:
                  s += '\n'+js+'\n'
              # Guarantee the shared visual layer applies even to pages not yet in JS path registry.
              if '<body' in s and 'sp-b2b-experience' not in s.split('>',1)[0]:
                import re
                def add_class(m):
                  tag=m.group(0)
                  if 'class=' in tag:
                    return re.sub(r'class="([^"]*)"', lambda x: f'class="{x.group(1)} sp-b2b-experience"', tag, count=1)
                  return tag[:-1]+' class="sp-b2b-experience">'
                s=re.sub(r'<body\b[^>]*>', add_class, s, count=1)
            if s!=old:
              p.write_text(s,encoding='utf-8')
              changed.append(name)
          print('changed:', ', '.join(changed) if changed else 'none')
          PY
      - name: Guard excluded and legacy assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          forbidden=['revenue-router.html','return-gate/index.html','passage-hub/index.html','passage-network/index.html','ordlume/index.html']
          touched=[]
          import subprocess
          out=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          for f in forbidden:
            if f in out:touched.append(f)
          if touched:
            raise SystemExit('Protected legacy/hold assets touched: '+', '.join(touched))
          print('Protected legacy/hold assets unchanged')
          PY
      - name: Commit rollout
        run: |
          if git diff --quiet; then
            echo "No rollout changes"
            exit 0
          fi
          git config user.name "stratumpraxis-bot"
          git config user.email "stratumpraxis@gmail.com"
          git add -A
          git commit -m "Promote approved Stratum homepage and roll out Revenue Intelligence UI"
          git push
