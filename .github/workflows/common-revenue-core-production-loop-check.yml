name: Common Revenue Core Production Loop Check

on:
  pull_request:
    paths:
      - 'revenue-os/common-revenue-core-*.mjs'
      - '.github/workflows/common-revenue-core-production-loop-check.yml'
      - '.github/workflows/auto-merge-internal-prs.yml'
  push:
    branches: [main]
    paths:
      - 'revenue-os/common-revenue-core-*.mjs'
      - '.github/workflows/common-revenue-core-production-loop-check.yml'
  workflow_dispatch:
    inputs:
      live_read_only:
        description: 'Read live PostHog + Stripe evidence, run the core in DRY_RUN, and retain only the sanitized report'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: common-revenue-core-production-loop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-loop-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          set -euo pipefail
          node --check revenue-os/common-revenue-core-production-loop-v0.mjs
          node --check revenue-os/common-revenue-core-production-loop-v0.test.mjs

      - name: Full Common Revenue Core regression chain
        run: |
          set -euo pipefail
          node --test revenue-os/common-revenue-core-schema-v0.test.mjs
          node --test revenue-os/common-revenue-core-ingestion-v0.test.mjs
          node --test revenue-os/common-revenue-core-ledger-v0.test.mjs
          node --test revenue-os/common-revenue-core-identity-reconciliation-v0.test.mjs
          node --test revenue-os/common-revenue-core-economics-v0.test.mjs
          node --test revenue-os/common-revenue-core-decision-evidence-v0.test.mjs
          node --test revenue-os/common-revenue-core-allocator-nba-v0.test.mjs
          node --test revenue-os/common-revenue-core-safe-execution-v0.test.mjs
          node --test revenue-os/common-revenue-core-resilience-v0.test.mjs
          node --test revenue-os/common-revenue-core-production-loop-v0.test.mjs

      - name: Live read-only production verification
        if: github.event_name == 'workflow_dispatch' && inputs.live_read_only == true
        env:
          POSTHOG_HOST: https://us.posthog.com
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID || '573335' }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          CRC_WINDOW_DAYS: '30'
        run: |
          set -euo pipefail
          INGESTION="$RUNNER_TEMP/common-revenue-ingestion.json"
          LEDGER="$RUNNER_TEMP/common-revenue-ledger.jsonl"
          REPORT="$RUNNER_TEMP/common-revenue-production-report.json"
          CRC_INGESTION_OUT="$INGESTION" node revenue-os/common-revenue-core-readonly-collector.mjs
          CRC_INGESTION_FILE="$INGESTION" \
          CRC_LEDGER_FILE="$LEDGER" \
          CRC_PRODUCTION_REPORT="$REPORT" \
          CRC_EXECUTION_MODE=DRY_RUN \
          node revenue-os/common-revenue-core-production-loop-v0.mjs
          cp "$REPORT" revenue-os/common-revenue-core-production-summary.runtime.json
          rm -f "$INGESTION" "$LEDGER" "$LEDGER.lock"

      - name: Upload sanitized live verification summary
        if: always() && github.event_name == 'workflow_dispatch' && inputs.live_read_only == true
        uses: actions/upload-artifact@v4
        with:
          name: common-revenue-core-production-summary-${{ github.run_id }}
          path: revenue-os/common-revenue-core-production-summary.runtime.json
          if-no-files-found: warn
          retention-days: 7

  live-read-only-after-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run sanitized live read-only verification when credentials exist
        id: live
        env:
          POSTHOG_HOST: https://us.posthog.com
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID || '573335' }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          CRC_WINDOW_DAYS: '30'
        run: |
          set -euo pipefail
          if [[ -z "${POSTHOG_PERSONAL_API_KEY:-}" || -z "${STRIPE_SECRET_KEY:-}" ]]; then
            echo "Live provider verification skipped: one or more read credentials are not configured."
            echo "produced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          INGESTION="$RUNNER_TEMP/common-revenue-ingestion.json"
          LEDGER="$RUNNER_TEMP/common-revenue-ledger.jsonl"
          REPORT="$RUNNER_TEMP/common-revenue-production-report.json"
          CRC_INGESTION_OUT="$INGESTION" node revenue-os/common-revenue-core-readonly-collector.mjs
          CRC_INGESTION_FILE="$INGESTION" \
          CRC_LEDGER_FILE="$LEDGER" \
          CRC_PRODUCTION_REPORT="$REPORT" \
          CRC_EXECUTION_MODE=DRY_RUN \
          node revenue-os/common-revenue-core-production-loop-v0.mjs
          cp "$REPORT" revenue-os/common-revenue-core-production-summary.runtime.json
          rm -f "$INGESTION" "$LEDGER" "$LEDGER.lock"
          echo "produced=true" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized main verification summary
        if: steps.live.outputs.produced == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: common-revenue-core-main-verification-${{ github.run_id }}
          path: revenue-os/common-revenue-core-production-summary.runtime.json
          if-no-files-found: error
          retention-days: 7
