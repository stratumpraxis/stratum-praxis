name: Render Music Stock Pack Instagram Card

on:
  push:
    branches: [main]
    paths:
      - 'assets/music-stock-pack-v1-instagram.svg'
      - '.github/workflows/render-music-stock-pack-instagram.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render PNG
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url='assets/music-stock-pack-v1-instagram.svg',
              write_to='assets/music-stock-pack-v1-instagram.png',
              output_width=1080,
              output_height=1350,
          )
          PY
      - name: Commit rendered card
        run: |
          set -euo pipefail
          git config user.name 'stratum-publishing-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/music-stock-pack-v1-instagram.png
          git diff --cached --quiet && exit 0
          git commit -m 'music: render Music Stock Pack v1 Instagram card [skip social]'
          git pull --rebase origin main
          git push origin HEAD:main
