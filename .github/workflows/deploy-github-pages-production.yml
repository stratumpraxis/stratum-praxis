name: Deploy GitHub Pages Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-github-pages-production.yml'
      - '**/*.html'
      - 'CNAME'
      - 'index.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'ai-saas-spend.html'
      - 'ai-saas-spend-decision-kit.html'
      - 'ai-saas-spend-audit-checklist.html'
      - 'ai-saas-waste-calculator.html'
      - 'ai-saas-spend-waste-audit.html'
      - 'ai-saas-spend-monitoring.html'
      - 'saas-renewal-decision.html'
      - 'product-router.html'
      - 'product-router-mobile-guard-2026.css'
      - 'stratum-router-app-v4.css'
      - 'stratum-router-app-v4.js'
      - 'revenue-router.html'
      - 'workflow-audit.html'
      - 'workflow-operator.html'
      - 'guides/**'
      - 'signal/**'
      - 'money-resilience/**'
      - 'styles.css'
      - 'scos-analytics.js'
      - 'stratum-catalog-v3.js'
      - 'stratum-site-kernel.js'
      - 'stratum-revenue-growth.js'
      - 'stratum-revenue-home.js'
      - 'stratum-revenue-home.css'
      - 'stratum-revenue-ui-2026.css'
      - 'stratum-revenue-ui-2026.js'
      - 'stratum-motion-ui-2026.css'
      - 'stratum-motion-ui-2026.js'
      - 'stratum-i18n-runtime-2026.js'
      - 'home-revenue-clean-2026.css'
      - 'stratum-home-app-v4.css'
      - 'stratum-home-app-v4.js'
      - 'media/**'
      - '*.txt'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'worker' \
            --exclude 'node_modules' \
            --exclude 'revenue-os'

          # Source HTML is normalized too; this remains a fail-closed production guard.
          python3 <<'PY'
          from pathlib import Path

          GA_ID = 'G-QXTYRB4TWY'
          REVENUE_UI_CSS = '<link rel="stylesheet" href="/stratum-revenue-ui-2026.css?v=20261005c" data-sp-revenue-ui="build">'
          REVENUE_UI_JS = '<script src="/stratum-revenue-ui-2026.js?v=20261005c" defer data-sp-revenue-ui="build"></script>'
          MOTION_UI_CSS = '<link rel="stylesheet" href="/stratum-motion-ui-2026.css?v=20261005a" data-sp-motion-ui="build">'
          MOTION_UI_JS = '<script src="/stratum-motion-ui-2026.js?v=20261005a" defer data-sp-motion-ui="build"></script>'
          I18N_RUNTIME_JS = '<script src="/stratum-i18n-runtime-2026.js?v=20261005a" defer data-sp-i18n="build"></script>'
          TAG = '''<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-QXTYRB4TWY"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-QXTYRB4TWY');
          </script>'''

          html_files = sorted(Path('_site').rglob('*.html'))
          if not html_files:
              raise SystemExit('No HTML files found for GA4 injection')

          for path in html_files:
              html = path.read_text(encoding='utf-8')
              html = html.replace('href="/index.html"', 'href="/"')
              html = html.replace("href='/index.html'", "href='/'")
              html = html.replace('https://stratumpraxis.com/index.html', 'https://stratumpraxis.com/')

              # Branded Stratum pages receive one shared conversion UI layer.
              # Standalone utilities/other brands are left untouched unless they explicitly identify as Stratum Praxis.
              rel = path.relative_to(Path('_site')).as_posix().lower()
              excluded_revenue_ui = (
                  rel.startswith('delivery/')
                  or rel.startswith('ops/')
                  or '/access' in rel
                  or 'access.' in rel
                  or 'deliver' in rel
                  or 'thank-you' in rel
                  or rel in {'privacy.html','privacy-policy.html','terms.html'}
              )
              is_stratum = 'Stratum Praxis' in html and not excluded_revenue_ui
              if is_stratum:
                  marker = '</head>'
                  idx = html.lower().find(marker)
                  if idx < 0:
                      raise SystemExit(f'Missing </head> in {path}')
                  inject = []
                  if 'stratum-revenue-ui-2026.css' not in html:
                      inject.extend([REVENUE_UI_CSS, REVENUE_UI_JS])
                  if 'stratum-motion-ui-2026.css' not in html:
                      inject.extend([MOTION_UI_CSS, MOTION_UI_JS])
                  if 'stratum-i18n-runtime-2026.js' not in html:
                      inject.append(I18N_RUNTIME_JS)
                  if inject:
                      html = html[:idx] + '\n'.join(inject) + '\n' + html[idx:]

              if GA_ID not in html:
                  marker = '</head>'
                  idx = html.lower().find(marker)
                  if idx < 0:
                      raise SystemExit(f'Missing </head> in {path}')
                  html = html[:idx] + TAG + '\n' + html[idx:]

              config_count = (
                  html.count("gtag('config', 'G-QXTYRB4TWY');")
                  + html.count("gtag('config','G-QXTYRB4TWY');")
              )
              if config_count != 1:
                  raise SystemExit(f'GA4 duplicate/missing config in {path}')

              path.write_text(html, encoding='utf-8')

          top = Path('_site/index.html').read_text(encoding='utf-8')
          canonical = '<link rel="canonical" href="https://stratumpraxis.com/">'
          if top.count(canonical) != 1:
              raise SystemExit('Homepage canonical is not exactly https://stratumpraxis.com/')

          for path in html_files:
              html = path.read_text(encoding='utf-8')
              if 'href="/index.html"' in html or "href='/index.html'" in html:
                  raise SystemExit(f'Legacy /index.html internal link remains in {path}')

          revenue_ui_pages = 0
          for path in html_files:
              html = path.read_text(encoding='utf-8')
              rel = path.relative_to(Path('_site')).as_posix().lower()
              if 'Stratum Praxis' in html and 'stratum-revenue-ui-2026.css' in html and not (rel.startswith('delivery/') or rel.startswith('ops/') or '/access' in rel or 'access.' in rel or 'deliver' in rel or 'thank-you' in rel or rel in {'index.html','product-router.html','privacy.html','privacy-policy.html','terms.html'}):
                  revenue_ui_pages += 1
          print(f'Revenue UI injected into {revenue_ui_pages} branded Stratum pages')
          print(f'GA4 injected exactly once into {len(html_files)} HTML pages')
          print('Homepage canonical/internal-link normalization -> PASS')
          PY

          touch _site/.nojekyll
          test -s _site/CNAME
          test "$(tr -d '\r\n' < _site/CNAME)" = 'stratumpraxis.com'
          grep -Fq 'AI & SaaS Spend Audit & Renewal Decision | Stratum Praxis' _site/ai-saas-spend.html
          grep -Fq 'https://buy.stripe.com/cNi00kgfq7j5ewUfkf6Zy06' _site/ai-saas-spend-decision-kit.html
          grep -Fq 'Sitemap: https://stratumpraxis.com/sitemap.xml' _site/robots.txt
          test "$(cat _site/e1db803787a56bb5ab5c1e61aa0cdbfd.txt)" = 'e1db803787a56bb5ab5c1e61aa0cdbfd'

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
