name: Deploy GitHub Pages Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-github-pages-production.yml'
      - 'CNAME'
      - 'index.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'ai-saas-spend.html'
      - 'ai-saas-spend-decision-kit.html'
      - 'ai-saas-spend-audit-checklist.html'
      - 'ai-saas-waste-calculator.html'
      - 'ai-saas-spend-waste-audit.html'
      - 'ai-saas-spend-monitoring.html'
      - 'saas-renewal-decision.html'
      - 'product-router.html'
      - 'revenue-router.html'
      - 'workflow-audit.html'
      - 'workflow-operator.html'
      - 'guides/**'
      - 'styles.css'
      - 'scos-analytics.js'
      - 'stratum-catalog-v3.js'
      - 'stratum-site-kernel.js'
      - 'stratum-revenue-growth.js'
      - 'stratum-revenue-home.js'
      - 'stratum-revenue-home.css'
      - 'media/**'
      - '*.txt'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'worker' \
            --exclude 'node_modules' \
            --exclude 'revenue-os'
          touch _site/.nojekyll
          test -s _site/CNAME
          test "$(tr -d '\r\n' < _site/CNAME)" = 'stratumpraxis.com'
          grep -Fq 'AI & SaaS Spend Audit & Renewal Decision | Stratum Praxis' _site/ai-saas-spend.html
          grep -Fq 'https://buy.stripe.com/cNi00kgfq7j5ewUfkf6Zy06' _site/ai-saas-spend-decision-kit.html
          grep -Fq 'Sitemap: https://stratumpraxis.com/sitemap.xml' _site/robots.txt

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
