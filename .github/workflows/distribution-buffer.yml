name: Safe Buffer Distribution

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only'
        required: false
        default: '1'
  schedule:
    - cron: '17 1 * * *'

permissions:
  contents: read

concurrency:
  group: safe-buffer-distribution
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Distribution safety audit
        env:
          BUFFER_QUEUE_FILE: content-queue.json
          MAX_SERVICES_PER_ITEM: '3'
          REQUIRE_UTM: '1'
          ALLOWED_REVENUE_DOMAINS: stratumpraxis.com
        run: node distribution/safety-audit.mjs
      - name: Publish through Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_TARGET_SERVICES: ${{ vars.BUFFER_TARGET_SERVICES }}
          REQUIRE_ELIGIBLE_CHANNELS: '1'
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}
        run: node distribution/buffer-publisher.mjs
