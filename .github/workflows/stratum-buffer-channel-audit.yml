name: Stratum Buffer Channel Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'distribution/buffer-channel-audit.mjs'
      - '.github/workflows/stratum-buffer-channel-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit Buffer channel identities
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_AUDIT_OUTPUT: distribution/buffer-channel-audit-result.json
        run: node distribution/buffer-channel-audit.mjs
      - name: Persist audit evidence
        shell: bash
        run: |
          git config user.name 'stratum-social-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f distribution/buffer-channel-audit-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'evidence: persist Buffer channel identity audit [skip social]'
          git push
