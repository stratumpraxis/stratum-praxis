name: Stratum Pinterest Account Discovery

on:
  push:
    branches: [main]
    paths:
      - 'scripts/discover_pinterest_official.mjs'
      - '.github/workflows/stratum-pinterest-discover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Stratum Pinterest account and discover boards
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_EXPECTED_USERNAME: stratumpraxis
        run: node scripts/discover_pinterest_official.mjs
      - name: Persist Pinterest discovery evidence
        shell: bash
        run: |
          git config user.name 'stratum-publishing-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add publishing/evidence/stratum-pinterest-account.json
          if git diff --cached --quiet; then
            echo 'No evidence changes'
            exit 0
          fi
          git commit -m 'evidence: persist Stratum Pinterest account discovery [skip social]'
          git push
