name: Revenue Router Stripe Payment Evidence
# readback_after_owned_distribution: 2026-10-14T06:50:00Z

on:
  push:
    branches: [main]
    paths:
      - 'revenue-os/revenue-router-stripe-payment-evidence.trigger'
      - '.github/workflows/revenue-router-stripe-payment-evidence.yml'
  workflow_dispatch:
# rerun 2026-10-14 post-conversion-copy

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_PAYMENT_LINK_ADMIN_KEY }}
      TARGET_PAYMENT_LINK_ID: plink_1U7AvVJMK7zFs997FZnUvfi8
      TARGET_ROUTE: vp_stratum_revenue_router_v1
      SINCE_UNIX: "1791849600"
    steps:
      - name: Inspect Revenue Router checkout sessions
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${STRIPE_SECRET_KEY:-}" ]; then
            echo "::error::STRIPE_PAYMENT_LINK_ADMIN_KEY is not configured."
            exit 1
          fi
          node <<'NODE'
          const key = process.env.STRIPE_SECRET_KEY;
          const targetPaymentLink = process.env.TARGET_PAYMENT_LINK_ID;
          const targetRoute = process.env.TARGET_ROUTE;
          const since = Number(process.env.SINCE_UNIX);
          const headers = { Authorization: `Bearer ${key}` };

          async function get(path) {
            const r = await fetch(`https://api.stripe.com/v1/${path}`, { headers });
            const t = await r.text();
            if (!r.ok) throw new Error(`Stripe GET failed HTTP ${r.status}: ${t.slice(0,500)}`);
            return JSON.parse(t);
          }

          let startingAfter = "";
          const matched = [];
          for (let page = 0; page < 20; page++) {
            const qs = new URLSearchParams({ limit: "100" });
            if (startingAfter) qs.set("starting_after", startingAfter);
            const data = await get(`checkout/sessions?${qs.toString()}`);
            for (const s of data.data || []) {
              if ((s.created || 0) < since) continue;
              if (s.payment_link === targetPaymentLink || s.client_reference_id === targetRoute) {
                matched.push({
                  id: s.id,
                  created: s.created,
                  livemode: s.livemode,
                  mode: s.mode,
                  status: s.status,
                  payment_status: s.payment_status,
                  amount_total: s.amount_total,
                  currency: s.currency,
                  payment_link: s.payment_link,
                  client_reference_id: s.client_reference_id
                });
              }
            }
            const rows = data.data || [];
            if (!data.has_more || rows.length === 0) break;
            if ((rows[rows.length - 1].created || 0) < since) break;
            startingAfter = rows[rows.length - 1].id;
          }

          // Safe, aggregate-only evidence. Separate test sessions from live buyer activity.
          // Never emit Checkout Session IDs, customer details, email, or API keys.
          const liveSessions = matched.filter(s => s.livemode === true);
          const testSessions = matched.filter(s => s.livemode !== true);
          const livePaid = liveSessions.filter(s => s.payment_status === "paid" && s.status === "complete");
          const liveNotPaid = liveSessions.filter(s => s.payment_status !== "paid" || s.status !== "complete");
          const exactLinkLive = liveSessions.filter(s => s.payment_link === targetPaymentLink);
          const clientReferenceLive = liveSessions.filter(s => s.client_reference_id === targetRoute);
          console.log(`REVENUE_ROUTER_LIVE_SESSIONS=${liveSessions.length}`);
          console.log(`REVENUE_ROUTER_TEST_SESSIONS=${testSessions.length}`);
          console.log(`REVENUE_ROUTER_LIVE_COMPLETE_PAID=${livePaid.length}`);
          console.log(`REVENUE_ROUTER_LIVE_UNPAID_OR_INCOMPLETE=${liveNotPaid.length}`);
          console.log(`REVENUE_ROUTER_LIVE_EXACT_PAYMENT_LINK_MATCHES=${exactLinkLive.length}`);
          console.log(`REVENUE_ROUTER_LIVE_CLIENT_REFERENCE_MATCHES=${clientReferenceLive.length}`);
          console.log(`REVENUE_ROUTER_DATA_WINDOW_SINCE_UNIX=${since}`);
          const paid = livePaid;
          console.log(`REVENUE_ROUTER_MATCHED_SESSIONS=${matched.length}`);
          console.log(`REVENUE_ROUTER_PAID_SESSIONS=${paid.length}`);
          // Report aggregate payment evidence only; do not expose Checkout Session IDs in CI logs.
          const unpaid = matched.length - paid.length;
          console.log(`REVENUE_ROUTER_UNPAID_OR_UNCONFIRMED_SESSIONS=${unpaid}`);
          console.log(`REVENUE_ROUTER_PAID_AMOUNT_MINOR=${paid.reduce((sum, s) => sum + (s.amount_total || 0), 0)}`);
          console.log(`REVENUE_ROUTER_EVIDENCE_STATUS=${paid.length > 0 ? "PAID_FOUND" : "NO_PAID_SESSION_FOUND"}`);
          NODE
