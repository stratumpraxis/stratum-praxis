name: Stratum WordPress Direct Publish

on:
  push:
    branches: [main]
    paths:
      - 'publishing/queue/stratum-wordpress-*.json'
      - 'scripts/publish_wordpress_official.mjs'
      - '.github/workflows/stratum-wordpress-publish.yml'
  workflow_dispatch:
    inputs:
      package_path:
        description: WordPress publish package path
        required: true
        default: publishing/queue/stratum-wordpress-owned-example.json

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve self-owned WordPress write gate
        id: gate
        env:
          WPCOM_ACCESS_TOKEN: ${{ secrets.WPCOM_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            path="${{ inputs.package_path }}"
          else
            path="$(git diff-tree --no-commit-id --name-only -r HEAD -- 'publishing/queue/stratum-wordpress-*.json' | head -n 1)"
          fi
          if [ -z "$WPCOM_ACCESS_TOKEN" ]; then
            echo 'WORDPRESS_AUTH_GATE: WPCOM_ACCESS_TOKEN missing'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$path" ] || [ ! -f "$path" ]; then
            echo 'WORDPRESS_IDLE: no publish package in this event'
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Publish to verified Stratum WordPress site
        if: steps.gate.outputs.ready == 'true'
        env:
          WPCOM_ACCESS_TOKEN: ${{ secrets.WPCOM_ACCESS_TOKEN }}
          WPCOM_SITE: ${{ vars.WPCOM_SITE || 'stratumpraxis.wordpress.com' }}
        run: node scripts/publish_wordpress_official.mjs "${{ steps.gate.outputs.path }}"
      - name: Persist publication evidence
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'stratum-publishing-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add publishing/evidence/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'evidence: persist Stratum WordPress publication [skip social]'
          git pull --rebase origin main
          for attempt in 1 2 3; do
            if git push origin main; then exit 0; fi
            sleep $((attempt * 4))
            git pull --rebase origin main
          done
          exit 1
