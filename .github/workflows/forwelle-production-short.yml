name: Forwelle Production Short

on:
  push:
    paths:
      - 'automation/forwelle-production/run.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: automation/forwelle-production
        run: npm install

      - name: Build production Short — assets, render, fail-closed QA
        working-directory: automation/forwelle-production
        env:
          SPEECHIFY_API_KEY: ${{ secrets.SPEECHIFY_API_KEY }}
        run: npm run build:production

      - name: Upload QA-approved Short to YouTube as private
        working-directory: automation/forwelle-production
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/youtube-upload.mjs out/forwelle-agent-stop-condition.mp4
