name: Signal Praxis IndexNow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/indexnow-signal.yml'
      - 'signal/**'
      - 'ai-council-builder.html'
      - 'ai-council-builder-ja.html'
      - 'smartphone-income-blueprint.html'
      - 'smartphone-ai-slide-factory.html'
      - 'return-gate/**'
      - 'social-revenue-pathfinder.html'
      - 'social-revenue-pathfinder-ja.html'
      - 'guides/**'
      - 'image-commerce/**'
      - 'passage-hub/**'
      - 'passage-network.html'
      - 'prompt-systems.html'
      - 'workflow-operator.html'
      - 'daily-edge/**'
      - 'stack-pulse/**'
      - 'sitemap.xml'
      - '54b81c12e07af0e37b6ab0ac24469586.txt'
  workflow_dispatch:

concurrency:
  group: signal-indexnow
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages deployment edge
        run: sleep 45
      - name: Notify IndexNow once
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --retry 1 --retry-delay 10 \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d '{
              "host":"stratumpraxis.com",
              "key":"54b81c12e07af0e37b6ab0ac24469586",
              "keyLocation":"https://stratumpraxis.com/54b81c12e07af0e37b6ab0ac24469586.txt",
              "urlList":[
                "https://stratumpraxis.com/",
                "https://stratumpraxis.com/return-gate/",
                "https://stratumpraxis.com/return-gate/en/",
                "https://stratumpraxis.com/social-revenue-pathfinder.html",
                "https://stratumpraxis.com/social-revenue-pathfinder-ja.html",
                "https://stratumpraxis.com/guides/",
                "https://stratumpraxis.com/guides/ai-saas-renewal-cost-check.html",
                "https://stratumpraxis.com/image-commerce/",
                "https://stratumpraxis.com/passage-hub/",
                "https://stratumpraxis.com/passage-network.html",
                "https://stratumpraxis.com/prompt-systems.html",
                "https://stratumpraxis.com/workflow-operator.html",
                "https://stratumpraxis.com/daily-edge/",
                "https://stratumpraxis.com/stack-pulse/",
                "https://stratumpraxis.com/ai-council-builder.html",
                "https://stratumpraxis.com/ai-council-builder-ja.html",
                "https://stratumpraxis.com/smartphone-income-blueprint.html",
                "https://stratumpraxis.com/smartphone-ai-slide-factory.html",
                "https://stratumpraxis.com/signal/",
                "https://stratumpraxis.com/signal/bing-indexnow-2026.html",
                "https://stratumpraxis.com/signal/google-discover-preferred-sources-2026.html",
                "https://stratumpraxis.com/signal/ai-tool-buying-rule-2026.html",
                "https://stratumpraxis.com/signal/validate-digital-product-from-phone-2026.html"
              ]
            }' \
            https://api.indexnow.org/indexnow
