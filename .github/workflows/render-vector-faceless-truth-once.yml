name: Render Vector Faceless AI Truth Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-vector-faceless-truth-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-vector-faceless-truth-once
  cancel-in-progress: false

jobs:
  render-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install media and Japanese font dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk

      - name: Download approved Japanese narration
        working-directory: campaigns/vector-faceless-truth-remotion
        env:
          NARRATION_URL: 'https://resource2.heygen.ai/text_to_speech/a97602ecc435417ab1b776674e7db173/662e1397965c484e8f65fa58c77effde/id=b265d91d-a4b7-4780-8f94-590b5ec17d6b.wav'
        run: |
          mkdir -p public output/qa-stills
          curl --fail --silent --show-error --location "$NARRATION_URL" -o public/narration.wav
          test -s public/narration.wav

      - name: Install Remotion project
        working-directory: campaigns/vector-faceless-truth-remotion
        run: npm install

      - name: Generate BGM revision 3
        working-directory: campaigns/vector-faceless-truth-remotion
        run: node music.mjs

      - name: Audio QA
        working-directory: campaigns/vector-faceless-truth-remotion
        run: |
          NARR_DUR="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 public/narration.wav)"
          BGM_DUR="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 public/bgm.wav)"
          echo "NARRATION_DURATION=$NARR_DUR"
          echo "BGM_DURATION=$BGM_DUR"
          python3 - <<'PY'
          import subprocess
          n=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1','public/narration.wav']).decode())
          b=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1','public/bgm.wav']).decode())
          assert 91.5 <= n <= 93.5, n
          assert 93.5 <= b <= 94.5, b
          print('AUDIO_QA=PASS')
          PY

      - name: Render 1080x1920 master
        working-directory: campaigns/vector-faceless-truth-remotion
        run: npm run render

      - name: Technical QA
        working-directory: campaigns/vector-faceless-truth-remotion
        run: |
          f='output/vector-faceless-ai-tiktok-truth.mp4'
          test -s "$f"
          ffprobe -v error -show_entries stream=width,height,codec_name -show_entries format=duration -of json "$f" | tee output/qa.json
          python3 - <<'PY'
          import json
          q=json.load(open('output/qa.json'))
          v=next((s for s in q['streams'] if s.get('width')),None)
          a=next((s for s in q['streams'] if s.get('codec_name')=='aac'),None)
          d=float(q['format']['duration'])
          assert v and v['width']==1080 and v['height']==1920, v
          assert a, q['streams']
          assert 93.5 <= d <= 94.5, d
          print('MASTER_QA=PASS')
          PY

      - name: Extract eight visual QA frames
        working-directory: campaigns/vector-faceless-truth-remotion
        run: |
          times=(3 14 28 46 58 70 82 91)
          i=1
          for t in "${times[@]}"; do
            ffmpeg -y -loglevel error -ss "$t" -i output/vector-faceless-ai-tiktok-truth.mp4 -frames:v 1 "output/qa-stills/frame-$(printf '%02d' "$i").png"
            i=$((i+1))
          done
          test "$(find output/qa-stills -name 'frame-*.png' | wc -l)" -eq 8

      - name: Persist master and QA evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          persist=/tmp/vector-video-persist
          rm -rf "$persist"
          mkdir -p "$persist"
          files=(
            campaigns/vector-faceless-truth-remotion/output/vector-faceless-ai-tiktok-truth.mp4
            campaigns/vector-faceless-truth-remotion/output/qa.json
            campaigns/vector-faceless-truth-remotion/output/qa-stills/frame-01.png
            campaigns/vector-faceless-truth-remotion/output/qa-stills/frame-02.png
            campaigns/vector-faceless-truth-remotion/output/qa-stills/frame-03.png
            campaigns/vector-faceless-truth-remotion/output/qa-stills/frame-04.png
            campaigns/vector-faceless-truth-remotion/output/qa-stills/frame-05.png
            campaigns/vector-faceless-truth-remotion/output/qa-stills/frame-06.png
            campaigns/vector-faceless-truth-remotion/output/qa-stills/frame-07.png
            campaigns/vector-faceless-truth-remotion/output/qa-stills/frame-08.png
          )
          cp --parents "${files[@]}" "$persist"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp -a "$persist"/. .
            git add "${files[@]}"
            if git diff --cached --quiet; then
              echo 'No render changes.'
              exit 0
            fi
            git commit -m 'Render Vector faceless AI truth video v1'
            if git push origin HEAD:main; then
              echo 'VECTOR_VIDEO_RENDER_PUBLISHED=1'
              exit 0
            fi
          done
          exit 1
