name: Verify Stratum TikTok Friendly Voice Publication

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-stratum-tiktok-friendly-voice.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-stratum-tiktok-friendly-voice-20260902
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_CHANNEL_ID: 6a8e5d28ccaf649a671a13e7
      BUFFER_POST_ID: 6a971c66a9e3af9a883cdae3
      STATUS_FILE: distribution/stratum-tiktok-friendly-voice-status.json
      PUBLIC_VIDEO_URL: https://raw.githubusercontent.com/stratumpraxis/stratum-praxis/main/campaigns/cross-agent-remotion/output/stratum-tiktok-friendly-voice-20260902-v1.mp4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read back exact Buffer post until TikTok public URL exists
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const key=process.env.BUFFER_API_KEY;
          if(!key) throw new Error('BUFFER_API_KEY missing');
          const API='https://api.buffer.com';
          const q=s=>JSON.stringify(String(s));
          async function gql(query){
            const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},body:JSON.stringify({query})});
            const j=await r.json();
            if(!r.ok||j.errors) throw new Error(JSON.stringify(j.errors||j));
            return j.data;
          }
          const acct=await gql('query { account { organizations { id name } } }');
          const org=acct.account?.organizations?.[0];
          if(!org) throw new Error('No Buffer organization');
          const channels=await gql(`query { channels(input:{organizationId:${q(org.id)},filter:{isLocked:false}}){id name displayName service} }`);
          const target=(channels.channels||[]).find(c=>c.id===process.env.TARGET_CHANNEL_ID && String(c.service).toLowerCase()==='tiktok');
          if(!target) throw new Error('Safety stop: exact Stratum TikTok channel unavailable');
          let found=null;
          for(let attempt=1;attempt<=18;attempt++){
            const data=await gql(`query { posts(first:25,input:{organizationId:${q(org.id)},filter:{channelIds:[${q(target.id)}]},sort:[{field:createdAt,direction:desc}]}) { edges { node { id text dueAt status sentAt externalLink } } } }`);
            const posts=(data.posts?.edges||[]).map(e=>e?.node).filter(Boolean);
            found=posts.find(p=>p.id===process.env.BUFFER_POST_ID);
            console.log(`VERIFY_ATTEMPT=${attempt} FOUND=${Boolean(found)} STATUS=${found?.status||''} SENT_AT=${found?.sentAt||''} LINK=${found?.externalLink||''}`);
            if(found?.externalLink && String(found.externalLink).includes('tiktok.com/@stratumpraxis/video/')) break;
            if(found && ['failed','error'].includes(String(found.status||'').toLowerCase())) throw new Error(`Buffer/TikTok publish failed: ${found.status}`);
            if(attempt<18) await new Promise(r=>setTimeout(r,10000));
          }
          if(!found) throw new Error('Exact Buffer post not found');
          if(!found.externalLink || !String(found.externalLink).includes('tiktok.com/@stratumpraxis/video/')) throw new Error(`Public TikTok URL not verified; status=${found.status||'unknown'}`);
          const evidence={
            campaign:'stratum-tiktok-friendly-voice-20260902-v1',
            platform:'tiktok',
            channelId:process.env.TARGET_CHANNEL_ID,
            channel:'stratumpraxis',
            bufferPostId:found.id,
            status:found.status||null,
            sentAt:found.sentAt||null,
            externalLink:found.externalLink,
            videoUrl:process.env.PUBLIC_VIDEO_URL,
            voice:'Sunny / friendly English male',
            checkedAt:new Date().toISOString(),
            productUrl:'https://stratumpraxis.com/cross-agent-operating-kit.html?utm_source=tiktok&utm_medium=organic_video&utm_campaign=cross_agent_personal&utm_content=friendly_voice_v1&route_id=tiktok_cross_agent_friendly_20260902'
          };
          fs.writeFileSync(process.env.STATUS_FILE,JSON.stringify(evidence,null,2)+'\n');
          console.log(JSON.stringify(evidence,null,2));
          NODE

      - name: Persist verified public URL
        run: |
          set -euo pipefail
          git config user.name 'stratum-tiktok-bot'
          git config user.email 'stratumpraxis@gmail.com'
          git add "$STATUS_FILE"
          git commit -m 'Record verified Stratum TikTok friendly voice publication'
          git pull --rebase origin main
          git push origin HEAD:main
