name: Render AI Stack Campaign Videos

on:
  push:
    branches: [main]
    paths:
      - 'trend-video-engine/variants/2026-08-27-ai-stack-sprawl-short.json'
      - 'trend-video-engine/variants/2026-08-27-ai-stack-finance-demo.json'
      - 'trend-video-engine/render.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-ai-stack-campaign-videos
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Render vertical short
        run: python3 trend-video-engine/render.py trend-video-engine/variants/2026-08-27-ai-stack-sprawl-short.json
      - name: Render finance demo
        run: python3 trend-video-engine/render.py trend-video-engine/variants/2026-08-27-ai-stack-finance-demo.json
      - name: Commit rendered MP4 files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/trend-videos/2026-08-27-ai-stack-sprawl-short.mp4 media/trend-videos/2026-08-27-ai-stack-finance-demo.mp4
          if git diff --cached --quiet; then
            echo "No rendered media changes."
            exit 0
          fi
          git commit -m "Render AI stack campaign videos"
          git push
