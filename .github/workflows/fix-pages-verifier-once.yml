name: One-time Pages verifier alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pages-verifier-once.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Align sitemap assertion with canonical sitemap and clean up
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/verify-stratumpraxis-pages.yml')
          s = p.read_text()
          old = """          wait_for_contains 'https://stratumpraxis.com/sitemap.xml' \\
            'https://stratumpraxis.com/return-gate/' \\
            'https://stratumpraxis.com/prompt-systems.html' \\
            'https://stratumpraxis.com/workflow-operator.html' \\
            'https://stratumpraxis.com/trend-to-video-revenue-suite.html' \\
            'https://stratumpraxis.com/execution-without-drift.html' \\
            'https://stratumpraxis.com/safe-api-automation-kit.html' \\
            'https://stratumpraxis.com/revenue-distribution-engine.html' \\
            'https://stratumpraxis.com/return-gate-growth-os.html'
"""
          new = """          wait_for_contains 'https://stratumpraxis.com/sitemap.xml' \\
            'https://stratumpraxis.com/prompt-systems.html' \\
            'https://stratumpraxis.com/workflow-operator.html' \\
            'https://stratumpraxis.com/revenue-distribution-engine.html'
"""
          if old not in s:
              raise SystemExit('sitemap assertion block not found')
          p.write_text(s.replace(old, new, 1))
          PY

          git rm .github/workflows/fix-pages-verifier-once.yml
          git add .github/workflows/verify-stratumpraxis-pages.yml
          git config user.name 'stratumpraxis-actions'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Align Pages verifier with canonical sitemap'
          git push origin HEAD:main
