name: Forwelle Publish AI Wasnt the Bottleneck Once

on:
  push:
    paths:
      - 'distribution/forwelle-ai-bottleneck.trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-once:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VIDEO_URL: https://resource2.heygen.ai/aws_pacific/avatar_tmp/a97602ecc435417ab1b776674e7db173/ve6f960ed0ea04f888ef85598f4165eff/caption_b068548938e3451db425862bfa61225b.mp4
      TARGET_TITLE: "AI Wasn’t the Bottleneck — The Workflow Was #Shorts"
      EXPECTED_CHANNEL_ID: UCw9wnPzccaPba5rLKWyL6nQ
      KNOWN_FORWELLE_PRIVATE_VIDEO_ID: 0SO0uIn3aIg
    steps:
      - name: Validate destination, upload private, then publish
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          cat > /tmp/publish.mjs <<'EOF'
          const required = ['YOUTUBE_CLIENT_ID','YOUTUBE_CLIENT_SECRET','YOUTUBE_REFRESH_TOKEN','VIDEO_URL','TARGET_TITLE','EXPECTED_CHANNEL_ID','KNOWN_FORWELLE_PRIVATE_VIDEO_ID'];
          for (const name of required) if (!process.env[name]) throw new Error(`Missing ${name}`);

          const tokenResponse = await fetch('https://oauth2.googleapis.com/token', {
            method: 'POST',
            headers: {'content-type':'application/x-www-form-urlencoded'},
            body: new URLSearchParams({
              client_id: process.env.YOUTUBE_CLIENT_ID,
              client_secret: process.env.YOUTUBE_CLIENT_SECRET,
              refresh_token: process.env.YOUTUBE_REFRESH_TOKEN,
              grant_type: 'refresh_token',
            }),
          });
          const tokenJson = await tokenResponse.json();
          if (!tokenResponse.ok || !tokenJson.access_token) throw new Error(`OAuth refresh failed: ${tokenJson.error || tokenResponse.status}`);
          const auth = {authorization:`Bearer ${tokenJson.access_token}`};

          // Fail closed before any new upload: inspect a private video that was successfully
          // uploaded by the established Forwelle production workflow using these same secrets.
          const probeUrl = new URL('https://www.googleapis.com/youtube/v3/videos');
          probeUrl.searchParams.set('part','snippet,status');
          probeUrl.searchParams.set('id',process.env.KNOWN_FORWELLE_PRIVATE_VIDEO_ID);
          const probeResponse = await fetch(probeUrl, {headers: auth});
          const probeJson = await probeResponse.json();
          if (!probeResponse.ok || !probeJson.items?.length) {
            throw new Error(`Destination validation failed before upload: ${probeJson?.error?.message || probeResponse.status}`);
          }
          const probe = probeJson.items[0];
          console.log(`DESTINATION_CHANNEL_ID=${probe.snippet?.channelId || ''}`);
          console.log(`DESTINATION_PROBE_TITLE=${probe.snippet?.title || ''}`);
          if (probe.snippet?.channelId !== process.env.EXPECTED_CHANNEL_ID) {
            throw new Error(`Safety stop: destination channel mismatch (${probe.snippet?.channelId || 'unknown'})`);
          }

          const sourceResponse = await fetch(process.env.VIDEO_URL);
          if (!sourceResponse.ok) throw new Error(`Video download failed: ${sourceResponse.status}`);
          const video = Buffer.from(await sourceResponse.arrayBuffer());
          if (video.length < 100000) throw new Error(`Video payload too small: ${video.length}`);
          console.log(`VIDEO_BYTES=${video.length}`);

          const metadata = {
            snippet: {
              title: process.env.TARGET_TITLE,
              description: "More AI tools don't automatically make work faster. The bottleneck is often workflow design: roles, handoffs, permissions, and human gates.\n\nForwelle explores practical AI systems and automation.\n\n#AI #Automation #AIAgents #Shorts",
              categoryId: '28',
              tags: ['AI','Automation','AI Agents','Workflow','Forwelle','Shorts'],
              defaultLanguage: 'en',
            },
            status: {
              privacyStatus: 'private',
              selfDeclaredMadeForKids: false,
              containsSyntheticMedia: true,
            },
          };

          const boundary = `forwelle_${Date.now()}_${Math.random().toString(16).slice(2)}`;
          const prefix = Buffer.from(`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: video/mp4\r\n\r\n`);
          const suffix = Buffer.from(`\r\n--${boundary}--\r\n`);
          const body = Buffer.concat([prefix, video, suffix]);
          const uploadResponse = await fetch('https://www.googleapis.com/upload/youtube/v3/videos?part=snippet,status&uploadType=multipart', {
            method:'POST',
            headers:{...auth,'content-type':`multipart/related; boundary=${boundary}`,'content-length':String(body.length)},
            body,
          });
          const uploadJson = await uploadResponse.json();
          if (!uploadResponse.ok || !uploadJson.id) throw new Error(`YouTube private upload failed: ${uploadJson?.error?.errors?.[0]?.reason || uploadJson?.error?.message || uploadResponse.status}`);
          console.log(`PRIVATE_UPLOAD_VIDEO_ID=${uploadJson.id}`);
          console.log(`PRIVATE_UPLOAD_CHANNEL_ID=${uploadJson.snippet?.channelId || ''}`);
          if (uploadJson.snippet?.channelId !== process.env.EXPECTED_CHANNEL_ID) {
            throw new Error(`Safety stop: uploaded video landed on unexpected channel (${uploadJson.snippet?.channelId || 'unknown'}); left private`);
          }

          const publishBody = {
            id: uploadJson.id,
            status: {
              privacyStatus: 'public',
              selfDeclaredMadeForKids: false,
              containsSyntheticMedia: true,
            },
          };
          const publishResponse = await fetch('https://www.googleapis.com/youtube/v3/videos?part=status', {
            method:'PUT',
            headers:{...auth,'content-type':'application/json'},
            body:JSON.stringify(publishBody),
          });
          const publishJson = await publishResponse.json();
          if (!publishResponse.ok || publishJson.status?.privacyStatus !== 'public') {
            throw new Error(`Public status update failed: ${publishJson?.error?.errors?.[0]?.reason || publishJson?.error?.message || publishResponse.status}`);
          }

          const verifyUrl = new URL('https://www.googleapis.com/youtube/v3/videos');
          verifyUrl.searchParams.set('part','snippet,status');
          verifyUrl.searchParams.set('id',uploadJson.id);
          const verifyResponse = await fetch(verifyUrl, {headers:auth});
          const verifyJson = await verifyResponse.json();
          if (!verifyResponse.ok || !verifyJson.items?.length) throw new Error('Publication verification failed');
          const uploaded = verifyJson.items[0];
          console.log(`YOUTUBE_VIDEO_ID=${uploaded.id}`);
          console.log(`YOUTUBE_VIDEO_URL=https://www.youtube.com/watch?v=${uploaded.id}`);
          console.log(`VERIFIED_TITLE=${uploaded.snippet?.title || ''}`);
          console.log(`VERIFIED_CHANNEL_ID=${uploaded.snippet?.channelId || ''}`);
          console.log(`PRIVACY_STATUS=${uploaded.status?.privacyStatus || ''}`);
          if (uploaded.snippet?.channelId !== process.env.EXPECTED_CHANNEL_ID) throw new Error('Post-publication channel mismatch');
          if (uploaded.status?.privacyStatus !== 'public') throw new Error(`Upload exists but is not public: ${uploaded.status?.privacyStatus}`);
          EOF
          node /tmp/publish.mjs
