name: Patch Cross-Agent Product Video Demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-cross-agent-video-demo.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-cross-agent-video-demo
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add existing product video to conversion surface
        run: python scripts/patch_cross_agent_video_demo.py

      - name: Validate product video embed
        run: |
          test -s campaigns/cross-agent-remotion/output/cross-agent-operating-kit-personal.mp4
          grep -q 'id="cross-agent-product-demo"' cross-agent-operating-kit.html
          grep -q '34-second product demo' cross-agent-operating-kit.html
          grep -q 'product_video_play' cross-agent-conversion.js
          node --check cross-agent-conversion.js
          echo 'PRODUCT_VIDEO_EMBED_QA=PASS'

      - name: Commit product video conversion patch
        run: |
          set -euo pipefail
          git config user.name 'stratum-conversion-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add cross-agent-operating-kit.html cross-agent-conversion.js
          if git diff --cached --quiet; then
            echo 'No product video changes required.'
            exit 0
          fi
          git commit -m 'conversion: embed existing Cross-Agent product demo [skip video-demo-patch]'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo 'PRODUCT_VIDEO_PATCH_PUBLISHED=1'
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..." >&2
            sleep $((attempt * 3))
          done
          exit 1
