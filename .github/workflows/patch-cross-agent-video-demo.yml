name: Patch Cross-Agent Product Video Demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-cross-agent-video-demo.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-cross-agent-video-demo
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add existing product video to conversion surface
        run: |
          python - <<'PY'
          from pathlib import Path

          html_path = Path('cross-agent-operating-kit.html')
          js_path = Path('cross-agent-conversion.js')
          video_path = Path('campaigns/cross-agent-remotion/output/cross-agent-operating-kit-personal.mp4')
          html = html_path.read_text()
          js = js_path.read_text()

          if not video_path.exists() or video_path.stat().st_size < 1_000_000:
              raise SystemExit('Existing product video is missing or unexpectedly small')

          if 'id="cross-agent-product-demo"' not in html:
              css_anchor = '</style>'
              css = '''
    .product-demo{margin-top:30px;padding:26px;border:1px solid #263934;border-radius:18px;background:#0c1414;display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,320px);gap:34px;align-items:center}.product-demo-copy .kicker{margin-bottom:10px}.product-demo-copy h2{margin:0 0 12px;font-size:clamp(27px,3.3vw,42px);line-height:1.08;letter-spacing:-.035em;font-weight:650}.product-demo-copy p{margin:0 0 16px;color:#9eaba6;font-size:13px;line-height:1.7}.product-demo-facts{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:17px}.product-demo-facts span{padding:6px 9px;border:1px solid #263a34;border-radius:999px;background:#091211;color:#aab7b2;font-size:11.5px}.product-demo-video{width:100%;aspect-ratio:9/16;max-height:570px;border:1px solid #324941;border-radius:15px;background:#050908;object-fit:cover;box-shadow:0 22px 50px rgba(0,0,0,.24)}.product-demo-note{color:#81918b!important;font-size:11.5px!important}.product-demo .btn{width:max-content}@media(max-width:760px){.product-demo{grid-template-columns:1fr;gap:22px;padding:20px}.product-demo-video{width:min(100%,360px);justify-self:center;max-height:none}.product-demo .btn{width:100%}}
'''
              if css_anchor not in html:
                  raise SystemExit('Style anchor missing')
              html = html.replace(css_anchor, css + '  </style>', 1)

              anchor = '  <section class="shell section" id="preview" aria-labelledby="preview-title">'
              block = '''  <section class="shell product-demo" aria-labelledby="product-demo-title">
    <div class="product-demo-copy">
      <p class="kicker"><span class="locale locale-en">34-second product demo</span><span class="locale locale-ja">34秒の商品デモ</span><span class="locale locale-ko">34초 제품 데모</span><span class="locale locale-zh">34 秒产品演示</span></p>
      <h2 id="product-demo-title"><span class="locale locale-en">See the operating layer before paying.</span><span class="locale locale-ja">購入前に、運用レイヤーを動画で確認。</span><span class="locale locale-ko">결제 전에 운영 레이어를 영상으로 확인하세요.</span><span class="locale locale-zh">付款前先用视频查看运营层。</span></h2>
      <p><span class="locale locale-en">A short walkthrough of the problem, the portable control layer, and the Personal license. No testimonial claims—just the product structure and intended use.</span><span class="locale locale-ja">課題、持ち運べる制御レイヤー、Personalライセンスを短く確認できます。実績を誇張せず、商品の構造と用途だけを見せます。</span><span class="locale locale-ko">문제, 이식 가능한 제어 레이어, Personal 라이선스를 짧게 확인할 수 있습니다.</span><span class="locale locale-zh">快速查看问题、可迁移控制层和 Personal 许可。</span></p>
      <div class="product-demo-facts"><span>13 editable files</span><span>Personal · $69 one-time</span><span>No subscription</span><span>Verified delivery</span></div>
      <a class="btn btn-primary" href="#pricing" data-analytics-id="cross_agent_video_to_pricing"><span class="locale locale-en">See license & checkout ↓</span><span class="locale locale-ja">ライセンスと決済を見る ↓</span><span class="locale locale-ko">라이선스와 결제 보기 ↓</span><span class="locale locale-zh">查看许可与结账 ↓</span></a>
      <p class="product-demo-note"><span class="locale locale-en">Video loads on demand. Playback is optional.</span><span class="locale locale-ja">動画は必要時だけ読み込みます。再生しなくても購入判断に必要な情報はページ内にあります。</span><span class="locale locale-ko">영상은 필요할 때만 로드됩니다.</span><span class="locale locale-zh">视频仅在需要时加载。</span></p>
    </div>
    <video id="cross-agent-product-demo" class="product-demo-video" controls playsinline preload="metadata" aria-label="Cross-Agent Operating Kit product demo">
      <source src="/campaigns/cross-agent-remotion/output/cross-agent-operating-kit-personal.mp4" type="video/mp4">
    </video>
  </section>

'''
              if anchor not in html:
                  raise SystemExit('Preview section anchor missing')
              html = html.replace(anchor, block + anchor, 1)

          if 'product_video_play' not in js:
              init_anchor = "  document.addEventListener('click', function (event) {"
              tracker = '''  const demoVideo = document.getElementById('cross-agent-product-demo');
  if (demoVideo) {
    let played = false;
    let half = false;
    demoVideo.addEventListener('play', function () {
      if (played) return;
      played = true;
      if (window.scosCapture) window.scosCapture('product_video_play', { product: 'cross_agent_operating_kit', asset: 'cross_agent_operating_kit_personal_v1', duration_seconds: 34 });
    });
    demoVideo.addEventListener('timeupdate', function () {
      if (half || !demoVideo.duration || demoVideo.currentTime < demoVideo.duration * 0.5) return;
      half = true;
      if (window.scosCapture) window.scosCapture('product_video_half', { product: 'cross_agent_operating_kit', asset: 'cross_agent_operating_kit_personal_v1' });
    });
    demoVideo.addEventListener('ended', function () {
      if (window.scosCapture) window.scosCapture('product_video_complete', { product: 'cross_agent_operating_kit', asset: 'cross_agent_operating_kit_personal_v1' });
    });
  }

'''
              if init_anchor not in js:
                  raise SystemExit('JS insertion anchor missing')
              js = js.replace(init_anchor, tracker + init_anchor, 1)

          html_path.write_text(html)
          js_path.write_text(js)
          PY

      - name: Validate product video embed
        run: |
          test -s campaigns/cross-agent-remotion/output/cross-agent-operating-kit-personal.mp4
          grep -q 'id="cross-agent-product-demo"' cross-agent-operating-kit.html
          grep -q '34-second product demo' cross-agent-operating-kit.html
          grep -q 'product_video_play' cross-agent-conversion.js
          node --check cross-agent-conversion.js
          echo 'PRODUCT_VIDEO_EMBED_QA=PASS'

      - name: Commit product video conversion patch
        run: |
          set -euo pipefail
          git config user.name 'stratum-conversion-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add cross-agent-operating-kit.html cross-agent-conversion.js
          if git diff --cached --quiet; then
            echo 'No product video changes required.'
            exit 0
          fi
          git commit -m 'conversion: embed existing Cross-Agent product demo [skip video-demo-patch]'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo 'PRODUCT_VIDEO_PATCH_PUBLISHED=1'
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..." >&2
            sleep $((attempt * 3))
          done
          exit 1
