name: One-time Systems Library entry point restore

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-systems-footer-link-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore Systems Library footer entry and clean up
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          if 'href="/systems/"' not in s:
              old = '<nav><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a><a href="/ai-saas-spend-decision-kit.html" data-analytics-id="footer_39_kit">$39 Kit</a></nav>'
              new = '<nav><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a><a href="/systems/" data-analytics-id="footer_systems_library">Systems Library</a><a href="/ai-saas-spend-decision-kit.html" data-analytics-id="footer_39_kit">$39 Kit</a></nav>'
              if old not in s:
                  raise SystemExit('footer anchor not found')
              p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/add-systems-footer-link-once.yml
          git add index.html
          git config user.name 'stratumpraxis-actions'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Restore Systems Library footer entry point'
          git push origin HEAD:main
