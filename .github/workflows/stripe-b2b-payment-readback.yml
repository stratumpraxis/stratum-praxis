name: Stripe B2B Payment Readback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stripe-b2b-payment-readback.yml'

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read Cross-Agent and Workflow Audit checkout sessions
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${STRIPE_SECRET_KEY:-}" ]; then
            echo "::error::STRIPE_SECRET_KEY missing"
            exit 1
          fi
          node <<'NODE'
          const {execFileSync}=require('node:child_process');
          const links={
            cross69:'plink_1U9h4LJMK7zFs997nRbhDVq9',
            audit499:'plink_1U6MpdJMK7zFs997yR0juzUo'
          };
          const key=process.env.STRIPE_SECRET_KEY;
          let all=[], starting_after=null, pages=0;
          while(pages<5){
            const args=['-sS','-G','https://api.stripe.com/v1/checkout/sessions','-u',key+':','--data-urlencode','limit=100'];
            if(starting_after) args.push('--data-urlencode','starting_after='+starting_after);
            const raw=execFileSync('curl',args,{encoding:'utf8',maxBuffer:20*1024*1024});
            const d=JSON.parse(raw);
            if(!Array.isArray(d.data)) throw new Error('Stripe list failed');
            all.push(...d.data);
            pages++;
            if(!d.has_more || d.data.length===0) break;
            starting_after=d.data[d.data.length-1].id;
          }
          for(const [name,plink] of Object.entries(links)){
            const rows=all.filter(s=>s.payment_link===plink);
            const paid=rows.filter(s=>s.payment_status==='paid');
            const latest=rows.slice().sort((a,b)=>(b.created||0)-(a.created||0))[0]||null;
            const latestPaid=paid.slice().sort((a,b)=>(b.created||0)-(a.created||0))[0]||null;
            console.log(JSON.stringify({
              route:name,
              payment_link:plink,
              sessions_total:rows.length,
              paid_total:paid.length,
              latest_session_id:latest?.id||null,
              latest_session_status:latest?.status||null,
              latest_payment_status:latest?.payment_status||null,
              latest_amount_total:latest?.amount_total??null,
              latest_currency:latest?.currency||null,
              latest_created:latest?.created?new Date(latest.created*1000).toISOString():null,
              latest_paid_session_id:latestPaid?.id||null,
              latest_paid_amount_total:latestPaid?.amount_total??null,
              latest_paid_created:latestPaid?.created?new Date(latestPaid.created*1000).toISOString():null
            }));
          }
          console.log(JSON.stringify({pages_scanned:pages,sessions_scanned:all.length}));
          NODE
