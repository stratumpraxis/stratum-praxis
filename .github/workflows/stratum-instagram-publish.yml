name: Stratum Instagram Direct Publish

on:
  push:
    branches: [main]
    paths:
      - 'publishing/queue/stratum-instagram-*.json'
      - 'scripts/publish_instagram_official.mjs'
  workflow_dispatch:
    inputs:
      package_path:
        description: Instagram publish package path
        required: true
        default: publishing/queue/stratum-instagram-roi-001.json

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve package
        id: package
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "path=${{ inputs.package_path }}" >> "$GITHUB_OUTPUT"
          else
            path=$(git diff-tree --no-commit-id --name-only -r HEAD -- 'publishing/queue/stratum-instagram-*.json' | head -n 1)
            if [ -z "$path" ]; then
              echo 'No changed Instagram publish package found; fail closed.' >&2
              exit 1
            fi
            echo "path=$path" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish through official Instagram API
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: node scripts/publish_instagram_official.mjs "${{ steps.package.outputs.path }}"
      - name: Persist publication evidence
        shell: bash
        run: |
          git config user.name 'stratum-publishing-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add publishing/evidence/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'evidence: persist Stratum Instagram publication [skip social]'
          git pull --rebase origin main
          git push origin main
