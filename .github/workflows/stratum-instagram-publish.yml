name: Stratum Instagram Direct Publish

on:
  workflow_dispatch:
    inputs:
      package_path:
        description: Instagram publish package path
        required: true
        default: publishing/queue/stratum-instagram-roi-001.json

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish through official Instagram API
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: node scripts/publish_instagram_official.mjs "${{ inputs.package_path }}"
      - name: Persist publication evidence
        shell: bash
        run: |
          git config user.name 'stratum-publishing-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add publishing/evidence/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'evidence: persist Stratum Instagram publication'
          git push
