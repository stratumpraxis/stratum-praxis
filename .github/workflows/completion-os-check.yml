name: Completion OS check

on:
  push:
    paths:
      - 'completion-os/**'
      - '.github/workflows/completion-os-check.yml'
  pull_request:
    paths:
      - 'completion-os/**'
      - '.github/workflows/completion-os-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax and unit tests
        run: |
          node --check completion-os/evaluate.mjs
          node --check completion-os/test.mjs
          node --check completion-os/adapters/github-deploy-status.mjs
          node --check completion-os/adapters/test-github-deploy-status.mjs
          node --check completion-os/adapters/http-live-check.mjs
          node --check completion-os/adapters/test-http-live-check.mjs
          node --check completion-os/adapters/browser-dom-check.mjs
          node --check completion-os/adapters/test-browser-dom-check.mjs
          node --check completion-os/adapters/webdriver-interaction-check.mjs
          node --check completion-os/adapters/analytics-usage-evidence.mjs
          node --check completion-os/adapters/test-analytics-usage-evidence.mjs
          node completion-os/test.mjs
          node completion-os/adapters/test-github-deploy-status.mjs
          node completion-os/adapters/test-http-live-check.mjs
          node completion-os/adapters/test-browser-dom-check.mjs
          node completion-os/adapters/test-analytics-usage-evidence.mjs

      - name: Validate dated resilience case
        run: |
          node completion-os/evaluate.mjs completion-os/cases/2026-09-14-resilience.json > /tmp/completion-result.json
          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('/tmp/completion-result.json', 'utf8'));
          if (!Array.isArray(result) || result.length !== 2) throw new Error('expected two resilience cases');
          for (const item of result) {
            if (item.complete !== false) throw new Error(`${item.asset_id}: expected incomplete`);
            if (item.proven_through !== 'source') throw new Error(`${item.asset_id}: expected source as proven_through`);
            if (item.blocker_gate !== 'deploy') throw new Error(`${item.asset_id}: expected deploy blocker`);
            if (item.blocker_status !== 'blocked') throw new Error(`${item.asset_id}: expected blocked status`);
            if (!item.later_gates_not_proven.includes('live')) throw new Error(`${item.asset_id}: live must remain unproven`);
          }
          console.log('Dated resilience case validated');
          NODE

      - name: Validate deploy-status fixture classification
        run: |
          node completion-os/adapters/github-deploy-status.mjs \
            --file completion-os/fixtures/vercel-rate-limit-status.json \
            --context '^Vercel – money-resilience$' > /tmp/deploy-gate.json
          node - <<'NODE'
          const fs = require('fs');
          const gate = JSON.parse(fs.readFileSync('/tmp/deploy-gate.json', 'utf8'));
          if (gate.status !== 'blocked') throw new Error(`expected blocked, got ${gate.status}`);
          if (gate.retry_after !== '24 hours') throw new Error(`expected 24 hours, got ${gate.retry_after}`);
          console.log('Deploy-status fixture classified as external block');
          NODE

      - name: Validate current source against Live contracts
        run: |
          node completion-os/adapters/http-live-check.mjs \
            --spec completion-os/live-specs/money-resilience.json \
            --html money-resilience/index.html \
            --status 200 \
            --final-url https://moneyresilience.vercel.app/ > /tmp/money-live-contract.json
          node completion-os/adapters/http-live-check.mjs \
            --spec completion-os/live-specs/ordlume.json \
            --html 72-hour-household-readiness/index.html \
            --status 200 \
            --final-url https://ordlume.vercel.app/ > /tmp/ordlume-live-contract.json
          node - <<'NODE'
          const fs = require('fs');
          for (const file of ['/tmp/money-live-contract.json', '/tmp/ordlume-live-contract.json']) {
            const gate = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (gate.static_checks_passed !== true) throw new Error(`${file}: static contract must pass`);
            if (gate.status !== 'unknown') throw new Error(`${file}: runtime-required asset must remain unknown without browser evidence`);
          }
          console.log('Current source satisfies static Live contracts without falsely proving runtime Live');
          NODE

      - name: Validate dated Usage observation
        run: |
          node completion-os/adapters/analytics-usage-evidence.mjs \
            completion-os/evidence/2026-09-14-usage-observation.json > /tmp/usage-evidence.json
          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('/tmp/usage-evidence.json', 'utf8'));
          if (!Array.isArray(result) || result.length !== 2) throw new Error('expected two usage observations');
          const money = result.find(x => x.asset_id === 'money-resilience');
          const ordlume = result.find(x => x.asset_id === 'ordlume');
          if (!money || !ordlume) throw new Error('expected Money Resilience and OrdLume usage observations');
          if (money.status !== 'unknown' || money.automated_only !== true || money.measurement_gap !== false) {
            throw new Error('Money Resilience must remain Usage unknown with automated-only evidence');
          }
          if (ordlume.status !== 'unknown' || ordlume.measurement_gap !== true) {
            throw new Error('OrdLume must remain Usage unknown with a measurement gap');
          }
          console.log('Dated Usage observation validated without promoting exposure/automation to Usage');
          NODE
