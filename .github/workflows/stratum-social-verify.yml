name: Stratum Social Verify
# verify-trigger: 2026-09-13-tiktok-signal-path-002

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stratum-social-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify current TikTok status and public URL
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_POST_IDS: 6aa5c3a4bcabda92e19dcbb3
        run: node distribution/buffer-post-status.mjs
