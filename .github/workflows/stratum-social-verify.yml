name: Stratum Social Verify
# verify-trigger: 2026-09-13-exact-errors

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stratum-social-verify.yml'
      - 'distribution/stratum-social-error-evidence.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect exact Buffer errors
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node distribution/stratum-social-error-evidence.mjs
