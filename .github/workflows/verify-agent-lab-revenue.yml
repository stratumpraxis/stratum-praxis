name: Verify Agent Lab Revenue Loop
# Production QA runs after Agent Lab checkout-stack changes.

on:
  push:
    branches: [main]
    paths:
      - 'agent-lab/**'
      - 'worker/agent-lab*.js'
      - 'worker/wrangler.toml'
      - '.github/workflows/verify-agent-lab-revenue.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public Agent Lab and access page
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://stratum-praxis-site.pages.dev'
          curl -L -fsS "$SITE/agent-lab/" -o /tmp/lab.html
          grep -Fq 'LIVE FIELD LAB' /tmp/lab.html
          grep -Fq 'ai-consultant-verify.practicalaireport.workers.dev/agent-lab/checkout' /tmp/lab.html
          grep -Fq 'href="/agent-lab/access.html"' /tmp/lab.html
          curl -L -fsS "$SITE/agent-lab/access.html" -o /tmp/access.html
          grep -Fq '/agent-lab/activate' /tmp/access.html
          grep -Fq 'OPEN MEMBER' /tmp/access.html
          echo 'Public Agent Lab + member activation surface -> PASS'

      - name: Verify protected member guards
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ai-consultant-verify.practicalaireport.workers.dev'
          code="$(curl -sS -o /tmp/member.txt -w '%{http_code}' "$BASE/agent-lab/workspace")"
          test "$code" = '401'
          code="$(curl -sS -o /tmp/activate.txt -w '%{http_code}' -X POST "$BASE/agent-lab/activate" -H 'Content-Type: application/json' --data '{"session_id":"invalid"}')"
          test "$code" = '400'
          echo 'Protected member guards -> PASS'

      - name: Verify live Stripe checkout
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ai-consultant-verify.practicalaireport.workers.dev'
          curl -sS -D /tmp/headers.txt -o /tmp/checkout-body.txt "$BASE/agent-lab/checkout?route_id=qa_agent_lab_final"
          code="$(awk 'NR==1{print $2}' /tmp/headers.txt)"
          location="$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^[^:]*:[[:space:]]*/,"");gsub(/\r/,"");print;exit}' /tmp/headers.txt)"
          echo "Checkout HTTP: $code"
          echo "Checkout Location: $location"
          cat /tmp/checkout-body.txt || true
          test "$code" = '303'
          echo "$location" | grep -Eq '^https://checkout\.stripe\.com/'
          echo 'Live Stripe checkout creation -> PASS'
