name: Patch Cross-Agent Agent Lab choice

on:
  push:
    paths:
      - '.github/workflows/patch-cross-agent-agent-lab-choice.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add recurring Agent Lab choice without disturbing kit checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('cross-agent-operating-kit.html')
          s = p.read_text()
          if 'cross_agent_agent_lab_checkout' in s:
              print('Agent Lab choice already present; no-op.')
              raise SystemExit(0)
          css_anchor = "    .scope-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:12px;border:1px solid #1d282e;border-radius:14px;overflow:hidden;background:#1d282e}.scope-item{padding:15px;background:#0a1013}.scope-item b{display:block;margin-bottom:3px;color:#b5c0ba;font-size:10px}.scope-item span{color:#6e7b75;font-size:9px;line-height:1.45}\n"
          css = base64.b64decode('').decode()
          if css_anchor not in s:
              raise SystemExit('CSS anchor not found')
          s = s.replace(css_anchor, css + css_anchor, 1)
          mobile_anchor = "    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}"
          mobile = "    @media(max-width:720px){.agent-lab-choice{grid-template-columns:1fr;gap:17px;padding:20px}.btn-lab{width:100%;min-width:0}}\n    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.agent-lab-choice::after{animation:none}}"
          if mobile_anchor not in s:
              raise SystemExit('Reduced-motion anchor not found')
          s = s.replace(mobile_anchor, mobile, 1)
          html_anchor = '        <div class="scope-bar" aria-label="License scope summary">'
          choice = base64.b64decode('').decode()
          if html_anchor not in s:
              raise SystemExit('HTML anchor not found')
          s = s.replace(html_anchor, choice + html_anchor, 1)
          p.write_text(s)
          PY
      - name: Verify patch
        run: |
          grep -q 'cross_agent_agent_lab_checkout' cross-agent-operating-kit.html
          grep -q 'Need the live lab, not just the finished kit?' cross-agent-operating-kit.html
          grep -q 'agent-lab-choice' cross-agent-operating-kit.html
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'stratum-praxis-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add cross-agent-operating-kit.html
          git commit -m 'Add Agent Lab recurring choice to Cross-Agent kit'
          git push
