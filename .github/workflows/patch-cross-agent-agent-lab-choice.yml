name: Patch Cross-Agent Agent Lab choice

on:
  push:
    paths:
      - '.github/workflows/patch-cross-agent-agent-lab-choice.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add recurring Agent Lab choice without disturbing kit checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('cross-agent-operating-kit.html')
          s = p.read_text(encoding='utf-8')
          if 'cross_agent_agent_lab_checkout' in s:
              print('Agent Lab choice already present; no-op.')
              raise SystemExit(0)
          css = base64.b64decode('').decode()
          css_pos = s.find('    .scope-bar{')
          if css_pos < 0:
              raise SystemExit('scope-bar CSS marker not found')
          s = s[:css_pos] + css + s[css_pos:]
          style_end = s.find('  </style>')
          if style_end < 0:
              raise SystemExit('style end not found')
          responsive = '    @media(max-width:720px){.agent-lab-choice{grid-template-columns:1fr;gap:17px;padding:20px}.btn-lab{width:100%;min-width:0}}\n    @media(prefers-reduced-motion:reduce){.agent-lab-choice::after{animation:none}}\n'
          s = s[:style_end] + responsive + s[style_end:]
          html_anchor = '        <div class="scope-bar" aria-label="License scope summary">'
          html_pos = s.find(html_anchor)
          if html_pos < 0:
              raise SystemExit('scope-bar HTML marker not found')
          choice = base64.b64decode('').decode()
          s = s[:html_pos] + choice + s[html_pos:]
          p.write_text(s, encoding='utf-8')
          print('patched')
          PY
      - name: Verify patch
        run: |
          grep -q 'cross_agent_agent_lab_checkout' cross-agent-operating-kit.html
          grep -q 'Need the live lab, not just the finished kit?' cross-agent-operating-kit.html
          grep -q 'agent-lab-choice' cross-agent-operating-kit.html
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'stratum-praxis-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add cross-agent-operating-kit.html
          git commit -m 'Add Agent Lab recurring choice to Cross-Agent kit'
          git push
