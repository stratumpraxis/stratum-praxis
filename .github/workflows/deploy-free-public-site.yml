name: Deploy Free Public Site

on:
  push:
    branches: [main]
    paths-ignore:
      - '.claude/**'
      - '.github/**'
      - 'acquisition/**'
      - 'content/**'
      - 'docs/**'
      - 'evidence/**'
      - 'market/**'
      - 'revenue-os/**'
      - 'tests/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: stratum-praxis-free-public-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify AI agent economics math contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { computeAgentEconomics, compareAgentEconomics } from './ai-agent-economics-calculator.mjs';
          const current = computeAgentEconomics({
            volume:1000, executionsPerOutcome:3, modelCostPerExecution:.08, toolCostPerExecution:.02,
            fixedMonthlyCost:150, retryRatePct:15, finalFailureRatePct:8, reviewMinutesPerOutcome:1.5,
            reviewHourlyCost:45, businessValuePerSuccess:8, humanMinutesPerSuccess:6, humanHourlyCost:45
          });
          const comparison = computeAgentEconomics({
            volume:1000, executionsPerOutcome:3.5, modelCostPerExecution:.03, toolCostPerExecution:.02,
            fixedMonthlyCost:150, retryRatePct:25, finalFailureRatePct:14, reviewMinutesPerOutcome:2,
            reviewHourlyCost:45, businessValuePerSuccess:8, humanMinutesPerSuccess:6, humanHourlyCost:45
          });
          const cmp = compareAgentEconomics(current, comparison);
          const near = (a,b,t=1e-6) => Math.abs(a-b) <= t;
          if (!near(current.allInMonthlyCost, 1620)) throw new Error('current all-in cost mismatch');
          if (!near(current.successfulOutcomes, 920)) throw new Error('current successful outcomes mismatch');
          if (!near(current.costPerSuccessfulOutcome, 1620/920)) throw new Error('current unit cost mismatch');
          if (!near(current.humanOnlyEquivalentCost, 4140)) throw new Error('human equivalent mismatch');
          if (cmp.lowerCostScenario !== 'current') throw new Error('comparison ranking mismatch');
          console.log('AI Agent Economics deterministic math contract -> PASS');
          NODE

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'worker' \
            --exclude 'node_modules' \
            --exclude 'revenue-os' \
            --exclude 'CNAME'

      - name: Ensure free Pages project exists
        working-directory: _site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages project create stratum-praxis-site --production-branch main >/tmp/pages-create.log 2>&1 || true
          cat /tmp/pages-create.log || true

      - name: Deploy to free pages.dev domain
        working-directory: _site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy . --project-name stratum-praxis-site --branch main | tee /tmp/pages-deploy.log
          deploy_url="$(grep -oE 'https://[a-z0-9]+\.stratum-praxis-site\.pages\.dev' /tmp/pages-deploy.log | tail -n 1)"
          if [ -z "$deploy_url" ]; then
            echo 'Could not determine deployment-specific Pages URL.'
            cat /tmp/pages-deploy.log
            exit 1
          fi
          echo "DEPLOY_BASE=$deploy_url" >> "$GITHUB_ENV"
          echo "Exact deployment URL: $deploy_url"

      - name: Verify free public routes
        shell: bash
        run: |
          set -euo pipefail
          BASE="${DEPLOY_BASE:?Missing deployment-specific Pages URL}"
          echo "Verifying exact deployed revision at $BASE"

          assert_markers() {
            local url="$1"
            local outfile="$2"
            shift 2
            local attempt marker missing
            for attempt in 1 2 3 4 5 6; do
              curl -L -sS "$url" -o "$outfile"
              missing=0
              for marker in "$@"; do
                if ! grep -Fq "$marker" "$outfile"; then
                  echo "Attempt $attempt missing marker at $url: $marker"
                  missing=1
                fi
              done
              if [ "$missing" -eq 0 ]; then
                echo "Markers stable at $url on attempt $attempt"
                return 0
              fi
              sleep 3
            done
            echo "Markers did not stabilize at $url"
            head -c 1200 "$outfile" || true
            return 1
          }

          for path in / /systems/ /b2b/ /live-lab.html /product-router.html /buyer-workspace.html /workflow-audit.html /revenue-pump/ /revenue-pump/auto/ /ai-monetization-reality-check.html /ai-income-claim-checklist.html /cross-agent-operating-kit.html /cross-agent-operating-kit-access.html /agent-control-auditor.html /ai-agent-economics-calculator.html /ai-saas-waste-calculator.html /ai-saas-spend-audit-checklist.html /ai-saas-spend-decision-kit.html /ai-value-realization-kit.html /ai-saas-spend-waste-audit.html /ai-saas-spend-monitoring.html /rustchain-bounty-radar.html /spend-roi-v6.css; do
            code="$(curl -L -sS -o /tmp/page.txt -w '%{http_code}' "$BASE$path")"
            if [ "$code" != '200' ]; then
              echo "Expected 200 for $BASE$path, got $code"
              head -c 500 /tmp/page.txt || true
              exit 1
            fi
            echo "Route OK: $BASE$path -> 200"
          done

          assert_markers "$BASE/" /tmp/home.html \
            'data-page="stratum_revenue_home_v2"' \
            'href="/stratum-revenue-home.css?v=1"' \
            'href="/product-router.html"' \
            'src="/stratum-revenue-home.js?v=1"'
          echo 'Current Stratum revenue homepage markers -> PASS'

          assert_markers "$BASE/buyer-workspace.html" /tmp/buyer-workspace.html \
            'content="noindex,nofollow,noarchive"' \
            'Use what you bought.' \
            'href="/cross-agent-operating-kit-access.html"' \
            'href="/workflow-audit.html"' \
            'href="/ai-saas-spend-monitoring.html"'
          echo 'Buyer Workspace gateway and protected-delivery routing -> PASS'

          assert_markers "$BASE/workflow-audit.html" /tmp/workflow-audit.html \
            'data-page="workflow_audit_v4"' \
            'href="/stratum-office-v4.css"' \
            'https://buy.stripe.com/14A00kgfqavh4Wkgoj6Zy02'
          echo 'Workflow audit and checkout markers -> PASS'

          assert_markers "$BASE/b2b/" /tmp/b2b.html \
            'data-page="workflow_diagnostic_v4"' \
            'data-funnel="workflow_diagnostic"' \
            'id="question-host"' \
            'Audit this workflow — $499' \
            'No purchase recommended for this workflow.'
          echo 'B2B decision diagnostic functional markers -> PASS'

          assert_markers "$BASE/live-lab.html" /tmp/live-lab.html \
            'data-page="live_lab_v4"' \
            'id="intent-buttons"' \
            'id="inventory"' \
            'href="/product-router.html"'
          echo 'Live Lab inventory and product-route markers -> PASS'

          assert_markers "$BASE/product-router.html" /tmp/product-router.html \
            'REVENUE ROUTE OS' \
            'LIVE DECISION MAP' \
            'MARKET LADDER' \
            'THREE DECISION SYSTEMS' \
            'data-route="spend"' \
            'data-route="workflow"' \
            'data-route="agent"' \
            'href="/buyer-workspace.html"' \
            'href="/workflow-audit.html"'
          echo 'Revenue Route OS visual decision interface -> PASS'

          curl -L -sS "$BASE/stratum-catalog-v3.js" -o /tmp/catalog.js
          grep -Fq "name:'AI Value Realization Kit'" /tmp/catalog.js
          grep -Fq "name:'Cross-Agent Operating Kit'" /tmp/catalog.js
          if grep -Fq "name:'AI Workflow SOP & Governance Kit'" /tmp/catalog.js; then
            echo 'Legacy SOP product resurfaced in active catalog'; exit 1
          fi
          if grep -Fq "name:'AI Workspace Safety & Workflow Kit'" /tmp/catalog.js; then
            echo 'Legacy workspace product resurfaced in active catalog'; exit 1
          fi
          echo 'Active paid catalog is limited to current direct-purchase routes -> PASS'

          assert_markers "$BASE/ai-saas-waste-calculator.html" /tmp/spend-calc.html \
            'href="/spend-roi-v6.css"' \
            'Put a number on <em>software drift.</em>' \
            'id="annual"' \
            'id="calcResultSummary"' \
            'data-product="ai_saas_spend_decision_kit"' \
            'href="/ai-saas-spend-decision-kit.html"' \
            'https://buy.stripe.com/cNi00kgfq7j5ewUfkf6Zy06' \
            'href="/ai-saas-spend-waste-audit.html"'
          echo 'Spend & ROI V6 calculator decision routing and evidence surface -> PASS'

          assert_markers "$BASE/ai-saas-spend-audit-checklist.html" /tmp/spend-checklist.html \
            'href="/spend-roi-v6.css"' \
            '12 questions. No essay.' \
            'KEEP' \
            'data-product="ai_saas_spend_decision_kit"' \
            'href="/ai-saas-spend-decision-kit.html"' \
            'https://buy.stripe.com/cNi00kgfq7j5ewUfkf6Zy06'
          echo 'Spend & ROI V6 checklist and Decision Kit route -> PASS'

          assert_markers "$BASE/ai-saas-spend-decision-kit.html" /tmp/spend-decision-kit.html \
            'AI & SaaS Spend Decision Kit — $39' \
            'Get the Spend Decision Kit — $39' \
            'https://buy.stripe.com/cNi00kgfq7j5ewUfkf6Zy06' \
            'href="ai-saas-spend-waste-audit.html"'
          echo 'Spend Decision Kit conversion page -> PASS'

          assert_markers "$BASE/ai-value-realization-kit.html" /tmp/value-kit.html \
            'href="/spend-roi-v6.css"' \
            'SELF-SERVICE · $39 ONE-TIME' \
            'https://buy.stripe.com/9B6bJ22oA6f160oegb6Zy00' \
            'href="/ai-saas-spend-waste-audit.html"'
          echo 'Spend & ROI V6 $39 conversion page -> PASS'

          assert_markers "$BASE/ai-saas-spend-waste-audit.html" /tmp/spend-audit.html \
            'href="/spend-roi-v6.css"' \
            'FIXED-SCOPE · WRITTEN DELIVERY · NO CALL REQUIRED' \
            'https://buy.stripe.com/14A00kgfqavh4Wkgoj6Zy02' \
            'Start Audit — $499'
          echo 'Spend & ROI V6 $499 audit conversion page -> PASS'

          assert_markers "$BASE/ai-saas-spend-monitoring.html" /tmp/spend-monitoring.html \
            'href="/spend-roi-v6.css"' \
            'POST-AUDIT · OPTIONAL · RECURRING' \
            'https://buy.stripe.com/aFaaEY9R25aXdsQb3Z6Zy04' \
            'https://buy.stripe.com/cNi6oI7IU6f1gF2c836Zy05'
          echo 'Spend & ROI V6 recurring conversion page -> PASS'

          assert_markers "$BASE/revenue-pump/" /tmp/revenue-pump.html \
            'REVENUE PUMP SCORE' \
            'WORTH REWORKING' \
            'revenue_pump_scan_complete' \
            'Request Audit' \
            'Ask about Blueprint'
          echo 'Revenue Pump scoring and escalation markers -> PASS'

          assert_markers "$BASE/revenue-pump/auto/" /tmp/revenue-pump-auto.html \
            'REVENUE PUMP AUTO SCAN' \
            'AUTO STRUCTURE SCORE' \
            'WORTH REWORKING' \
            'revenue_pump_auto_complete' \
            'Paste page text or HTML'
          echo 'Revenue Pump Auto Scan markers -> PASS'

          curl -L -sS "$BASE/ai-monetization-reality-check.html" -o /tmp/reality-check.html
          grep -Fq 'ai_monetization_reality_check_checkout_1' /tmp/reality-check.html
          grep -Fq 'ai_monetization_reality_check_checkout_2' /tmp/reality-check.html
          grep -Fq 'https://buy.stripe.com/cNi7sMgfq1YLagE4FB6Zy0j' /tmp/reality-check.html
          grep -Fq 'ai-income-claim-checklist.html' /tmp/reality-check.html
          grep -Fq 'revenue-router.html' /tmp/reality-check.html
          echo 'AI Monetization Reality Check revenue-route markers -> PASS'

          curl -L -sS "$BASE/ai-income-claim-checklist.html" -o /tmp/income-checklist.html
          grep -Fq 'id="scoreBtn"' /tmp/income-checklist.html
          grep -Fq 'class="q"' /tmp/income-checklist.html
          grep -Fq 'ai-monetization-reality-check.html' /tmp/income-checklist.html
          echo 'AI Income Claim Checklist functional and route markers -> PASS'

          curl -L -sS "$BASE/agent-control-auditor.html" -o /tmp/agent-control-auditor.html
          grep -Fq 'Free AI Agent Control Auditor | Human Gates, Permissions & Budget Limits' /tmp/agent-control-auditor.html
          grep -Fq "qualified_tool_action" /tmp/agent-control-auditor.html
          grep -Fq 'agent_control_auditor_pro_after_result' /tmp/agent-control-auditor.html
          grep -Fq 'Unlock complete Pro report — $29 one-time' /tmp/agent-control-auditor.html
          echo 'Agent Control Auditor qualified-action and revenue markers -> PASS'

          curl -L -sS "$BASE/ai-agent-economics-calculator.html" -o /tmp/agent-economics.html
          grep -Fq 'Cost per successful outcome' /tmp/agent-economics.html
          grep -Fq 'agent_economics_result' /tmp/agent-economics.html
          grep -Fq 'agent_economics_to_499_audit' /tmp/agent-economics.html
          grep -Fq 'Review the $499 Workflow Audit →' /tmp/agent-economics.html
          echo 'AI Agent Economics Calculator analytics and revenue route markers -> PASS'

          curl -L -sS 'https://stratumpraxis.com/rustchain-bounty-radar.html' -o /tmp/rustchain-bounty-radar.html
          grep -Fq 'Build a read-only RustChain bounty radar with the GitHub API' /tmp/rustchain-bounty-radar.html
          grep -Fq 'By <strong>Stratum Praxis</strong>' /tmp/rustchain-bounty-radar.html
          echo 'RustChain bounty radar custom-domain route and byline -> PASS'

      - name: Verify Pinterest media routes
        shell: bash
        run: |
          set -euo pipefail
          BASE="${DEPLOY_BASE:?Missing deployment-specific Pages URL}"
          for path in /media/pinterest/ai-workflow-checklist-v1.mp4 /media/pinterest/ai-workflow-checklist-v1-cover.png; do
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' "$BASE$path")"
            if [ "$code" != '200' ]; then
              echo "Expected 200 for $BASE$path, got $code"
              exit 1
            fi
            echo "Public media OK: $BASE$path -> 200"
          done