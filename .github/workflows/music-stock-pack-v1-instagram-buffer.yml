name: Music Stock Pack v1 Instagram Buffer Publish

on:
  push:
    branches: [main]
    paths:
      - 'distribution/music-stock-pack-v1-instagram.json'
      - '.github/workflows/music-stock-pack-v1-instagram-buffer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preflight verified Stratum Instagram identity
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_TARGET_SERVICES: instagram
          BUFFER_QUEUE_FILE: music-stock-pack-v1-instagram.json
          BUFFER_SELECT_MODE: first
          BUFFER_POST_MODE: shareNow
          REQUIRE_ELIGIBLE_CHANNELS: '1'
          REQUIRE_CHANNEL_NAME_CONTAINS: praxisstratum
          DRY_RUN: '1'
        run: node distribution/buffer-publisher.mjs
      - name: Publish Music Stock Pack to verified Stratum Instagram
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_TARGET_SERVICES: instagram
          BUFFER_QUEUE_FILE: music-stock-pack-v1-instagram.json
          BUFFER_SELECT_MODE: first
          BUFFER_POST_MODE: shareNow
          REQUIRE_ELIGIBLE_CHANNELS: '1'
          REQUIRE_CHANNEL_NAME_CONTAINS: praxisstratum
          DRY_RUN: '0'
        run: node distribution/buffer-publisher.mjs
