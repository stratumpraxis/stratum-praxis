name: Deploy AI Consultant Verification Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-ai-consultant-worker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy Worker and capture status
        id: deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npx --yes wrangler@latest deploy > /tmp/wrangler.log 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then outcome=success; else outcome=failure; fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          mkdir -p ../.deployment-status
          sed -E 's/(token|secret|key)[=:][^[:space:]]+/\1=[REDACTED]/Ig' /tmp/wrangler.log | tail -n 80 > ../.deployment-status/ai-consultant-worker.log

      - name: Record deploy status
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outputs.outcome }}
          DEPLOY_EXIT_CODE: ${{ steps.deploy.outputs.exit_code }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p .deployment-status
          printf '{"workflow":"ai-consultant-worker","outcome":"%s","exit_code":"%s","source_commit":"%s","run_id":"%s","checked_at":"%s"}\n' "$DEPLOY_OUTCOME" "$DEPLOY_EXIT_CODE" "$COMMIT_SHA" "$RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deployment-status/ai-consultant-worker.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deployment-status/ai-consultant-worker.json .deployment-status/ai-consultant-worker.log
          if ! git diff --cached --quiet; then
            git commit -m "Record AI consultant Worker deployment diagnostics"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Fail workflow if deploy failed
        if: steps.deploy.outputs.outcome != 'success'
        run: exit 1
