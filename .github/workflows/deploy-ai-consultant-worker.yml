name: Deploy AI Consultant Verification Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-ai-consultant-worker.yml'
  workflow_dispatch:

concurrency:
  group: ai-consultant-verification-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Smoke-test protected routes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ai-consultant-verify.practicalaireport.workers.dev'
          for path in /slide-factory/workspace /smartphone-income/workspace /council/workspace /council-ja/workspace; do
            code="$(curl -sS -o /tmp/worker-response.txt -w '%{http_code}' "$BASE$path")"
            if [ "$code" != '401' ]; then
              echo "Expected 401 for unauthenticated $path, got $code"
              cat /tmp/worker-response.txt
              exit 1
            fi
            echo "Protected route OK: $path -> 401 without buyer token"
          done