name: Deploy AI Consultant Verification Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '!worker/x402-agent-api/**'
      - '.github/workflows/deploy-ai-consultant-worker.yml'
  workflow_dispatch:

concurrency:
  group: ai-consultant-verification-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run worker unit tests
        run: node --test worker/prompt-store-worker.test.mjs

      - name: Verify Stripe live credential capability
        shell: bash
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${STRIPE_SECRET_KEY:-}" ]; then
            echo "::error::Repository secret STRIPE_SECRET_KEY is not configured."
            exit 1
          fi

          case "$STRIPE_SECRET_KEY" in
            sk_live_*)
              status="$(curl -sS -o /tmp/stripe-account.json -w '%{http_code}' https://api.stripe.com/v1/account -u "$STRIPE_SECRET_KEY:")"
              if [ "$status" != '200' ]; then
                echo "::error::Stripe live secret validation failed with HTTP $status."
                exit 1
              fi
              account_id="$(node -e "const d=require('/tmp/stripe-account.json');process.stdout.write(String(d.id||''))")"
              if [ "$account_id" != 'acct_1U0vFWJMK7zFs997' ]; then
                echo "::error::Stripe credential targets unexpected account."
                exit 1
              fi
              echo "Stripe live secret target OK."
              ;;
            rk_live_*)
              # Restricted keys can intentionally deny /v1/account. Verify the
              # exact capability this Worker needs instead: reading live Checkout Sessions.
              status="$(curl -sS -G -o /tmp/stripe-sessions.json -w '%{http_code}' https://api.stripe.com/v1/checkout/sessions -u "$STRIPE_SECRET_KEY:" --data-urlencode 'limit=1')"
              if [ "$status" != '200' ]; then
                echo "::error::Restricted Stripe key cannot read Checkout Sessions (HTTP $status)."
                exit 1
              fi
              live_check="$(node -e "const d=require('/tmp/stripe-sessions.json'); const x=(d.data||[])[0]; process.stdout.write(x ? String(x.livemode===true) : 'empty')")"
              if [ "$live_check" = 'false' ]; then
                echo "::error::Restricted Stripe key returned a test-mode Checkout Session."
                exit 1
              fi
              echo "Restricted live Stripe key has Checkout Session read capability."
              ;;
            *)
              echo "::error::STRIPE_SECRET_KEY is not a recognized live Stripe key."
              exit 1
              ;;
          esac

      - name: Verify Revenue Router Stripe credential
        shell: bash
        env:
          STRIPE_REVENUE_ROUTER_KEY: ${{ secrets.STRIPE_PAYMENT_LINK_ADMIN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${STRIPE_REVENUE_ROUTER_KEY:-}" ]; then
            echo "::error::Repository secret STRIPE_PAYMENT_LINK_ADMIN_KEY is not configured."
            exit 1
          fi

          status="$(curl -sS -o /tmp/revenue-router-link.json -w '%{http_code}' https://api.stripe.com/v1/payment_links/plink_1U7AvVJMK7zFs997FZnUvfi8 -u "$STRIPE_REVENUE_ROUTER_KEY:")"
          if [ "$status" != '200' ]; then
            echo "::error::Revenue Router Stripe key cannot read canonical Payment Link (HTTP $status)."
            exit 1
          fi
          node - <<'NODE'
          const d=require('/tmp/revenue-router-link.json');
          if (d.id !== 'plink_1U7AvVJMK7zFs997FZnUvfi8') throw new Error('Unexpected Revenue Router Payment Link');
          if (d.livemode !== true) throw new Error('Revenue Router Payment Link is not live');
          if (d.url !== 'https://buy.stripe.com/cNifZifbm7j574s1tp6Zy08') throw new Error('Unexpected Revenue Router Payment Link URL');
          console.log('Revenue Router Stripe account target OK.');
          NODE

          status="$(curl -sS -G -o /tmp/revenue-router-sessions.json -w '%{http_code}' https://api.stripe.com/v1/checkout/sessions -u "$STRIPE_REVENUE_ROUTER_KEY:" --data-urlencode 'limit=1')"
          if [ "$status" != '200' ]; then
            echo "::error::Revenue Router Stripe key cannot read Checkout Sessions (HTTP $status)."
            exit 1
          fi
          echo "Revenue Router Stripe key has required read capability."

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Sync Stripe secret to live Worker
        working-directory: worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$STRIPE_SECRET_KEY" | npx --yes wrangler@latest secret put STRIPE_SECRET_KEY

      - name: Sync Revenue Router Stripe secret to live Worker
        working-directory: worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_REVENUE_ROUTER_KEY: ${{ secrets.STRIPE_PAYMENT_LINK_ADMIN_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$STRIPE_REVENUE_ROUTER_KEY" | npx --yes wrangler@latest secret put STRIPE_REVENUE_ROUTER_KEY

      - name: Smoke-test Revenue Router live Stripe read path
        shell: bash
        env:
          STRIPE_REVENUE_ROUTER_KEY: ${{ secrets.STRIPE_PAYMENT_LINK_ADMIN_KEY }}
        run: |
          set -euo pipefail
          BASE='https://ai-consultant-verify.practicalaireport.workers.dev'
          curl -fsS -G https://api.stripe.com/v1/checkout/sessions             -u "$STRIPE_REVENUE_ROUTER_KEY:"             --data-urlencode 'limit=100' > /tmp/revenue-router-live-sessions.json
          sid="$(node -e "const d=require('/tmp/revenue-router-live-sessions.json');const x=(d.data||[]).find(s=>s.payment_link==='plink_1U7AvVJMK7zFs997FZnUvfi8');process.stdout.write(x?.id||'')")"
          if [ -z "$sid" ]; then
            echo "::error::No live Revenue Router Checkout Session was available for read-path verification."
            exit 1
          fi
          payload="$(node -e "process.stdout.write(JSON.stringify({session_id:process.argv[1],email:'qa@example.invalid',offer:'revenue_router'}))" "$sid")"
          code="$(curl -sS -o /tmp/revenue-router-live-read.txt -w '%{http_code}' -X POST "$BASE/revenue-router/login" -H 'Content-Type: application/json' --data "$payload")"
          if [ "$code" != '402' ] && [ "$code" != '403' ]; then
            echo "::error::Revenue Router live Stripe read path did not reach purchase/email verification; got HTTP $code."
            cat /tmp/revenue-router-live-read.txt
            exit 1
          fi
          echo "Revenue Router live Stripe read path OK: verification reached HTTP $code."

      - name: Smoke-test protected routes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ai-consultant-verify.practicalaireport.workers.dev'
          for path in /slide-factory/workspace /smartphone-income/workspace /council/workspace /council-ja/workspace /prompt-store/workspace /cross-agent-kit/workspace /spend-decision-kit/workspace /revenue-router/workspace /paid-insights/workspace /agent-lab/workspace; do
            code="$(curl -sS -o /tmp/worker-response.txt -w '%{http_code}' "$BASE$path")"
            if [ "$code" != '401' ]; then
              echo "Expected 401 for unauthenticated $path, got $code"
              cat /tmp/worker-response.txt
              exit 1
            fi
            echo "Protected route OK: $path -> 401 without buyer token"
          done

          code="$(curl -sS -o /tmp/agent-lab-activate.txt -w '%{http_code}' -X POST "$BASE/agent-lab/activate" -H 'Content-Type: application/json' --data '{"session_id":"invalid"}')"
          if [ "$code" != '400' ]; then
            echo "Expected 400 for invalid Agent Lab activation, got $code"
            cat /tmp/agent-lab-activate.txt
            exit 1
          fi
          echo "Agent Lab invalid-activation guard OK: 400"

          code="$(curl -sS -o /tmp/prompt-login.txt -w '%{http_code}' -X POST "$BASE/prompt-store/login" -H 'Content-Type: application/json' --data '{"session_id":"invalid","email":"qa@example.com"}')"
          if [ "$code" != '400' ]; then
            echo "Expected 400 for invalid Prompt Store login, got $code"
            cat /tmp/prompt-login.txt
            exit 1
          fi
          echo "Prompt Store invalid-login guard OK: 400"

          code="$(curl -sS -o /tmp/cross-agent-login.txt -w '%{http_code}' -X POST "$BASE/cross-agent-kit/login" -H 'Content-Type: application/json' --data '{"session_id":"invalid","email":"qa@example.com","offer":"cross_personal"}')"
          if [ "$code" != '400' ]; then
            echo "Expected 400 for invalid Cross-Agent Kit login, got $code"
            cat /tmp/cross-agent-login.txt
            exit 1
          fi
          echo "Cross-Agent Kit invalid-login guard OK: 400"

          code="$(curl -sS -o /tmp/spend-kit-login.txt -w '%{http_code}' -X POST "$BASE/spend-decision-kit/login" -H 'Content-Type: application/json' --data '{"session_id":"invalid","email":"qa@example.com","offer":"spend_kit"}')"
          if [ "$code" != '400' ]; then
            echo "Expected 400 for invalid Spend Decision Kit login, got $code"
            cat /tmp/spend-kit-login.txt
            exit 1
          fi
          echo "Spend Decision Kit invalid-login guard OK: 400"


          code="$(curl -sS -o /tmp/revenue-router-login.txt -w '%{http_code}' -X POST "$BASE/revenue-router/login" -H 'Content-Type: application/json' --data '{"session_id":"invalid","email":"qa@example.com","offer":"revenue_router"}')"
          if [ "$code" != '400' ]; then
            echo "Expected 400 for invalid Revenue Router login, got $code"
            cat /tmp/revenue-router-login.txt
            exit 1
          fi
          echo "Revenue Router invalid-login guard OK: 400"

          code="$(curl -sS -o /tmp/paid-insights-login.txt -w '%{http_code}' -X POST "$BASE/paid-insights/login" -H 'Content-Type: application/json' --data '{"session_id":"invalid","email":"qa@example.com"}')"
          if [ "$code" != '400' ]; then
            echo "Expected 400 for invalid Paid Insights login, got $code"
            cat /tmp/paid-insights-login.txt
            exit 1
          fi
          echo "Paid Insights invalid-login guard OK: 400"

          code="$(curl -sS -o /tmp/music-login.txt -w '%{http_code}' -X POST "$BASE/music-stock-pack-v1/login" -H 'Content-Type: application/json' --data '{"session_id":"invalid","email":"qa@example.com"}')"
          if [ "$code" != '400' ]; then
            echo "Expected 400 for invalid Music Stock Pack login, got $code"
            cat /tmp/music-login.txt
            exit 1
          fi
          echo "Music Stock Pack invalid-login guard OK: 400"

          code="$(curl -sS -o /tmp/music-delivery.txt -w '%{http_code}' "$BASE/music-stock-pack-v1/delivery")"
          if [ "$code" != '401' ]; then
            echo "Expected 401 for Music Stock Pack delivery without buyer token, got $code"
            cat /tmp/music-delivery.txt
            exit 1
          fi
          echo "Music Stock Pack buyer-delivery guard OK: 401"

          code="$(curl -sS -D /tmp/music-checkout-headers.txt -o /tmp/music-checkout-body.txt -w '%{http_code}' "$BASE/music-stock-pack-v1/checkout")"
          if [ "$code" = '303' ]; then
            location="$(tr -d '\r' < /tmp/music-checkout-headers.txt | awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/, ""); print; exit}')"
            case "$location" in
              https://checkout.stripe.com/*)
                echo "Music Stock Pack live checkout redirect OK: 303 -> checkout.stripe.com"
                ;;
              *)
                echo "::warning::Music Stock Pack checkout returned 303 but not a Stripe Checkout URL: $location"
                ;;
            esac
          else
            echo "::warning::DEGRADED_MUSIC_CHECKOUT: expected 303, got $code. This lane requires Stripe Checkout write permission; read-only buyer verification lanes remain deployable."
            cat /tmp/music-checkout-body.txt || true
          fi

          code="$(curl -sS -o /tmp/stripe-webhook.txt -w '%{http_code}' -X POST "$BASE/stripe/webhook" -H 'Content-Type: application/json' --data '{}')"
          if [ "$code" != '400' ] && [ "$code" != '503' ]; then
            echo "Expected 400 (signature guard) or 503 (secret not configured) for unsigned webhook, got $code"
            cat /tmp/stripe-webhook.txt
            exit 1
          fi
          echo "Stripe webhook rejects unsigned payload: $code"

          code="$(curl -sS -o /tmp/auditor-status.txt -w '%{http_code}' "$BASE/agent-control-auditor/status")"
          if [ "$code" != '401' ]; then
            echo "Expected 401 for unpaid Agent Control Auditor Pro, got $code"
            cat /tmp/auditor-status.txt
            exit 1
          fi
          echo "Agent Control Auditor unpaid guard OK: 401"
