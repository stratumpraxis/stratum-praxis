name: Deploy AI Consultant Verification Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-ai-consultant-worker.yml'
  workflow_dispatch:

concurrency:
  group: ai-consultant-verification-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Smoke-test protected routes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ai-consultant-verify.practicalaireport.workers.dev'
          for path in /slide-factory/workspace /smartphone-income/workspace /council/workspace /council-ja/workspace /prompt-store/workspace /cross-agent-kit/workspace /paid-insights/workspace; do
            code="$(curl -sS -o /tmp/worker-response.txt -w '%{http_code}' "$BASE$path")"
            if [ "$code" != '401' ]; then
              echo "Expected 401 for unauthenticated $path, got $code"
              cat /tmp/worker-response.txt
              exit 1
            fi
            echo "Protected route OK: $path -> 401 without buyer token"
          done

          code="$(curl -sS -o /tmp/prompt-login.txt -w '%{http_code}' -X POST "$BASE/prompt-store/login" -H 'Content-Type: application/json' --data '{"session_id":"invalid","email":"qa@example.com"}')"
          if [ "$code" != '400' ]; then
            echo "Expected 400 for invalid Prompt Store login, got $code"
            cat /tmp/prompt-login.txt
            exit 1
          fi
          echo "Prompt Store invalid-login guard OK: 400"

          code="$(curl -sS -o /tmp/cross-agent-login.txt -w '%{http_code}' -X POST "$BASE/cross-agent-kit/login" -H 'Content-Type: application/json' --data '{"session_id":"invalid","email":"qa@example.com","offer":"cross_personal"}')"
          if [ "$code" != '400' ]; then
            echo "Expected 400 for invalid Cross-Agent Kit login, got $code"
            cat /tmp/cross-agent-login.txt
            exit 1
          fi
          echo "Cross-Agent Kit invalid-login guard OK: 400"

          code="$(curl -sS -o /tmp/paid-insights-login.txt -w '%{http_code}' -X POST "$BASE/paid-insights/login" -H 'Content-Type: application/json' --data '{"session_id":"invalid","email":"qa@example.com"}')"
          if [ "$code" != '400' ]; then
            echo "Expected 400 for invalid Paid Insights login, got $code"
            cat /tmp/paid-insights-login.txt
            exit 1
          fi
          echo "Paid Insights invalid-login guard OK: 400"

          code="$(curl -sS -o /tmp/stripe-webhook.txt -w '%{http_code}' -X POST "$BASE/stripe/webhook" -H 'Content-Type: application/json' --data '{}')"
          if [ "$code" != '400' ] && [ "$code" != '503' ]; then
            echo "Expected 400 (signature guard) or 503 (secret not configured) for unsigned webhook, got $code"
            cat /tmp/stripe-webhook.txt
            exit 1
          fi
          echo "Stripe webhook rejects unsigned payload: $code"

          code="$(curl -sS -o /tmp/auditor-status.txt -w '%{http_code}' "$BASE/agent-control-auditor/status")"
          if [ "$code" != '401' ]; then
            echo "Expected 401 for unpaid Agent Control Auditor Pro, got $code"
            cat /tmp/auditor-status.txt
            exit 1
          fi
          echo "Agent Control Auditor unpaid guard OK: 401"
