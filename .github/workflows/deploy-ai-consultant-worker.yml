name: Deploy AI Consultant Verification Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-ai-consultant-worker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy Worker
        id: deploy
        continue-on-error: true
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Record deploy status
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p .deployment-status
          printf '{"workflow":"ai-consultant-worker","outcome":"%s","source_commit":"%s","checked_at":"%s"}\n' "$DEPLOY_OUTCOME" "$COMMIT_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deployment-status/ai-consultant-worker.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deployment-status/ai-consultant-worker.json
          if ! git diff --cached --quiet; then
            git commit -m "Record AI consultant Worker deployment status"
            git push
          fi

      - name: Fail workflow if deploy failed
        if: steps.deploy.outcome != 'success'
        run: exit 1
