name: Promote Cross-Agent Kit on Home Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-cross-agent-home-once.yml'

permissions:
  contents: write

concurrency:
  group: promote-cross-agent-home-once
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Make Cross-Agent Personal the primary home CTA
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          stylesheet = '  <link rel="stylesheet" href="styles.css">'
          analytics = '  <script src="/scos-analytics.js" defer></script>'
          if analytics not in s:
              if stylesheet not in s:
                  raise SystemExit('Expected stylesheet anchor not found')
              s = s.replace(stylesheet, stylesheet + '\n' + analytics, 1)

          old_nav = '        <a href="#revenue-router">$29 Revenue Router</a>'
          new_nav = '        <a href="cross-agent-operating-kit.html?utm_source=stratumpraxis&utm_medium=owned_web&utm_campaign=cross_agent_personal&utm_content=home_nav&route_id=owned_home_nav_cross_agent_personal_20260831">Cross-Agent Kit · $69</a>'
          if new_nav not in s:
              if old_nav not in s:
                  raise SystemExit('Expected Revenue Router nav anchor not found')
              s = s.replace(old_nav, new_nav, 1)

          live_primary = '            <a class="button button-primary" href="live-lab.html" data-track="home_to_live_lab">Open the Interactive Live Lab</a>'
          live_secondary = '            <a class="button button-secondary" href="live-lab.html" data-track="home_to_live_lab">Open the Interactive Live Lab</a>'
          product = '            <a class="button button-primary" href="cross-agent-operating-kit.html?utm_source=stratumpraxis&utm_medium=owned_web&utm_campaign=cross_agent_personal&utm_content=home_hero&route_id=owned_home_hero_cross_agent_personal_20260831" data-track="home_to_cross_agent_personal">Cross-Agent Operating Kit — Personal · $69</a>'
          if product not in s:
              if live_primary not in s:
                  raise SystemExit('Expected primary Live Lab CTA not found')
              s = s.replace(live_primary, product + '\n' + live_secondary, 1)

          path.write_text(s, encoding='utf-8')

      - name: Verify revenue route
        run: |
          set -euo pipefail
          grep -Fq 'Cross-Agent Operating Kit — Personal · $69' index.html
          grep -Fq 'route_id=owned_home_hero_cross_agent_personal_20260831' index.html
          grep -Fq 'route_id=owned_home_nav_cross_agent_personal_20260831' index.html
          grep -Fq '/scos-analytics.js' index.html
          test "$(grep -Fo 'route_id=owned_home_hero_cross_agent_personal_20260831' index.html | wc -l)" -eq 1

      - name: Persist change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Make Cross-Agent Personal the primary home revenue CTA"
          git pull --rebase origin main
          git push
