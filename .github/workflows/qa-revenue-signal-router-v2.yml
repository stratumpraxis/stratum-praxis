name: QA Revenue Signal Router V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-revenue-signal-router-v2.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST QA checkout signal
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT='https://fzqgpaxqolrjjhmxdcrf.supabase.co/functions/v1/stratum-b2b-funnel-sensor'
          BODY='{"event_id":"qa_checkout_router_v2_20261013_1538","route_id":"checkout_workflow_audit","event_type":"CHECKOUT_CLICK","path":"/workflow-audit.html","utm_source":"qa","utm_medium":"qa","utm_campaign":"revenue_router_v2","utm_content":"qa_checkout","referrer_host":"stratumpraxis.com","session_key":"qa_checkout_router_v2_session","input_trusted":true,"webdriver":false,"qa":true}'
          code="$(curl -sS -o /tmp/body.txt -w '%{http_code}' -X POST "$ENDPOINT"             -H 'Origin: https://stratumpraxis.com'             -H 'Content-Type: text/plain;charset=UTF-8'             --data "$BODY")"
          cat /tmp/body.txt
          echo
          echo "HTTP_STATUS=$code"
          test "$code" = "202"

# retry after DB constraint update
