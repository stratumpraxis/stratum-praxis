name: Pinterest Revenue Lane Dry Run

on:
  push:
    branches:
      - ops/pinterest-revenue-lane-20260902
    paths:
      - .github/triggers/pinterest-revenue-dry-run.txt

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Safety audit Pinterest queue
        env:
          BUFFER_QUEUE_FILE: pinterest-queue.json
          MAX_SERVICES_PER_ITEM: '1'
          REQUIRE_UTM: '1'
          ALLOWED_REVENUE_DOMAINS: stratumpraxis.com
        run: node distribution/safety-audit.mjs
      - name: Dry run Pinterest publisher
        id: publisher
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_QUEUE_FILE: pinterest-queue.json
          BUFFER_TARGET_SERVICES: pinterest
          BUFFER_SELECT_MODE: first
          REQUIRE_ELIGIBLE_CHANNELS: '1'
          DRY_RUN: '1'
        run: |
          set +e
          node distribution/buffer-publisher.mjs > distribution/pinterest-dry-run.log 2>&1
          code=$?
          cat distribution/pinterest-dry-run.log
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit dry-run evidence
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          printf 'exit_code=%s\n' '${{ steps.publisher.outputs.exit_code }}' > distribution/pinterest-dry-run-status.txt
          git add distribution/pinterest-dry-run.log distribution/pinterest-dry-run-status.txt
          git commit -m "evidence: capture Pinterest revenue dry run" || exit 0
          git push
      - name: Fail when publisher failed
        if: steps.publisher.outputs.exit_code != '0'
        run: exit 1
