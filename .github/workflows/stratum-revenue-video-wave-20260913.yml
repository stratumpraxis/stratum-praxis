name: Stratum Revenue Video Wave

on:
  schedule:
    - cron: '30 13 13 9 *' # Sep 13 22:30 JST — $39 lane
    - cron: '30 13 14 9 *' # Sep 14 22:30 JST — $499 lane
  workflow_dispatch:
    inputs:
      lane:
        description: Revenue lane to publish
        required: true
        type: choice
        options:
          - '39'
          - '499'

permissions:
  contents: write

concurrency:
  group: stratum-revenue-video-wave
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve revenue lane
        id: lane
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            lane="${{ inputs.lane }}"
          elif [ "${{ github.event.schedule }}" = "30 13 13 9 *" ]; then
            lane="39"
          elif [ "${{ github.event.schedule }}" = "30 13 14 9 *" ]; then
            lane="499"
          else
            echo 'Unknown schedule; fail closed.' >&2
            exit 1
          fi
          if [ "$lane" = "39" ]; then
            path='publishing/campaigns/stratum-bluesky-revenue-39-video-20260913.json'
          else
            path='publishing/campaigns/stratum-bluesky-revenue-499-video-20260914.json'
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "lane=$lane" >> "$GITHUB_OUTPUT"

      - name: Publish revenue video through verified Stratum Bluesky account
        env:
          BSKY_IDENTIFIER: stratumpraxis.bsky.social
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: node scripts/publish_bluesky_official.mjs "${{ steps.lane.outputs.path }}"

      - name: Persist publication evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'stratum-revenue-video-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add publishing/evidence/*.json
          if git diff --cached --quiet; then
            echo 'No evidence change.'
            exit 0
          fi
          git commit -m "evidence: record Stratum revenue video lane ${{ steps.lane.outputs.lane }} [skip social]"
          git pull --rebase origin main
          git push origin HEAD:main
