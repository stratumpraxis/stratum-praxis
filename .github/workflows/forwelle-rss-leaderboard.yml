name: Forwelle RSS Performance Leaderboard

on:
  push:
    branches: [forwelle-selfdrive-proof-20260902]
    paths:
      - '.github/triggers/forwelle-rss-leaderboard.txt'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect recent Forwelle feed metrics and rank winners
        run: |
          set -euo pipefail
          mkdir -p automation/forwelle-operator
          python <<'PY'
          import json, urllib.request, xml.etree.ElementTree as ET, datetime
          channel_id='UCw9wnPzccaPba5rLKWyL6nQ'
          url=f'https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 ForwelleMetrics/2.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
              xml=r.read()
          root=ET.fromstring(xml)
          ns={'atom':'http://www.w3.org/2005/Atom','yt':'http://www.youtube.com/xml/schemas/2015','media':'http://search.yahoo.com/mrss/'}
          rows=[]
          now=datetime.datetime.now(datetime.timezone.utc)
          for e in root.findall('atom:entry',ns):
              vid=e.findtext('yt:videoId',default='',namespaces=ns)
              stat=e.find('media:group/media:community/media:statistics',ns)
              rating=e.find('media:group/media:community/media:starRating',ns)
              published=e.findtext('atom:published',default='',namespaces=ns)
              try:
                  pub_dt=datetime.datetime.fromisoformat(published.replace('Z','+00:00'))
                  age_h=max((now-pub_dt).total_seconds()/3600, 0.01)
              except Exception:
                  age_h=None
              views=int(stat.attrib.get('views','0')) if stat is not None else None
              rows.append({
                  'videoId':vid,
                  'title':e.findtext('atom:title',default='',namespaces=ns),
                  'publishedAt':published,
                  'updatedAt':e.findtext('atom:updated',default='',namespaces=ns),
                  'views':views,
                  'ratingCount':int(rating.attrib.get('count','0')) if rating is not None else None,
                  'viewsPerHourApprox':round(views/age_h,2) if views is not None and age_h else None,
                  'url':f'https://www.youtube.com/watch?v={vid}'
              })
          by_views=sorted(rows,key=lambda x:(x['views'] if x['views'] is not None else -1),reverse=True)
          by_vph=sorted(rows,key=lambda x:(x['viewsPerHourApprox'] if x['viewsPerHourApprox'] is not None else -1),reverse=True)
          result={
              'capturedAt':now.isoformat(),
              'source':'youtube-public-rss',
              'channelId':channel_id,
              'videoCount':len(rows),
              'winnerByViews':by_views[0] if by_views else None,
              'winnerByApproxVPH':by_vph[0] if by_vph else None,
              'videosByViews':by_views
          }
          out='automation/forwelle-operator/rss-leaderboard-20260902.json'
          with open(out,'w',encoding='utf-8') as f:
              json.dump(result,f,ensure_ascii=False,indent=2); f.write('\n')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Persist leaderboard evidence with retry
        run: |
          set -euo pipefail
          BRANCH='forwelle-selfdrive-proof-20260902'
          git config user.name 'forwelle-metrics'
          git config user.email 'forwelle.media@gmail.com'
          git add automation/forwelle-operator/rss-leaderboard-20260902.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record Forwelle RSS performance leaderboard'
          for attempt in 1 2 3; do
            git pull --rebase origin "$BRANCH" && git push origin HEAD:"$BRANCH" && exit 0
            sleep $((attempt * 2))
          done
          exit 1
