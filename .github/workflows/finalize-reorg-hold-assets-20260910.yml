name: Finalize reorg hold assets

on:
  push:
    paths:
      - .github/workflows/finalize-reorg-hold-assets-20260910.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply safe hold handling and B2B experience
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for name in ['passage-hub/index.html', 'passage-network.html', 'ordlume/index.html']:
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              if re.search(r'<meta\s+name=["\']robots["\']', s, re.I):
                  s = re.sub(r'<meta\s+name=["\']robots["\']\s+content=["\'][^"\']*["\']\s*/?>', '<meta name="robots" content="noindex,follow">', s, count=1, flags=re.I)
              else:
                  s = s.replace('</head>', '<meta name="robots" content="noindex,follow">\n</head>', 1)
              p.write_text(s, encoding='utf-8')

          p = Path('sitemap.xml')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              for url in ['https://stratumpraxis.com/passage-hub/', 'https://stratumpraxis.com/passage-network.html', 'https://stratumpraxis.com/ordlume/']:
                  s = re.sub(r'\s*<url><loc>' + re.escape(url) + r'</loc>.*?</url>', '', s)
              p.write_text(s, encoding='utf-8')

          targets = [
              'index.html', 'ai-agent-economics-calculator.html', 'b2b/index.html',
              'agent-control-auditor.html', 'workflow-audit.html', 'product-router.html',
              'live-lab.html', 'ai-saas-waste-calculator.html',
              'ai-saas-spend-waste-audit.html', 'ai-consultant.html'
          ]
          css = '<link rel="stylesheet" href="/b2b-experience-2026.css" data-sp-b2b-experience>'
          js = '<script src="/b2b-experience-2026.js" defer data-sp-b2b-experience></script>'
          changed=[]
          for name in targets:
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8'); old=s
              if 'b2b-experience-2026.css' not in s and '</head>' in s:
                  s=s.replace('</head>',f'  {css}\n</head>',1)
              if 'b2b-experience-2026.js' not in s:
                  if '</body>' in s:
                      s=s.replace('</body>',f'  {js}\n</body>',1)
                  else:
                      s += '\n'+js+'\n'
              if s!=old:
                  p.write_text(s,encoding='utf-8'); changed.append(name)
          print('B2B rollout:', ', '.join(changed) if changed else 'already applied')

          memo = Path('docs/REORG_HOLD_AND_CANONICAL_CANDIDATES_20260910.md')
          memo.parent.mkdir(parents=True, exist_ok=True)
          memo.write_text("""# 再編成｜保留・正規ページ候補メモ 2026-09-10

## ② 非公開 / 保留
- Passage Hub — https://stratumpraxis.com/passage-hub/
- Passage Network — https://stratumpraxis.com/passage-network.html
- Ordlume — https://stratumpraxis.com/ordlume/

処理方針: メインHPに出さない / `noindex,follow` / sitemap除外 / URLとコードは保存 / 404化しない。

## 安全ルール
- 新しい正規ページ完成前に旧URLを削除しない。
- 同内容を複製公開する前に canonical / redirect を決める。
- 再配置時だけ301と内部リンクを整理する。
- Stratumの主要導線はB2Bのみを維持する。
""", encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add passage-hub/index.html passage-network.html ordlume/index.html sitemap.xml docs/REORG_HOLD_AND_CANONICAL_CANDIDATES_20260910.md
          git add index.html ai-agent-economics-calculator.html b2b/index.html agent-control-auditor.html workflow-audit.html product-router.html live-lab.html ai-saas-waste-calculator.html ai-saas-spend-waste-audit.html ai-consultant.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: preserve reorg and roll out B2B multilingual design"
            git push
          fi
