name: Finalize reorg hold assets
on:
  push:
    paths:
      - '.github/workflows/finalize-reorg-hold-assets-20260910.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe hold handling and memo
        shell: python
        run: |
          from pathlib import Path
          import re

          targets = [
              Path('passage-hub/index.html'),
              Path('passage-network.html'),
              Path('ordlume/index.html'),
          ]
          for p in targets:
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              # Keep the public URL alive, but stop active search indexing while held.
              if 'name="robots"' in s:
                  s = re.sub(r'<meta\s+name="robots"\s+content="[^"]*"\s*/?>', '<meta name="robots" content="noindex,follow">', s, count=1, flags=re.I)
              else:
                  s = s.replace('</head>', '<meta name="robots" content="noindex,follow">\n</head>', 1)
              p.write_text(s, encoding='utf-8')

          sitemap = Path('sitemap.xml')
          if sitemap.exists():
              s = sitemap.read_text(encoding='utf-8')
              for url in [
                  'https://stratumpraxis.com/passage-hub/',
                  'https://stratumpraxis.com/passage-network.html',
                  'https://stratumpraxis.com/ordlume/',
              ]:
                  s = re.sub(r'\s*<url><loc>'+re.escape(url)+r'</loc>.*?</url>', '', s)
              sitemap.write_text(s, encoding='utf-8')

          memo = Path('docs/REORG_HOLD_AND_CANONICAL_CANDIDATES_20260910.md')
          memo.parent.mkdir(parents=True, exist_ok=True)
          memo.write_text('''# 再編成｜保留・正規ページ候補メモ 2026-09-10

