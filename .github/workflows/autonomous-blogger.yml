name: Autonomous Blogger

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: write

concurrency:
  group: autonomous-blogger
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run free-only blogger lane
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BLOGGER_FREE_MODEL: ${{ vars.BLOGGER_FREE_MODEL || '@cf/google/gemma-4-26b-a4b-it' }}
        run: node acquisition/blogger/free-runner.mjs
      - name: Commit blogger artifacts and state
        if: always()
        run: |
          if git diff --quiet -- acquisition/blogger; then
            echo "No blogger changes"
            exit 0
          fi
          git config user.name "stratum-blogger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add acquisition/blogger/outbox acquisition/blogger/state.json
          git commit -m "chore(blogger): store autonomous editorial output"
          git push
