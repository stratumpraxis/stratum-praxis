name: Autonomous Revenue Publisher

# Event-driven Stratum publishing. No time-based scheduler.
on:
  workflow_dispatch:
    inputs:
      local_only:
        description: 'Use project-owned deterministic evidence fallback only'
        type: boolean
        default: false
  repository_dispatch:
    types:
      - stratum_publish_event
      - stratum_source_ready
      - stratum_revenue_signal
  push:
    branches: [main]
    paths:
      - 'acquisition/media-engine/sources.json'
      - 'acquisition/blogger/free-runner.mjs'
      - 'acquisition/blogger/local-fallback.mjs'
      - 'acquisition/blogger/owned-publisher.mjs'
      - 'acquisition/blogger/state.json'
      - '.github/workflows/autonomous-blogger.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: autonomous-revenue-publisher
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate one article with free-only Workers AI
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.local_only != true }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BLOGGER_FREE_MODEL: ${{ vars.BLOGGER_FREE_MODEL || '@cf/google/gemma-4-26b-a4b-it' }}
        run: |
          set -o pipefail
          node acquisition/blogger/free-runner.mjs 2>&1 | tee acquisition/blogger/last-run.log
      - name: Use project-owned evidence fallback when selected or provider unavailable
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.local_only }}" = "true" ]; then
            echo 'LOCAL_ONLY selected: no external generation provider'
            node acquisition/blogger/local-fallback.mjs 2>&1 | tee acquisition/blogger/last-run.log
          elif [ -f acquisition/blogger/last-run.log ] && grep -Eq 'BLOGGER_STOP WORKERS_AI_ERROR|BLOGGER_BLOCKED|FREE_TIER_STOP' acquisition/blogger/last-run.log; then
            node acquisition/blogger/local-fallback.mjs 2>&1 | tee acquisition/blogger/last-run.log
          else
            echo 'Workers AI generation did not require fallback'
          fi
      - name: Route READY output to Stratum owned Signal site
        if: always()
        run: node acquisition/blogger/owned-publisher.mjs
      - name: Commit generated revenue media, sitemap, diagnostics and state
        id: persist
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- acquisition/blogger signal/auto signal/sitemap.xml publishing/queue content/dev/auto; then
            echo "No autonomous revenue changes"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "stratum-revenue-publisher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add acquisition/blogger/outbox acquisition/blogger/state.json acquisition/blogger/last-run.log signal/auto signal/sitemap.xml publishing/queue
          if [ -d content/dev/auto ]; then
            git add content/dev/auto
          fi
          git commit -m "chore(revenue): publish evidence-grounded owned media"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "committed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Publisher evidence push failed after bounded retries." >&2
          exit 1

      - name: Dispatch project-owned official channel publishers
        if: steps.persist.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WP_ENABLED: ${{ vars.STRATUM_WORDPRESS_ENABLED || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t queue_files < <(git show --pretty='' --name-only HEAD | grep '^publishing/queue/stratum-' || true)
          for package in "${queue_files[@]}"; do
            case "$package" in
              publishing/queue/stratum-bluesky-*.json)
                gh workflow run stratum-bluesky-publish.yml --ref main -f package_path="$package"
                echo "DISPATCHED_BLUESKY $package"
                ;;
              publishing/queue/stratum-devto-*.json)
                gh workflow run stratum-devto-publish.yml --ref main -f package_path="$package"
                echo "DISPATCHED_DEVTO $package"
                ;;
              publishing/queue/stratum-wordpress-*.json)
                if [ "$WP_ENABLED" = "true" ]; then
                  gh workflow run stratum-wordpress-publish.yml --ref main -f package_path="$package"
                  echo "DISPATCHED_WORDPRESS $package"
                else
                  echo "WORDPRESS_AUTH_GATE $package"
                fi
                ;;
            esac
          done
