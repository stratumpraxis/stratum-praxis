name: Forwelle Direct Short 20260902

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/forwelle-direct-short-20260902.txt'

permissions:
  contents: read

jobs:
  render-publish-measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_CHANNEL_ID: UCw9wnPzccaPba5rLKWyL6nQ
      TARGET_TITLE: "AI Isn't Making You Money — The Workflow Trap #Shorts"
      FULL_VIDEO_URL: https://www.youtube.com/watch?v=rPYeG1LYgRg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Render original 9-second Forwelle teaser
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pillow
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          mkdir -p /tmp/forwelle-short
          python <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          W,H=1080,1920
          BG=(8,10,14); FG=(232,234,238); MUTED=(168,173,181)
          font_bold='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          font_reg='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          slides=[
            ("AI ISN'T\nMAKING YOU MONEY", "The output is faster. Revenue isn't."),
            ("THE BOTTLENECK\nIS THE WORKFLOW", "Handoffs. Human gates. Decisions."),
            ("FULL BREAKDOWN", "YouTube  →  @forwelle\nWhy AI Isn't Making You Money")
          ]
          out=Path('/tmp/forwelle-short')
          for i,(headline,sub) in enumerate(slides,1):
              im=Image.new('RGB',(W,H),BG); d=ImageDraw.Draw(im)
              d.rounded_rectangle((72,92,310,150),radius=28,fill=(34,38,46))
              label=ImageFont.truetype(font_bold,28)
              d.text((98,108),'FORWELLE',font=label,fill=MUTED)
              hf=ImageFont.truetype(font_bold,92 if i<3 else 106)
              sf=ImageFont.truetype(font_reg,42)
              y=580 if i<3 else 650
              for line in headline.split('\n'):
                  box=d.textbbox((0,0),line,font=hf); tw=box[2]-box[0]
                  d.text(((W-tw)/2,y),line,font=hf,fill=FG); y+=122
              y+=65
              for line in sub.split('\n'):
                  box=d.textbbox((0,0),line,font=sf); tw=box[2]-box[0]
                  d.text(((W-tw)/2,y),line,font=sf,fill=MUTED); y+=62
              d.line((150,1550,930,1550),fill=(65,70,80),width=2)
              foot=ImageFont.truetype(font_reg,28); footer='Performance Media · measured route'
              box=d.textbbox((0,0),footer,font=foot)
              d.text(((W-(box[2]-box[0]))/2,1600),footer,font=foot,fill=(112,118,128))
              im.save(out/f'slide{i}.png')
          PY
          ffmpeg -hide_banner -loglevel error -y \
            -loop 1 -t 3 -i /tmp/forwelle-short/slide1.png \
            -loop 1 -t 3 -i /tmp/forwelle-short/slide2.png \
            -loop 1 -t 3 -i /tmp/forwelle-short/slide3.png \
            -filter_complex "[0:v]fps=30,format=yuv420p[v0];[1:v]fps=30,format=yuv420p[v1];[2:v]fps=30,format=yuv420p[v2];[v0][v1][v2]concat=n=3:v=1:a=0[out]" \
            -map '[out]' -c:v libx264 -pix_fmt yuv420p -movflags +faststart \
            /tmp/forwelle-short/workflow-trap-teaser-v1.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,codec_name,pix_fmt -of json /tmp/forwelle-short/workflow-trap-teaser-v1.mp4

      - name: Rights and technical gate
        shell: bash
        run: |
          set -euo pipefail
          FILE=/tmp/forwelle-short/workflow-trap-teaser-v1.mp4
          test -s "$FILE"
          duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$FILE")"
          width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 "$FILE")"
          height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 "$FILE")"
          test "$width" = '1080'
          test "$height" = '1920'
          python - <<PY
          d=float('$duration')
          assert 8.9 <= d <= 9.1, d
          PY
          echo "RIGHTS_QA=PASS original typography only; no third-party footage, music, voice, logo, or likeness"

      - name: Upload private, validate Forwelle identity, then publish
        id: publish
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/publish.mjs <<'EOF'
          import fs from 'node:fs';
          const required=['YOUTUBE_CLIENT_ID','YOUTUBE_CLIENT_SECRET','YOUTUBE_REFRESH_TOKEN','EXPECTED_CHANNEL_ID','TARGET_TITLE','FULL_VIDEO_URL'];
          for (const name of required) if (!process.env[name]) throw new Error(`Missing ${name}`);

          const tokenResponse=await fetch('https://oauth2.googleapis.com/token',{
            method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},
            body:new URLSearchParams({client_id:process.env.YOUTUBE_CLIENT_ID,client_secret:process.env.YOUTUBE_CLIENT_SECRET,refresh_token:process.env.YOUTUBE_REFRESH_TOKEN,grant_type:'refresh_token'})
          });
          const tokenJson=await tokenResponse.json();
          if(!tokenResponse.ok||!tokenJson.access_token) throw new Error(`OAuth refresh failed: ${tokenJson.error||tokenResponse.status}`);
          const auth={authorization:`Bearer ${tokenJson.access_token}`};

          const video=fs.readFileSync('/tmp/forwelle-short/workflow-trap-teaser-v1.mp4');
          if(video.length<50000) throw new Error(`Video payload too small: ${video.length}`);
          console.log(`VIDEO_BYTES=${video.length}`);
          const metadata={
            snippet:{
              title:process.env.TARGET_TITLE,
              description:`AI can multiply output without multiplying revenue. The bottleneck is often the workflow around the model: handoffs, human gates, and decisions.\n\nFull breakdown: ${process.env.FULL_VIDEO_URL}\n\n#AI #Automation #Workflow #Shorts`,
              categoryId:'28',tags:['AI','Automation','Workflow','Forwelle','Shorts'],defaultLanguage:'en'
            },
            status:{privacyStatus:'private',selfDeclaredMadeForKids:false}
          };
          const boundary=`forwelle_${Date.now()}_${Math.random().toString(16).slice(2)}`;
          const prefix=Buffer.from(`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: video/mp4\r\n\r\n`);
          const suffix=Buffer.from(`\r\n--${boundary}--\r\n`);
          const body=Buffer.concat([prefix,video,suffix]);
          const uploadResponse=await fetch('https://www.googleapis.com/upload/youtube/v3/videos?part=snippet,status&uploadType=multipart',{
            method:'POST',headers:{...auth,'content-type':`multipart/related; boundary=${boundary}`,'content-length':String(body.length)},body
          });
          const uploadJson=await uploadResponse.json();
          if(!uploadResponse.ok||!uploadJson.id) throw new Error(`Private upload failed: ${uploadJson?.error?.errors?.[0]?.reason||uploadJson?.error?.message||uploadResponse.status}`);
          console.log(`PRIVATE_UPLOAD_VIDEO_ID=${uploadJson.id}`);
          console.log(`PRIVATE_UPLOAD_PRIVACY=${uploadJson.status?.privacyStatus||''}`);
          const uploadedChannel=uploadJson.snippet?.channelId||'';
          console.log(`PRIVATE_UPLOAD_CHANNEL_ID=${uploadedChannel}`);
          if(uploadJson.status?.privacyStatus!=='private') throw new Error(`Safety stop: initial upload not private (${uploadJson.status?.privacyStatus||'unknown'})`);
          if(uploadedChannel!==process.env.EXPECTED_CHANNEL_ID) throw new Error(`BRAND_GATE_FAIL uploaded=${uploadedChannel}; left private`);
          console.log('BRAND_GATE=PASS_FORWELLE_PRIVATE_UPLOAD');

          const publishResponse=await fetch('https://www.googleapis.com/youtube/v3/videos?part=status',{
            method:'PUT',headers:{...auth,'content-type':'application/json'},
            body:JSON.stringify({id:uploadJson.id,status:{privacyStatus:'public',selfDeclaredMadeForKids:false}})
          });
          const publishJson=await publishResponse.json();
          if(!publishResponse.ok||publishJson.status?.privacyStatus!=='public') throw new Error(`Public update failed: ${publishJson?.error?.errors?.[0]?.reason||publishJson?.error?.message||publishResponse.status}`);
          const url=`https://www.youtube.com/watch?v=${uploadJson.id}`;
          console.log(`YOUTUBE_VIDEO_ID=${uploadJson.id}`);
          console.log(`YOUTUBE_VIDEO_URL=${url}`);
          console.log(`VERIFIED_CHANNEL_ID=${uploadedChannel}`);
          console.log(`PRIVACY_STATUS=${publishJson.status?.privacyStatus||''}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`video_id=${uploadJson.id}\nvideo_url=${url}\n`);
          EOF
          node /tmp/publish.mjs

      - name: Verify public watch URL
        shell: bash
        env:
          VIDEO_URL: ${{ steps.publish.outputs.video_url }}
        run: |
          set -euo pipefail
          test -n "$VIDEO_URL"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -L -sS -A 'Mozilla/5.0' -o /tmp/watch.html -w '%{http_code}' "$VIDEO_URL" || true)"
            echo "PUBLIC_WATCH_HTTP_ATTEMPT_${attempt}=$code"
            if [ "$code" = '200' ] && grep -qi 'youtube' /tmp/watch.html; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = '1'
          echo "PUBLIC_URL_VERIFIED=$VIDEO_URL"

      - name: Poll public RSS for measured view count
        shell: bash
        env:
          VIDEO_ID: ${{ steps.publish.outputs.video_id }}
        run: |
          set -euo pipefail
          python <<'PY'
          import os,time,urllib.request,xml.etree.ElementTree as ET
          vid=os.environ['VIDEO_ID']
          feed='https://www.youtube.com/feeds/videos.xml?channel_id=UCw9wnPzccaPba5rLKWyL6nQ'
          ns={'yt':'http://www.youtube.com/xml/schemas/2015','media':'http://search.yahoo.com/mrss/'}
          found=False
          for attempt in range(1,7):
              try:
                  req=urllib.request.Request(feed,headers={'User-Agent':'Mozilla/5.0'})
                  xml=urllib.request.urlopen(req,timeout=20).read()
                  root=ET.fromstring(xml)
                  for entry in root.findall('{http://www.w3.org/2005/Atom}entry'):
                      eid=entry.find('yt:videoId',ns)
                      if eid is None or eid.text!=vid: continue
                      stats=entry.find('.//media:community/media:statistics',ns)
                      views=stats.attrib.get('views','UNAVAILABLE') if stats is not None else 'UNAVAILABLE'
                      print(f'RSS_VIDEO_ID={vid}')
                      print(f'RSS_VIEW_COUNT={views}')
                      print(f'RSS_ATTEMPT={attempt}')
                      found=True
                      break
                  if found: break
              except Exception as e:
                  print(f'RSS_ATTEMPT_ERROR={attempt}:{e}')
              if attempt<6: time.sleep(15)
          if not found:
              print('RSS_PROPAGATION=PENDING')
              print('RSS_VIEW_COUNT=UNAVAILABLE')
          PY
