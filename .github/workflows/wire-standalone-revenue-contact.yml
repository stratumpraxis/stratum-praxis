name: Guard standalone revenue contact
on:
  push:
    paths:
      - 'STANDALONE-REVENUE-SITES.md'
      - '.github/workflows/wire-standalone-revenue-contact.yml'
      - '72-hour-household-readiness/**'
      - 'money-resilience/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove public contact layer from standalone utilities
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets=[
            Path('72-hour-household-readiness/index.html'),
            Path('72-hour-household-readiness/gear.html'),
            Path('72-hour-household-readiness/plan.html'),
            Path('money-resilience/index.html'),
          ]
          needles=[
            '<script defer src="/standalone-revenue-contact.js" data-standalone-revenue-contact></script>',
            '<script src="/standalone-revenue-contact.js" defer data-standalone-revenue-contact></script>',
          ]
          changed=[]
          for p in targets:
            if not p.exists():
              raise SystemExit(f'Missing standalone utility: {p}')
            s=p.read_text(encoding='utf-8')
            before=s
            for n in needles:
              s=s.replace(n+'\n','').replace(n,'')
            if s!=before:
              p.write_text(s,encoding='utf-8')
              changed.append(str(p))
          print('cleaned:', ', '.join(changed) if changed else 'already clean')
          PY
      - name: Guard public contact boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets=[
            Path('72-hour-household-readiness/index.html'),
            Path('72-hour-household-readiness/gear.html'),
            Path('72-hour-household-readiness/plan.html'),
            Path('money-resilience/index.html'),
          ]
          for p in targets:
            s=p.read_text(encoding='utf-8')
            if 'standalone-revenue-contact.js' in s:
              raise SystemExit(f'Public contact layer still wired in {p}')
            if 'ordlume.contact@gmail.com' in s:
              raise SystemExit(f'Operating email exposed directly in {p}')
          source=Path('STANDALONE-REVENUE-SITES.md').read_text(encoding='utf-8')
          if 'ordlume.contact@gmail.com' not in source:
            raise SystemExit('Canonical operating contact missing from source of truth')
          if 'not a default public UI element' not in source:
            raise SystemExit('Private-by-default contact rule missing')
          print('Standalone private-contact guard passed')
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet; then echo "No public contact cleanup needed"; exit 0; fi
          git config user.name "stratumpraxis-bot"
          git config user.email "stratumpraxis@users.noreply.github.com"
          git add 72-hour-household-readiness/index.html 72-hour-household-readiness/gear.html 72-hour-household-readiness/plan.html money-resilience/index.html
          git commit -m "Remove public contact layer from standalone utilities"
          git push
